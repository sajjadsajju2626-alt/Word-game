                </p>
                <h1 class="mt-2 font-display text-2xl font-extrabold text-slate-900 sm:text-3xl">
                  Pass device to ${escapeHtml(player.name)}
                </h1>
                <p class="mt-2 text-sm text-slate-600">
                  Previous answers are hidden. When ${escapeHtml(player.name)} is ready, reveal the sheet for letter
                  <span class="font-display font-extrabold text-emerald-800">${state.targetLetter}</span>.
                </p>
                <div class="mx-auto mt-6 ${getLetterBadgeStyle(state.targetLetter, "handoff")} items-center justify-center rounded-xl bg-emerald-700 font-display font-extrabold text-white">
                  ${escapeHtml(state.targetLetter)}
                </div>
                <button type="button" data-action="reveal-handoff"
                  class="mt-7 w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">
                  Reveal ${escapeHtml(player.name)}'s Sheet
                </button>
                <button type="button" data-action="reset-game"
                  class="mt-3 w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                  New Game / Reset
                </button>
              </section>
            </main>`;
        }

        function renderPlaying() {
          const isOnline = state.mode === "online" && state.room;
          const letter = isOnline ? state.room.targetLetter : state.targetLetter;
          const round = isOnline ? state.room.currentRound : state.currentRound;
          const totalRounds = isOnline ? state.room.totalRounds : state.totalRounds;
          const timeLeft = isOnline ? state.onlineTimeLeft : state.timeLeft;
          const maxSec = isOnline ? state.room.timerSeconds : state.timerSeconds;
          const players = isOnline ? getOrderedRoomPlayers(state.room) : [];
          const submittedIds = isOnline ? getOnlineSubmittedIds(state.room) : [];
          const playerName = isOnline
            ? ((state.room.playersMap && state.room.playersMap[myClientId] && state.room.playersMap[myClientId].name) || state.onlineName)
            : ((state.activePlayers.filter((p) => !p.isBot)[state.turnIndex] || {}).name);

          const ratio = maxSec > 0 ? Math.max(0, Math.min(100, (timeLeft / maxSec) * 100)) : 0;
          const urgent = timeLeft <= 10;
          const readyCount = CATEGORIES.filter((c) => validateWordForLetter(state.answers[c.id], letter, c.id).valid).length;

          return `
            <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur-sm">
              <div class="mx-auto flex max-w-4xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
                <div class="flex items-center gap-4 min-w-0">
                  <div class="${getLetterBadgeStyle(letter, "header")} shrink-0 items-center justify-center rounded-lg bg-emerald-700 font-display font-extrabold text-white">${escapeHtml(letter)}</div>
                  <div class="min-w-0">
                    <div class="text-xs font-semibold text-slate-500 font-mono-tabular">
                      Round ${round} of ${totalRounds}${isOnline ? ` · Room ${escapeHtml(state.room.roomCode)}` : ""}
                    </div>
                    <p class="truncate text-sm font-bold text-slate-900">${escapeHtml(playerName || "Player")}'s Sheet</p>
                  </div>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                  <div class="w-28 sm:w-36">
                    <div class="flex items-baseline justify-between text-xs font-semibold">
                      <span id="hud-timer-label" class="${urgent ? "text-red-700" : "text-slate-500"}">${urgent ? "Hurry" : "Time"}</span>
                      <span id="hud-timer-text" class="font-mono-tabular text-base font-bold ${urgent ? "text-red-700" : "text-slate-900"}">${timeLeft}s</span>
                    </div>
                    <div class="mt-1 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
                      <div id="hud-timer-bar" class="h-full transition-[width] duration-300 ${urgent ? "bg-red-600" : "bg-emerald-600"}" style="width:${ratio}%"></div>
                    </div>
                  </div>
                  <button type="button" data-action="toggle-mute"
                    class="rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                    ${soundFx.isMuted() ? "Unmute" : "Mute"}
                  </button>
                  ${!isOnline ? `
                    <button type="button" data-action="toggle-pause"
                      class="rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                      Pause
                    </button>` : ""}
                </div>
              </div>
            </header>

            <main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-8">
              <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
                <p class="text-sm font-medium text-slate-600">
                  Write a word starting with <span class="font-display text-base font-extrabold text-emerald-800">${letter}</span> for each category ·
                  <span id="ready-count" class="font-mono-tabular text-xs font-semibold text-slate-700">${readyCount}/5 ready</span>
                </p>
                <button type="button" data-action="reset-game"
                  class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900">
                  New Game / Reset
                </button>
              </div>

              ${state.onlineError ? `<p class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}

              <form id="play-sheet-form" class="notebook-paper rounded-xl border border-slate-200 p-5 shadow-sm sm:p-7 space-y-5">
                ${CATEGORIES.map((cat, idx) => {
                  const val = state.answers[cat.id];
                  const v = validateWordForLetter(val, letter, cat.id);
                  const lbl = formatCatLabel(cat);
                  const showErr = val.trim().length > 0 && !v.valid;
                  const showOk = val.trim().length > 0 && v.valid;
                  const inputPlaceholder = state.language === "malayalam"
                    ? `${letter} ൽ തുടങ്ങുന്ന ${cat.ml} എഴുതുക`
                    : `Enter ${cat.en.toLowerCase()} starting with "${letter}"`;
                  return `
                    <div class="border-b border-slate-200/80 pb-5 last:border-b-0 last:pb-0">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <label for="cat-${cat.id}" class="flex items-baseline gap-2 text-base font-bold text-slate-900">
                          <span class="font-mono-tabular text-xs font-semibold text-slate-400">0${idx + 1}.</span>
                          <span>${escapeHtml(lbl.primary)}</span>
                          ${lbl.secondary ? `<span class="text-sm font-medium text-slate-500">${escapeHtml(lbl.secondary)}</span>` : ""}
                        </label>
                        <span id="status-${cat.id}" class="text-xs font-semibold ${
                          showOk ? "text-emerald-700" : showErr ? "text-red-700" : "hidden"
                        }">${showOk || showErr ? escapeHtml(v.message) : ""}</span>
                      </div>
                      <input id="cat-${cat.id}" data-cat="${cat.id}" data-idx="${idx}" type="text" autocomplete="off"
                        ${state.submittedOnline ? "disabled" : ""}
                        value="${escapeHtml(val)}"
                        placeholder="${escapeHtml(inputPlaceholder)}"
                        class="cat-input mt-2 w-full rounded-lg border px-3.5 py-2.5 text-base font-medium text-slate-900 focus:outline-none focus:ring-2 ${
                          showErr
                            ? "border-red-400 bg-red-50/40 focus:border-red-600 focus:ring-red-600/15"
                            : showOk
                              ? "border-emerald-400 bg-emerald-50/20 focus:border-emerald-600 focus:ring-emerald-600/20"
                              : "border-slate-300 bg-white focus:border-emerald-600 focus:ring-emerald-600/20"
                        }" />
                    </div>`;
                }).join("")}

                <div class="pt-2">
                  ${state.submittedOnline
                    ? `<div id="online-wait-status" class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-center text-sm font-semibold text-emerald-900">
                         Sheet submitted · Waiting for other players (${submittedIds.length}/${players.length})
                       </div>`
                    : `<button type="submit" class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800 transition-colors">Submit Sheet</button>`}
                </div>
              </form>
            </main>

            ${state.paused ? `
              <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4" role="dialog" aria-modal="true">
                <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-lg space-y-5">
                  <div>
                    <h2 class="font-display text-xl font-extrabold text-slate-900">Game Paused</h2>
                    <p class="mt-1 text-sm text-slate-600">Countdown timer is frozen while paused.</p>
                  </div>
                  <div class="space-y-2.5">
                    <button type="button" data-action="toggle-pause" class="w-full rounded-lg bg-emerald-700 px-4 py-3 text-sm font-bold text-white hover:bg-emerald-800">Resume Game</button>
                    <button type="button" data-action="restart-round" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">Restart Round</button>
                    <button type="button" data-action="reset-game" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100">New Game / Reset</button>
                  </div>
                </div>
              </div>` : ""}`;
        }

        function renderAppeal() {
          const isOnline = state.mode === "online" && state.room;
          const result = isOnline
            ? buildOnlineCurrentRoundResult(state.room)
            : state.roundResults[state.roundResults.length - 1];
          const totalRounds = isOnline ? state.room.totalRounds : state.totalRounds;
          const isAdmin = isCurrentUserAdmin();
          const adminId = getRoomAdminId();
          const adminName = getRoomAdminName();
          const reviewerId = getCurrentReviewerId();
          const chatSender = getCurrentChatSender();
          const passAndPlayHumans = !isOnline && state.mode === "pass_and_play"
            ? state.activePlayers.filter((p) => !p.isBot)
            : [];

          const rawMessages = isOnline
            ? (Array.isArray(state.room.reviewMessages) ? state.room.reviewMessages : [])
            : (Array.isArray(state.reviewMessages) ? state.reviewMessages : []);
          const roundMessages = rawMessages
            .filter((m) => !m.round || Number(m.round) === Number(result.roundNumber))
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          const rulingCount = result.playerScores.reduce((acc, ps) => {
            return acc + CATEGORIES.filter((cat) => ps.cells[cat.id].appealDecision !== "auto").length;
          }, 0);

          return `
            <main class="mx-auto max-w-7xl px-4 py-6 sm:px-8 sm:py-10 space-y-6">
              <section class="flex flex-col gap-4 border-b border-slate-200 pb-5 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center gap-4">
                  <div class="${getLetterBadgeStyle(result.letter, "card")} shrink-0 items-center justify-center rounded-xl bg-amber-600 font-display font-extrabold text-white">${escapeHtml(result.letter)}</div>
                  <div>
                    <p class="text-xs font-semibold text-amber-700">അപ്പീൽ &amp; റിവ്യൂ · Round ${result.roundNumber} of ${totalRounds}</p>
                    <h1 class="font-display text-2xl font-extrabold text-slate-900">Appeal &amp; Review Answers</h1>
                    <p class="mt-0.5 text-sm text-slate-600">
                      ${isAdmin
                        ? `Room Admin (${escapeHtml(adminName)}): Review answers for "${escapeHtml(result.letter)}" — use 5 pts (Match) for spelling or Malayalam/Manglish variations instead of 0 pts (Disapprove).`
                        : `Inspect answers for "${escapeHtml(result.letter)}". Only Room Admin (${escapeHtml(adminName)}) can change rulings — use Review Chat to explain or request a 5-pt match.`}
                    </p>
                  </div>
                </div>
                <div class="flex items-center gap-3 text-xs font-semibold text-slate-600 font-mono-tabular shrink-0">
                  <span>${rulingCount} ${rulingCount === 1 ? "ruling" : "rulings"} applied</span>
                  <span class="text-slate-300">·</span>
                  <span>${roundMessages.length} ${roundMessages.length === 1 ? "message" : "messages"}</span>
                </div>
              </section>

              ${passAndPlayHumans.length > 1 ? `
                <section class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm">
                  <div class="text-xs text-slate-600">
                    <span class="font-bold text-slate-800">Acting as:</span>
                    Only <span class="font-semibold text-emerald-800">${escapeHtml(adminName)} (Admin)</span> can apply 10 pts (Valid), 5 pts (Match), or 0 pts (Disapprove) rulings. Use <span class="font-semibold text-amber-700">5 pts (Match)</span> for minor spelling or Malayalam/Manglish duplicates.
                  </div>
                  <div class="flex flex-wrap gap-1.5 rounded-lg bg-slate-100 p-1">
                    ${passAndPlayHumans.map((p) => `
                      <button type="button" data-action="set-reviewer" data-rid="${p.id}"
                        class="rounded-md px-3 py-1.5 text-xs font-semibold transition-colors ${
                          reviewerId === p.id ? "bg-white text-emerald-800 shadow-sm" : "text-slate-600 hover:text-slate-900"
                        }">${escapeHtml(p.name)}${p.id === adminId ? " · Admin" : ""}</button>`).join("")}
                  </div>
                </section>` : `
                <section class="flex flex-wrap items-center justify-between gap-2 rounded-xl border px-4 py-3 text-xs ${
                  isAdmin ? "border-emerald-200 bg-emerald-50/70 text-emerald-900" : "border-amber-200 bg-amber-50/70 text-amber-900"
                }">
                  <p class="font-medium">
                    ${isAdmin
                      ? `<span class="font-bold">Room Admin Controls:</span> Use <span class="font-semibold text-amber-800">5 pts (Match)</span> to reduce matching words (minor spelling, transliteration, or Malayalam/Manglish variations) from 10 to 5 pts without disapproving to 0.`
                      : `<span class="font-bold">Read-Only Review:</span> Only Room Admin (${escapeHtml(adminName)}) can change scores. Use Review Chat to explain your word or ask Admin to mark a 5-pt match.`}
                  </p>
                </section>`}

              ${state.onlineError ? `<p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}

              <div class="grid gap-6 lg:grid-cols-12 items-start">
                <!-- Answer Review Table & Controls -->
                <div class="lg:col-span-8 min-w-0 space-y-5">
                  <section class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
                    <table class="w-full min-w-[600px] border-collapse text-left text-sm">
                      <thead>
                        <tr class="border-b border-slate-200 bg-slate-50">
                          <th class="px-4 py-3.5 font-semibold text-slate-700">Category</th>
                          ${result.playerScores.map((ps) => {
                            const isSelf = ps.playerId === reviewerId;
                            const isRowAdmin = ps.playerId === adminId;
                            return `
                              <th class="px-4 py-3.5 font-bold text-slate-900">
                                <div class="flex items-center justify-between gap-2">
                                  <span class="truncate">
                                    ${escapeHtml(ps.playerName)}${isRowAdmin ? ' <span class="text-[11px] font-semibold text-emerald-700">(Admin)</span>' : ""}${isSelf && !isRowAdmin ? ' <span class="text-[11px] font-semibold text-slate-500">(You)</span>' : ""}
                                  </span>
                                  <span class="font-mono-tabular text-xs font-bold text-emerald-700 shrink-0">${ps.roundTotal} pts</span>
                                </div>
                              </th>`;
                          }).join("")}
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100">
                        ${CATEGORIES.map((cat) => {
                          const lbl = formatCatLabel(cat);
                          return `
                            <tr class="hover:bg-slate-50/40">
                              <td class="px-4 py-4 align-top font-semibold text-slate-800">
                                <div>${escapeHtml(lbl.primary)}</div>
                                ${lbl.secondary ? `<div class="text-xs font-normal text-slate-500">${escapeHtml(lbl.secondary)}</div>` : ""}
                              </td>
                              ${result.playerScores.map((ps) => {
                                const c = ps.cells[cat.id];
                                const hasWord = c.raw.trim().length > 0;
                                const isValidNow = c.points > 0;
                                const activeRuling = c.appealDecision || "auto";
                                const colorCls = c.status === "unique" ? "text-emerald-700" : c.status === "shared" ? "text-amber-700" : "text-red-700";

                                return `
                                  <td class="px-4 py-4 align-top ${ps.playerId === reviewerId ? "bg-slate-50/50" : ""}">
                                    <div class="space-y-2">
                                      <div class="flex items-start justify-between gap-2">
                                        <div class="min-w-0">
                                          <p class="font-semibold break-words ${!isValidNow ? "text-slate-400 line-through" : "text-slate-900"}">${escapeHtml(c.raw || "—")}</p>
                                          <p class="mt-0.5 text-xs font-medium ${colorCls}">${escapeHtml(c.reason)}</p>
                                        </div>
                                        <span class="font-mono-tabular text-xs font-bold shrink-0 ${c.points === 10 ? "text-emerald-700" : c.points === 5 ? "text-amber-700" : "text-slate-400"}">+${c.points}</span>
                                      </div>
                                      ${hasWord ? (
                                        isAdmin ? `
                                          <div class="flex flex-wrap items-center gap-1 pt-0.5" role="group" aria-label="Admin scoring for ${escapeHtml(ps.playerName)}'s ${escapeHtml(cat.en)}: ${escapeHtml(c.raw)}">
                                            <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="valid"
                                              aria-pressed="${activeRuling === "valid"}"
                                              title="Mark as unique valid word (10 pts)"
                                              class="rounded-md border px-2 py-1 text-[11px] font-semibold whitespace-nowrap transition-colors ${
                                                activeRuling === "valid"
                                                  ? "border-emerald-700 bg-emerald-700 text-white shadow-sm"
                                                  : "border-slate-200 bg-slate-50 text-slate-700 hover:border-emerald-300 hover:bg-emerald-50 hover:text-emerald-800"
                                              }">
                                              10 pts (Valid)
                                            </button>
                                            <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="duplicate"
                                              aria-pressed="${activeRuling === "duplicate"}"
                                              title="Same / matching word (spelling or Malayalam/Manglish variation) — reduces to 5 pts instead of 0"
                                              class="rounded-md border px-2 py-1 text-[11px] font-semibold whitespace-nowrap transition-colors ${
                                                activeRuling === "duplicate"
                                                  ? "border-amber-600 bg-amber-600 text-white shadow-sm"
                                                  : "border-amber-200 bg-amber-50/70 text-amber-800 hover:border-amber-400 hover:bg-amber-100"
                                              }">
                                              5 pts (Match)
                                            </button>
                                            <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="invalid"
                                              aria-pressed="${activeRuling === "invalid"}"
                                              title="Disapprove invalid or wrong-letter word (0 pts)"
                                              class="rounded-md border px-2 py-1 text-[11px] font-semibold whitespace-nowrap transition-colors ${
                                                activeRuling === "invalid"
                                                  ? "border-red-600 bg-red-600 text-white shadow-sm"
                                                  : "border-slate-200 bg-slate-50 text-slate-700 hover:border-red-300 hover:bg-red-50 hover:text-red-700"
                                              }">
                                              0 pts (Disapprove)
                                            </button>
                                            ${activeRuling !== "auto" ? `
                                              <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="auto"
                                                class="px-1 text-[11px] font-medium text-slate-500 hover:text-slate-800 underline">
                                                Reset
                                              </button>` : ""}
                                          </div>` : `
                                          <p class="text-[11px] font-medium text-slate-400">
                                            ${activeRuling !== "auto" ? "Admin ruling applied" : "Admin controls rulings"}
                                          </p>`
                                      ) : ""}
                                    </div>
                                  </td>`;
                              }).join("")}
                            </tr>`;
                        }).join("")}
                      </tbody>
                    </table>
                  </section>

                  <section class="flex flex-col gap-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:flex-row sm:items-center sm:justify-between">
                    <div class="text-xs text-slate-600 space-y-0.5">
                      <p class="font-semibold text-slate-800">Admin-Moderated Scoring · No Answer Editing</p>
                      <p>10 pts (Valid) unique word · 5 pts (Match) same word / spelling or Manglish variation · 0 pts (Disapprove) invalid or wrong letter</p>
                    </div>
                    <div class="flex flex-col gap-2 sm:flex-row sm:items-center shrink-0">
                      <button type="button" data-action="reset-game" class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50 whitespace-nowrap">New Game / Reset</button>
                      ${isAdmin
                        ? `<button type="button" data-action="confirm-appeals" class="inline-flex items-center justify-center gap-2 rounded-lg bg-emerald-700 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-800 whitespace-nowrap">Confirm Scores &amp; Continue →</button>`
                        : `<p class="text-sm font-medium text-slate-600">Waiting for Room Admin (${escapeHtml(adminName)}) to confirm...</p>`}
                    </div>
                  </section>
                </div>

                <!-- Review Chat / Appeals Message Box -->
                <aside id="review-chat-panel" aria-label="Review Chat" class="lg:col-span-4 rounded-xl border border-slate-200 bg-white shadow-sm flex flex-col lg:sticky lg:top-6 overflow-hidden">
                  <div class="border-b border-slate-100 px-4 py-3.5 bg-slate-50/70">
                    <div class="flex items-center justify-between gap-2">
                      <h2 class="font-display text-base font-extrabold text-slate-900">Review Chat</h2>
                      <span class="font-mono-tabular text-[11px] font-semibold text-slate-500">${roundMessages.length} ${roundMessages.length === 1 ? "msg" : "msgs"}</span>
                    </div>
                    <p class="mt-0.5 text-xs text-slate-500">
                      Explain a word, flag an invalid entry, or ask Admin to mark a 5-pt duplicate.
                    </p>
                  </div>

                  <div id="review-chat-list" class="p-4 space-y-2.5 max-h-[340px] lg:max-h-[420px] min-h-[180px] overflow-y-auto bg-white">
                    ${roundMessages.length === 0 ? `
                      <div class="rounded-lg border border-dashed border-slate-200 bg-slate-50/70 px-3.5 py-6 text-center">
                        <p class="text-xs font-semibold text-slate-600">No appeal messages yet</p>
                        <p class="mt-1 text-[11px] text-slate-500">Send a quick note below if you want the Room Admin to review a word or duplicate match.</p>
                      </div>` : roundMessages.map((msg) => {
                        const isMine = msg.senderId === chatSender.id;
                        return `
                          <div class="flex flex-col ${isMine ? "items-end" : "items-start"}">
                            <div class="max-w-[90%] rounded-lg border px-3 py-2 text-xs ${
                              isMine
                                ? "border-emerald-200 bg-emerald-50/80 text-slate-900"
                                : "border-slate-200 bg-slate-50 text-slate-900"
                            }">
                              <div class="flex items-center gap-1.5 text-[11px]">
                                <span class="font-bold ${isMine ? "text-emerald-900" : "text-slate-800"}">${escapeHtml(msg.senderName || "Player")}</span>
                                ${msg.isAdmin ? `<span class="rounded bg-emerald-700 px-1.5 py-0.5 text-[10px] font-bold text-white leading-none">Admin</span>` : ""}
                                ${msg.createdAt ? `<span class="text-slate-400 font-mono-tabular">${escapeHtml(formatChatTime(msg.createdAt))}</span>` : ""}
                              </div>
                              <p class="mt-1 break-words text-slate-800 leading-relaxed">${escapeHtml(msg.text || "")}</p>
                            </div>

        function renderResults() {
          const isOnline = state.mode === "online" && state.room;
          const players = isOnline ? getOrderedRoomPlayers(state.room) : state.activePlayers;
          const resultsList = isOnline ? getOnlineAllRoundResults(state.room) : state.roundResults;
          const result = resultsList[resultsList.length - 1];
          const totalRounds = isOnline ? state.room.totalRounds : state.totalRounds;
          const letterMode = isOnline ? state.room.letterMode : state.letterMode;
          const usedLetters = isOnline ? (state.room.usedLetters || []) : state.usedLetters;
          const canModerate = isCurrentUserAdmin();
          const reviewerId = getCurrentReviewerId();
          const standings = calculateStandings(players, resultsList);

          return `
            <main class="mx-auto max-w-5xl px-4 py-6 sm:px-8 sm:py-10 space-y-8">

                              <td class="px-4 py-3.5 align-top">

                                  <div class="flex items-start justify-between gap-2">
                                    <div class="min-w-0">
                                      <p class="font-semibold break-words ${c.points === 0 ? "text-slate-400 line-through" : "text-slate-900"}">${escapeHtml(c.raw || "—")}</p>
                                      <p class="mt-0.5 text-xs font-medium ${colorCls}">${escapeHtml(c.reason)}</p>
                                    </div>
                                    <span class="font-mono-tabular text-xs font-bold shrink-0 ${c.points === 10 ? "text-emerald-700" : c.points === 5 ? "text-amber-700" : "text-slate-400"}">+${c.points}</span>
                                  </div>
                                  ${canModerate && hasWord ? `
                                    <div class="flex flex-wrap items-center gap-1" role="group" aria-label="Admin quick score for ${escapeHtml(ps.playerName)}'s ${escapeHtml(cat.en)}: ${escapeHtml(c.raw)}">
                                      <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="valid"
                                        aria-pressed="${activeRuling === "valid"}"
                                        class="rounded border px-1.5 py-0.5 text-[10px] font-semibold whitespace-nowrap ${
                                          activeRuling === "valid"
                                            ? "border-emerald-700 bg-emerald-700 text-white"
                                            : "border-slate-200 bg-slate-50 text-slate-600 hover:border-emerald-300 hover:text-emerald-800"
                                        }">
                                        10 pts (Valid)
                                      </button>
                                      <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="duplicate"
                                        aria-pressed="${activeRuling === "duplicate"}"
                                        class="rounded border px-1.5 py-0.5 text-[10px] font-semibold whitespace-nowrap ${
                                          activeRuling === "duplicate"
                                            ? "border-amber-600 bg-amber-600 text-white"
                                            : "border-amber-200 bg-amber-50/70 text-amber-800 hover:border-amber-400 hover:bg-amber-100"
                                        }">
                                        5 pts (Match)

                                      <button type="button" data-action="set-appeal" data-pid="${ps.playerId}" data-cat="${cat.id}" data-decision="invalid"
                                        aria-pressed="${activeRuling === "invalid"}"

              <div class="grid gap-6 lg:grid-cols-12 items-start">
                <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-7">
                  <h2 class="text-sm font-bold text-slate-900">Cumulative Standings</h2>
                  <div class="mt-3 divide-y divide-slate-100">
                    ${standings.map((s) => `
                      <div class="flex items-center justify-between gap-4 py-2.5 text-sm">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-6 font-mono-tabular text-xs font-bold text-slate-500">#${s.rank}</span>
                          <span class="truncate font-semibold text-slate-900">${escapeHtml(s.playerName)}</span>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-slate-500 shrink-0 font-mono-tabular">
                          <span>${s.uniqueCount} unique</span>
                          <span class="text-sm font-bold text-slate-900">${s.totalScore} pts</span>
                        </div>
                      </div>`).join("")}
                  </div>
                </section>

                <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-5 space-y-4">
                  ${!isFinal && canModerate && letterMode === "manual" ? (() => {
                    const roomLang = isOnline
                      ? (state.room.language || (isMalayalamLetter(state.room.targetLetter) ? "malayalam" : state.language))
                      : state.language;
                    const nextAlphabet = getActiveAlphabet(roomLang);
                    const selectedNext = nextAlphabet.includes(state.manualLetter) ? state.manualLetter : getDefaultLetter(roomLang);
                    return `
                    <div>
                      <span class="block text-xs font-semibold text-slate-600">${roomLang === "malayalam" ? "അടുത്ത അക്ഷരം തിരഞ്ഞെടുക്കുക · Pick Next Letter" : "Pick Next Round Letter"}</span>
                      <div class="mt-2 ${roomLang === "malayalam" ? "flex flex-wrap gap-1.5" : "grid grid-cols-7 gap-1"}">
                        ${nextAlphabet.map((l) => `
                          <button type="button" data-action="set-manual-letter" data-letter="${escapeHtml(l)}"
                            class="${roomLang === "malayalam" ? "min-h-7 px-2.5 py-1 text-xs sm:text-sm whitespace-nowrap" : "h-7 text-xs"} rounded font-display font-bold ${selectedNext === l ? "bg-emerald-700 text-white" : usedLetters.includes(l) ? "bg-slate-100 text-slate-400" : "border border-slate-200 bg-white text-slate-700 hover:bg-slate-50"}">${escapeHtml(l)}</button>`).join("")}
                      </div>
                    </div>`;
                  })() : ""}

                  ${canModerate
                    ? isFinal
                      ? `<button type="button" data-action="finish-game" class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">View Final Winner Podium</button>
                         <button type="button" data-action="reopen-appeal" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">Reopen Appeal & Review</button>`
                      : `<button type="button" data-action="next-round" class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">Start Round ${result.roundNumber + 1}</button>
                         <button type="button" data-action="reopen-appeal" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">Reopen Appeal & Review</button>
                         <button type="button" data-action="finish-game" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">End Match Early & Show Podium</button>`
                    : `<p class="text-center text-sm font-medium text-slate-600">Waiting for host to advance...</p>`}
                  <button type="button" data-action="reset-game" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100">New Game / Reset</button>
                </section>
              </div>
            </main>`;
        }

        function renderPodium() {
          const isOnline = state.mode === "online" && state.room;
          const players = isOnline ? getOrderedRoomPlayers(state.room) : state.activePlayers;
          const resultsList = isOnline ? getOnlineAllRoundResults(state.room) : state.roundResults;
          const standings = calculateStandings(players, resultsList);
          const winners = standings.filter((s) => s.rank === 1);
          const winner = winners[0];
          const headline = winners.length > 1
            ? `Tie for 1st: ${winners.map((w) => w.playerName).join(" & ")}`
            : winner ? `${winner.playerName} Wins!` : "Final Standings";

          const top3 = standings.slice(0, 3);
          const slots = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3;

          const roundHistoryEntries = resultsList.map((r) => {
            const sortedPlayers = [...r.playerScores]
              .map((ps) => {
                let uniqueCount = 0;
                let sharedCount = 0;
                let validCount = 0;
                CATEGORIES.forEach((cat) => {
                  const cell = ps.cells[cat.id];
                  if (!cell) return;
                  if (cell.status === "unique") { uniqueCount += 1; validCount += 1; }
                  else if (cell.status === "shared") { sharedCount += 1; validCount += 1; }
                });
                return { ...ps, uniqueCount, sharedCount, validCount };
              })
              .sort((a, b) => b.roundTotal - a.roundTotal || b.uniqueCount - a.uniqueCount || a.playerName.localeCompare(b.playerName));

            const challenged = [];
            r.playerScores.forEach((ps) => {
              CATEGORIES.forEach((cat) => {
                const cell = ps.cells[cat.id];
                if (!cell || !cell.raw || !cell.raw.trim()) return;
                const isChallenged = cell.appealDecision && cell.appealDecision !== "auto";
                if (isChallenged) {
                  const lbl = formatCatLabel(cat);
                  challenged.push({
                    playerName: ps.playerName,
                    categoryLabel: lbl.secondary ? `${lbl.primary} (${lbl.secondary})` : lbl.primary,
                    word: cell.raw,
                    decision: cell.appealDecision,
                    points: cell.points,
                    reason: cell.reason,
                  });
                }
              });
            });

            return { roundNumber: r.roundNumber, letter: r.letter, sortedPlayers, challenged };
          });

          const totalChallenged = roundHistoryEntries.reduce((sum, entry) => sum + entry.challenged.length, 0);

          return `
            <canvas id="podium-confetti-canvas" aria-hidden="true" class="pointer-events-none fixed inset-0 z-40 h-full w-full"></canvas>
            <main class="relative z-10 mx-auto max-w-6xl px-4 py-8 sm:px-8 sm:py-12">
              <div class="grid gap-8 lg:grid-cols-12 items-start">
                <div class="lg:col-span-8 space-y-8 min-w-0">
                  <section class="rounded-xl border border-slate-200 bg-white p-7 text-center shadow-sm">
                    <p class="text-xs font-semibold text-emerald-700">Match Complete · ${resultsList.length} ${resultsList.length === 1 ? "Round" : "Rounds"} Played</p>
                    <h1 class="mt-1 font-display text-3xl font-extrabold text-slate-900 sm:text-4xl">${escapeHtml(headline)}</h1>
                    ${winner ? `<p class="mt-2 text-sm text-slate-600 font-mono-tabular">${winner.totalScore} total points · ${winner.uniqueCount} unique · ${winner.sharedCount} shared</p>` : ""}
                  </section>

                  <section class="grid gap-4 items-end ${slots.length === 3 ? "sm:grid-cols-3" : slots.length === 2 ? "sm:grid-cols-2" : "sm:grid-cols-1 max-w-sm mx-auto"}">
                    ${slots.map((entry) => `
                      <div class="rounded-xl border bg-white p-5 text-center shadow-sm ${entry.rank === 1 ? "border-amber-300 ring-2 ring-amber-400/25 sm:pb-8 sm:pt-7" : "border-slate-200"}">
                        <p class="font-mono-tabular text-xs font-bold text-slate-500">Rank #${entry.rank}</p>
                        <h2 class="mt-1 truncate font-display text-xl font-extrabold text-slate-900">${escapeHtml(entry.playerName)}</h2>
                        <p class="mt-2 font-mono-tabular text-2xl font-extrabold text-emerald-700">${entry.totalScore} <span class="text-xs font-semibold text-slate-500">pts</span></p>
                        <p class="mt-1 text-xs text-slate-500 font-mono-tabular">${entry.uniqueCount} unique · ${entry.sharedCount} shared</p>
                      </div>`).join("")}
                  </section>

                  <section class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
                    <table class="w-full border-collapse text-left text-sm">
                      <thead>
                        <tr class="border-b border-slate-200 bg-slate-50">
                          <th class="px-4 py-3 font-semibold text-slate-700">Rank</th>
                          <th class="px-4 py-3 font-semibold text-slate-700">Player</th>
                          ${resultsList.map((r) => `<th class="px-3 py-3 text-right font-mono-tabular text-xs font-semibold text-slate-600">R${r.roundNumber} (${escapeHtml(r.letter)})</th>`).join("")}
                          <th class="px-4 py-3 text-right font-semibold text-slate-900">Total</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100">
                        ${standings.map((s) => `
                          <tr>
                            <td class="px-4 py-3 font-mono-tabular text-xs font-bold text-slate-500">#${s.rank}</td>
                            <td class="px-4 py-3 font-semibold text-slate-900">${escapeHtml(s.playerName)}</td>
                            ${resultsList.map((r) => {
                              const ps = r.playerScores.find((p) => p.playerId === s.playerId);
                              return `<td class="px-3 py-3 text-right font-mono-tabular text-xs text-slate-600">${ps ? ps.roundTotal : 0}</td>`;
                            }).join("")}
                            <td class="px-4 py-3 text-right font-mono-tabular text-sm font-bold text-emerald-700">${s.totalScore}</td>
                          </tr>`).join("")}
                      </tbody>
                    </table>
                  </section>

                  <div class="flex flex-col gap-3 sm:flex-row sm:justify-center">
                    ${(!isOnline || state.room.hostId === myClientId) ? `<button type="button" data-action="play-again" class="rounded-lg bg-emerald-700 px-6 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">Play Again</button>` : ""}
                    <button type="button" data-action="reset-game" class="rounded-lg border border-slate-300 bg-white px-6 py-3.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">New Game / Reset</button>
                  </div>
                </div>

                <aside aria-label="Game History" id="podium-history-sidebar" class="lg:col-span-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm space-y-5 lg:sticky lg:top-6">
                  <div class="flex items-baseline justify-between gap-3 border-b border-slate-100 pb-3.5">
                    <div>
                      <h2 class="font-display text-base font-extrabold text-slate-900">Game History</h2>
                      <p class="mt-0.5 text-xs text-slate-500 font-mono-tabular">
                        ${resultsList.length} ${resultsList.length === 1 ? "round" : "rounds"} · ${totalChallenged} ${totalChallenged === 1 ? "word" : "words"} challenged
                      </p>
                    </div>
                  </div>

                  <div>
                    <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Chosen Letters</p>
                    <div class="mt-2 flex flex-wrap gap-1.5">
                      ${roundHistoryEntries.map((entry) => `
                        <span class="inline-flex items-center gap-1.5 rounded-md border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs font-semibold text-slate-800">
                          <span class="font-mono-tabular text-[11px] text-slate-500">R${entry.roundNumber}</span>
                          <span class="font-display font-extrabold text-emerald-800">${escapeHtml(entry.letter)}</span>
                        </span>`).join("")}
                    </div>
                  </div>

                  <div class="space-y-4">
                    ${roundHistoryEntries.map((entry) => `
                      <section class="rounded-lg border border-slate-200/90 bg-slate-50/50 p-3.5 space-y-3">
                        <div class="flex items-center justify-between gap-2">
                          <div class="flex items-center gap-2 min-w-0">
                            <span class="inline-flex min-w-[1.75rem] items-center justify-center rounded-md bg-emerald-700 px-2 py-0.5 font-display text-xs font-extrabold text-white whitespace-nowrap">${escapeHtml(entry.letter)}</span>
                            <h3 class="text-xs font-bold text-slate-900">Round ${entry.roundNumber}</h3>
                          </div>
                          ${entry.challenged.length > 0
                            ? `<span class="font-mono-tabular text-[11px] font-semibold text-amber-700">${entry.challenged.length} challenged</span>`
                            : `<span class="font-mono-tabular text-[11px] text-slate-400">No challenges</span>`}
                        </div>

                        <div class="space-y-2">
                          ${entry.sortedPlayers.map((ps) => {
                            const pct = Math.max(0, Math.min(100, Math.round((ps.roundTotal / 50) * 100)));
                            return `
                              <div class="space-y-1">
                                <div class="flex items-baseline justify-between gap-2 text-xs">
                                  <span class="truncate font-semibold text-slate-800">${escapeHtml(ps.playerName)}</span>
                                  <span class="shrink-0 font-mono-tabular text-slate-600">
                                    <span class="text-[11px] text-slate-400 mr-1.5">${ps.uniqueCount}U · ${ps.sharedCount}S</span>
                                    <span class="font-bold text-slate-900">${ps.roundTotal} pts</span>
                                  </span>
                                </div>
                                <div class="h-1.5 w-full overflow-hidden rounded-full bg-slate-200/80">
                                  <div class="h-full rounded-full bg-emerald-600" style="width:${pct}%"></div>
                                </div>
                              </div>`;
                          }).join("")}
                        </div>

                        ${entry.challenged.length > 0 ? `
                          <div class="border-t border-slate-200/80 pt-2.5 space-y-2">
                            <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Challenged Words</p>
                            <ul class="space-y-1.5">
                              ${entry.challenged.map((ch) => {
                                const isRejected = ch.decision === "invalid" || ch.decision === "rejected";
                                const isDuplicate = ch.decision === "duplicate";
                                const isApproved = ch.decision === "valid" || ch.decision === "approved";
                                const statusColor = isRejected ? "text-red-700" : isDuplicate ? "text-amber-700" : isApproved ? "text-emerald-700" : "text-amber-700";
                                const statusLabel = isRejected
                                  ? "Disapproved · +0"
                                  : isDuplicate
                                    ? "Match / Same · +5"
                                    : isApproved
                                      ? `Approved · +${ch.points}`
                                      : `Ruled · +${ch.points}`;
                                return `
                                  <li class="rounded-md border border-slate-200/80 bg-white px-2.5 py-2 text-xs">
                                    <div class="flex items-baseline justify-between gap-2">
                                      <span class="font-semibold break-words ${isRejected ? "text-slate-400 line-through" : "text-slate-900"}">${escapeHtml(ch.word)}</span>
                                      <span class="shrink-0 font-mono-tabular text-[11px] font-semibold ${statusColor}">${statusLabel}</span>
                                    </div>
                                    <p class="mt-0.5 text-[11px] text-slate-500">
                                      ${escapeHtml(ch.playerName)} · ${escapeHtml(ch.categoryLabel)}
                                    </p>
                                    <p class="mt-0.5 text-[11px] ${statusColor}">
                                      ${escapeHtml(ch.reason)}
                                    </p>
                                  </li>`;
                              }).join("")}
                            </ul>
                          </div>` : ""}
                      </section>`).join("")}
                  </div>

                  ${totalChallenged === 0 ? `
                    <p class="border-t border-slate-100 pt-3 text-xs text-slate-500">
                      No words were challenged during this match.
                    </p>` : ""}
                </aside>
              </div>
            </main>`;
        }

        // =====================================================================
        // 7B. PODIUM WINNER CONFETTI CANVAS ENGINE
        // =====================================================================
        let confettiRafId = null;
        let confettiWaveTimers = [];
        let confettiResizeHandler = null;
        let confettiActiveForMatch = false;

        function stopPodiumConfetti() {
          if (confettiRafId !== null) {
            cancelAnimationFrame(confettiRafId);
            confettiRafId = null;
          }
          if (confettiWaveTimers.length > 0) {
            confettiWaveTimers.forEach((id) => clearTimeout(id));
            confettiWaveTimers = [];
          }
          if (confettiResizeHandler) {
            window.removeEventListener("resize", confettiResizeHandler);
            confettiResizeHandler = null;
          }
        }

        function startPodiumConfetti() {
          stopPodiumConfetti();
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            return;
          }

          const canvas = document.getElementById("podium-confetti-canvas");
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;

          const colors = [
            "#047857",
            "#10b981",
            "#34d399",
            "#f59e0b",
            "#fbbf24",
            "#f43f5e",
            "#ec4899",
            "#0ea5e9",
            "#6366f1",
            "#a855f7",
          ];
          const shapes = ["rect", "circle", "ribbon", "diamond"];
          const particles = [];

          let width = window.innerWidth;
          let height = window.innerHeight;

          function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }

          resizeCanvas();
          confettiResizeHandler = resizeCanvas;
          window.addEventListener("resize", confettiResizeHandler);

          function pushParticle(x, y, vx, vy, options = {}) {
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            particles.push({
              x,
              y,
              vx,
              vy,
              gravity: (options.gravityBase ?? 0.15) + Math.random() * 0.1,
              drag: 0.986 + Math.random() * 0.008,
              maxVy: 4.2 + Math.random() * 2.6,
              w: shape === "ribbon" ? 4.5 + Math.random() * 3.5 : 6.5 + Math.random() * 5.5,
              h: shape === "ribbon" ? 14 + Math.random() * 8 : 6.5 + Math.random() * 5.5,
              shape,
              color: colors[Math.floor(Math.random() * colors.length)],
              rotation: Math.random() * Math.PI * 2,
              rotationSpeed: (Math.random() - 0.5) * 0.26,
              tilt: Math.random() * Math.PI * 2,
              tiltSpeed: 0.09 + Math.random() * 0.16,
              wobblePhase: Math.random() * Math.PI * 2,
              wobbleSpeed: 0.05 + Math.random() * 0.09,
              wobbleAmp: 0.7 + Math.random() * 0.95,
              alpha: 1,
              life: 0,
              maxLife: (options.lifeBase ?? 320) + Math.random() * 180,
            });
          }

          function spawnBurst(originX, originY, count, spreadMin, spreadMax, speedMin, speedMax, options) {
            for (let i = 0; i < count; i++) {
              const angle = spreadMin + Math.random() * (spreadMax - spreadMin);
              const speed = speedMin + Math.random() * (speedMax - speedMin);
              pushParticle(
                originX + (Math.random() - 0.5) * 34,
                originY + (Math.random() - 0.5) * 22,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                options
              );
            }
          }

          function spawnTopShower(count, options) {
            for (let i = 0; i < count; i++) {
              const x = width * (0.04 + Math.random() * 0.92);
              const y = -12 - Math.random() * 70;
              const vx = (Math.random() - 0.5) * 3.4;
              const vy = 1.6 + Math.random() * 4.2;
              pushParticle(x, y, vx, vy, { gravityBase: 0.11, lifeBase: 360, ...options });
            }
          }

          function scheduleWave(delayMs, fn) {
            const timerId = setTimeout(() => {
              confettiWaveTimers = confettiWaveTimers.filter((id) => id !== timerId);
              if (state.phase !== "gameover") return;
              fn();
            }, delayMs);
            confettiWaveTimers.push(timerId);
          }

          // Wave 1 (0ms): high-energy side cannons + full-width top shower
          spawnBurst(width * 0.08, height * 0.76, 85, -Math.PI * 0.45, -Math.PI * 0.12, 12, 22);
          spawnBurst(width * 0.92, height * 0.76, 85, -Math.PI * 0.88, -Math.PI * 0.55, 12, 22);
          spawnTopShower(90);

          // Wave 2 (550ms): dual upper-corner celebration bursts
          scheduleWave(550, () => {
            spawnBurst(width * 0.24, height * 0.24, 55, -Math.PI * 0.85, -Math.PI * 0.15, 6, 13);
            spawnBurst(width * 0.76, height * 0.24, 55, -Math.PI * 0.85, -Math.PI * 0.15, 6, 13);
          });

          // Wave 3 (1350ms): center starburst + mid-celebration top shower
          scheduleWave(1350, () => {
            spawnBurst(width * 0.5, height * 0.3, 70, -Math.PI * 0.92, -Math.PI * 0.08, 7, 15);
            spawnTopShower(55);
          });

          // Wave 4 (2400ms): side cannon encore
          scheduleWave(2400, () => {
            spawnBurst(width * 0.1, height * 0.68, 55, -Math.PI * 0.44, -Math.PI * 0.14, 11, 20);
            spawnBurst(width * 0.9, height * 0.68, 55, -Math.PI * 0.86, -Math.PI * 0.56, 11, 20);
          });

          // Wave 5 (3600ms): lingering festive flutter rain
          scheduleWave(3600, () => {
            spawnTopShower(65, { gravityBase: 0.09, lifeBase: 380 });
          });

          let lastTime = performance.now();

          function tick(now) {
            const dt = Math.min((now - lastTime) / 16.667, 2.2);
            lastTime = now;

            ctx.clearRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.life += dt;
              p.vx *= Math.pow(p.drag, dt);
              p.vy = Math.min(p.vy * Math.pow(p.drag, dt) + p.gravity * dt, p.maxVy);
              p.wobblePhase += p.wobbleSpeed * dt;
              p.x += (p.vx + Math.sin(p.wobblePhase) * p.wobbleAmp) * dt;
              p.y += p.vy * dt;
              p.rotation += p.rotationSpeed * dt;
              p.tilt += p.tiltSpeed * dt;

              const fadeStart = p.maxLife * 0.78;
              if (p.life > fadeStart) {
                p.alpha = Math.max(0, 1 - (p.life - fadeStart) / (p.maxLife - fadeStart));
              }

              if (p.life >= p.maxLife || p.y > height + 48) {
                particles.splice(i, 1);
                continue;
              }

              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rotation);
              ctx.scale(1, Math.max(0.18, Math.abs(Math.cos(p.tilt))));
              ctx.fillStyle = p.color;

              if (p.shape === "circle") {
                ctx.beginPath();
                ctx.arc(0, 0, p.w * 0.5, 0, Math.PI * 2);
                ctx.fill();
              } else if (p.shape === "diamond") {
                ctx.beginPath();
                ctx.moveTo(0, -p.h * 0.6);
                ctx.lineTo(p.w * 0.55, 0);
                ctx.lineTo(0, p.h * 0.6);
                ctx.lineTo(-p.w * 0.55, 0);
                ctx.closePath();
                ctx.fill();
              } else {
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              }
              ctx.restore();
            }

            if (particles.length > 0 || confettiWaveTimers.length > 0) {
              confettiRafId = requestAnimationFrame(tick);
            } else {
              stopPodiumConfetti();
            }
          }

          confettiRafId = requestAnimationFrame(tick);
        }

        function render() {
          const activeEl = document.activeElement;
          const preservedInputId =
            activeEl && (activeEl.id === "review-chat-input" || activeEl.id === "lobby-chat-input")
              ? activeEl.id
              : "";
          const chatSelStart = preservedInputId ? activeEl.selectionStart : null;
          const chatSelEnd = preservedInputId ? activeEl.selectionEnd : null;

          document.body.dataset.state = state.paused && state.phase === "playing" ? "paused" : state.phase;
          const root = document.getElementById("app");
          if (state.phase === "title") root.innerHTML = renderTitle();
          else if (state.phase === "lobby") root.innerHTML = renderLobby();
          else if (state.phase === "handoff") root.innerHTML = renderHandoff();
          else if (state.phase === "playing") root.innerHTML = renderPlaying();
          else if (state.phase === "appeal") root.innerHTML = renderAppeal();
          else if (state.phase === "results") root.innerHTML = renderResults();
          else if (state.phase === "gameover") root.innerHTML = renderPodium();

          if (state.phase === "appeal" || state.phase === "lobby") {
            const listId = state.phase === "lobby" ? "lobby-chat-list" : "review-chat-list";
            const chatList = document.getElementById(listId);
            if (chatList) chatList.scrollTop = chatList.scrollHeight;
            if (preservedInputId) {
              const chatInput = document.getElementById(preservedInputId);
              if (chatInput) {
                chatInput.focus();
                if (typeof chatSelStart === "number" && typeof chatSelEnd === "number") {
                  try { chatInput.setSelectionRange(chatSelStart, chatSelEnd); } catch {}
                }
              }
            }
          }

          if (state.phase === "gameover") {
            const isOnline = state.mode === "online" && state.room;
            const players = isOnline ? getOrderedRoomPlayers(state.room) : state.activePlayers;
            const resultsList = isOnline ? getOnlineAllRoundResults(state.room) : state.roundResults;
            const hasWinner = calculateStandings(players, resultsList).some((s) => s.rank === 1);
            if (hasWinner && !confettiActiveForMatch) {
              confettiActiveForMatch = true;
              startPodiumConfetti();
            }
          } else {
            confettiActiveForMatch = false;
            stopPodiumConfetti();
          }

          saveGameState();

          if (state.phase === "playing" && !state.paused && !state.submittedOnline) {
            const first = document.getElementById("cat-name");
            if (first && document.activeElement === document.body) first.focus();
          }
        }

        // =====================================================================
        // 8. EVENT DELEGATION
        // =====================================================================
        document.addEventListener("input", (e) => {
          const t = e.target;
          if (t.id === "solo-name") { state.soloName = t.value; return; }
          if (t.id === "online-name") { state.onlineName = t.value; return; }
          if (t.id === "join-code") { state.joinCode = t.value.toUpperCase(); return; }
          if (t.id === "review-chat-input") {
            state.reviewChatDraft = t.value;
            const counter = t.closest("form")?.querySelector(".font-mono-tabular");
            if (counter) counter.textContent = `${t.value.length}/240`;
            return;
          }
          if (t.id === "lobby-chat-input") {
            state.lobbyChatDraft = t.value;
            return;
          }
          if (t.classList.contains("local-player-input")) {
            const pid = t.dataset.playerId;
            const p = state.localPlayers.find((x) => x.id === pid);
            if (p) p.name = t.value;
            return;
          }
          if (t.classList.contains("cat-input")) {
            const cat = t.dataset.cat;
            state.answers[cat] = t.value;
            const letter = state.mode === "online" && state.room ? state.room.targetLetter : state.targetLetter;
            const v = validateWordForLetter(t.value, letter, cat);
            const showErr = t.value.trim().length > 0 && !v.valid;
            const showOk = t.value.trim().length > 0 && v.valid;
            const statusEl = document.getElementById("status-" + cat);
            if (statusEl) {
              statusEl.textContent = showOk || showErr ? v.message : "";
              statusEl.className = "text-xs font-semibold " + (showOk ? "text-emerald-700" : showErr ? "text-red-700" : "hidden");
            }
            t.className = "cat-input mt-2 w-full rounded-lg border px-3.5 py-2.5 text-base font-medium text-slate-900 focus:outline-none focus:ring-2 " +
              (showErr ? "border-red-400 bg-red-50/40 focus:border-red-600 focus:ring-red-600/15"
                : showOk ? "border-emerald-400 bg-emerald-50/20 focus:border-emerald-600 focus:ring-emerald-600/20"
                  : "border-slate-300 bg-white focus:border-emerald-600 focus:ring-emerald-600/20");

            const readyEl = document.getElementById("ready-count");
            if (readyEl) {
              const ready = CATEGORIES.filter((c) => validateWordForLetter(state.answers[c.id], letter, c.id).valid).length;
              readyEl.textContent = ready + "/5 ready";
            }

            if (state.mode === "online" && state.room && db && !state.submittedOnline) {
              if (draftSyncTimer) clearTimeout(draftSyncTimer);
              const roomCode = state.room.roomCode;
              const snapshot = { ...state.answers };
              draftSyncTimer = setTimeout(() => {
                db.collection("rooms").doc(roomCode).update({
                  [`submissions.${myClientId}`]: snapshot,
                }).catch(() => {});
              }, 350);
            }

            saveGameState();
          }
        });

        document.addEventListener("keydown", (e) => {
          if (e.target.classList && e.target.classList.contains("cat-input") && e.key === "Enter") {
            e.preventDefault();
            const idx = Number(e.target.dataset.idx);
            if (idx < CATEGORIES.length - 1) {
              const next = document.querySelector(`.cat-input[data-idx="${idx + 1}"]`);
              if (next) next.focus();
            } else {
              document.getElementById("play-sheet-form")?.requestSubmit();
            }
            return;
          }
          if (e.key === "Escape" && state.phase === "playing" && state.mode !== "online") {
            state.paused = !state.paused;
            render();
          }
        });

        document.addEventListener("submit", (e) => {
          if (e.target.id === "play-sheet-form") {
            e.preventDefault();
            if (state.mode === "online" && state.room) {
              submitOnlineSheet(false);
            } else {
              submitLocalTurn(false);
            }
          } else if (e.target.id === "review-chat-form") {
            e.preventDefault();
            const input = document.getElementById("review-chat-input");
            const text = input ? input.value : state.reviewChatDraft;
            if (!String(text || "").trim()) return;
            if (state.mode === "online" && state.room) {
              sendOnlineReviewMessage(text);
            } else {
              sendLocalReviewMessage(text);
            }
          } else if (e.target.id === "lobby-chat-form") {
            e.preventDefault();
            const input = document.getElementById("lobby-chat-input");
            const text = input ? input.value : state.lobbyChatDraft;
            if (!String(text || "").trim()) return;
            sendLobbyMessage(text);
          }
        });

        document.addEventListener("click", async (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const act = btn.dataset.action;

          if (act === "set-mode") { state.mode = btn.dataset.mode; state.onlineError = firebaseInitError; render(); }
          else if (act === "set-lang") {
            state.language = btn.dataset.lang;
            const activePool = getActiveAlphabet(state.language);
            if (!activePool.includes(state.manualLetter)) {
              state.manualLetter = getDefaultLetter(state.language);
            }
            render();
          }
          else if (act === "set-bot-count") { state.botCount = Number(btn.dataset.count); render(); }
          else if (act === "set-bot-skill") { state.botDifficulty = btn.dataset.skill; render(); }
          else if (act === "set-rounds") { state.totalRounds = Number(btn.dataset.rounds); render(); }
          else if (act === "set-timer") { state.timerSeconds = Number(btn.dataset.sec); render(); }
          else if (act === "set-letter-mode") { state.letterMode = btn.dataset.lmode; render(); }
          else if (act === "set-manual-letter") { state.manualLetter = btn.dataset.letter; render(); }
          else if (act === "add-player" && state.localPlayers.length < 6) {
            state.localPlayers.push({ id: "lp_" + Date.now(), name: "Player " + (state.localPlayers.length + 1) });
            render();
          }
          else if (act === "remove-player") {
            state.localPlayers = state.localPlayers.filter((p) => p.id !== btn.dataset.id);
            render();
          }
          else if (act === "start-local") { startLocalGame(); }
          else if (act === "create-online-room") { createOnlineRoom(); }
          else if (act === "join-online-room") { joinOnlineRoom(); }
          else if (act === "copy-room-code" && state.room) {
            navigator.clipboard?.writeText(state.room.roomCode).catch(() => {});
            btn.textContent = "Copied!";
          }
          else if (act === "copy-invite-link" && state.room) {
            const url = new URL(window.location.href);
            url.searchParams.set("room", state.room.roomCode);
            navigator.clipboard?.writeText(url.toString()).catch(() => {});
            btn.textContent = "Link Copied!";
          }
          else if (act === "start-online-round") { startOnlineRound(); }
          else if (act === "leave-online-room") { leaveOnlineRoom(); }
          else if (act === "send-lobby-reaction") { sendLobbyReaction(btn.dataset.emoji); }
          else if (act === "send-lobby-quick") { sendLobbyMessage(btn.dataset.text); }
          else if (act === "cycle-avatar") { cycleMyLobbyAvatar(); }
          else if (act === "toggle-ready") { toggleMyLobbyReady(); }
          else if (act === "toggle-riddle-answer") {
            state.lobbyRiddleShowAnswer = !state.lobbyRiddleShowAnswer;
            render();
          }
          else if (act === "next-riddle") {
            state.lobbyRiddleIndex = (state.lobbyRiddleIndex + 1) % LOBBY_RIDDLES.length;
            state.lobbyRiddleShowAnswer = false;
            render();
          }
          else if (act === "reveal-handoff") {
            state.phase = "playing";
            soundFx.playStart();
            startTimer();
            render();
          }
          else if (act === "toggle-mute") { soundFx.toggleMute(); render(); }
          else if (act === "toggle-pause") { state.paused = !state.paused; render(); }
          else if (act === "restart-round") {
            state.paused = false;
            state.answers = createEmptyAnswers();
            state.timeLeft = state.timerSeconds;
            render();
          }
          else if (act === "set-reviewer") {
            if (state.mode === "pass_and_play") {
              state.reviewingPlayerId = btn.dataset.rid;
              render();
            }
          }
          else if (act === "set-appeal") {
            const pid = btn.dataset.pid;
            const cat = btn.dataset.cat;
            const decision = btn.dataset.decision;
            if (state.mode === "online" && state.room) {
              setOnlineAppeal(pid, cat, decision);
            } else {
              setLocalAppeal(pid, cat, decision);
            }
          }
          else if (act === "confirm-appeals") {
            if (!isCurrentUserAdmin()) return;
            if (state.mode === "online" && state.room) {
              confirmOnlineAppeals();
            } else {
              state.phase = "results";
              render();
            }
          }
          else if (act === "reopen-appeal") {
            if (!isCurrentUserAdmin()) return;
            if (state.mode === "online" && state.room) {
              reopenOnlineAppeal();
            } else {
              state.phase = "appeal";
              render();
            }
          }
          else if (act === "next-round") {
            if (state.mode === "online" && state.room) {
              startOnlineRound();
            } else {
              beginLocalRound(state.currentRound + 1);
            }
          }
          else if (act === "finish-game") {
            stopTimer();
            soundFx.playVictory();
            if (state.mode === "online" && state.room && db) {
              try {
                await db.collection("rooms").doc(state.room.roomCode).update({ phase: "gameover" });
              } catch (err) {
                state.onlineError = formatFirebaseError(err, "Failed to end match.");
                render();
              }
            } else {
              state.phase = "gameover";
              render();
            }
          }
          else if (act === "play-again") {
            if (state.mode === "online" && state.room && db) {
              try {
                const resetPayload = {
                  phase: "lobby",
                  currentRound: 0,
                  usedLetters: [],
                  roundHistory: {},
                  submissions: {},
                  submittedMap: {},
                  appeals: {},
                  reviewMessages: [],
                  recentReactions: {},
                };
                Object.keys(state.room.playersMap || {}).forEach((pid) => {
                  resetPayload[`playersMap.${pid}.ready`] = false;
                });
                await db.collection("rooms").doc(state.room.roomCode).update(resetPayload);
              } catch (err) {
                state.onlineError = formatFirebaseError(err, "Failed to reset room.");
                render();
              }
            } else {
              startLocalGame();
            }
          }
          else if (act === "exit-menu" || act === "reset-game") {
            resetGameToMenu();
          }
        });

        // =====================================================================
        // 9. PREVENT ACCIDENTAL PULL-TO-REFRESH & SAFETY-NET PERSISTENCE
        // =====================================================================
        let touchStartY = 0;
        let touchStartX = 0;

        function hasScrolledAncestor(el) {
          let node = el;
          while (node && node !== document.body && node !== document.documentElement) {
            if (node.scrollTop > 0 && node.scrollHeight > node.clientHeight) {
              const style = window.getComputedStyle(node);
              if (style.overflowY === "auto" || style.overflowY === "scroll") {
                return true;
              }
            }
            node = node.parentElement;
          }
          return false;
        }

        document.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length === 1) {
              touchStartY = e.touches[0].clientY;
              touchStartX = e.touches[0].clientX;
            }
          },
          { passive: true }
        );

        document.addEventListener(
          "touchmove",
          (e) => {
            if (state.phase === "title" || e.touches.length !== 1) return;
            const dy = e.touches[0].clientY - touchStartY;
            const dx = e.touches[0].clientX - touchStartX;
            const isVerticalDownPull = dy > 0 && Math.abs(dy) > Math.abs(dx);
            const atTopOfPage = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
            if (isVerticalDownPull && atTopOfPage && !hasScrolledAncestor(e.target)) {
              if (e.cancelable) e.preventDefault();
            }
          },
          { passive: false }
        );

        window.addEventListener("pagehide", () => {
          saveGameState();
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") saveGameState();
        });

        restoreGameState();
        render();
      })();
    </script>
  </body>
