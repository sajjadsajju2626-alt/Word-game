            <text x="980" y="108" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#D1FAE5">${resultsList.length} ${resultsList.length === 1 ? "ROUND" : "ROUNDS"} PLAYED</text>
            <text x="100" y="136" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">Name, Place, Animal, Thing</text>
            <text x="100" y="186" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">${safe(headline)}</text>
            ${winner ? `<text x="100" y="226" font-family="monospace" font-size="16" font-weight="700" fill="#FDE68A">${winner.totalScore} total points · ${winner.uniqueCount} unique · ${winner.sharedCount} shared</text>` : ""}
            ${podiumSvg}
            <text x="72" y="502" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Final Scoreboard</text>
            <rect x="72" y="510" width="936" height="44" fill="#F1F5F9"></rect>
            <text x="92" y="537" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Rank</text>
            <text x="160" y="537" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Player</text>
            <text x="988" y="537" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Total</text>
            ${rowsSvg}
            <rect x="72" y="510" width="936" height="${tableH}" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.2"></rect>
          </svg>`;

          return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        }

        async function generatePodiumScoreboardImage() {
          if (document.fonts && document.fonts.ready && document.fonts.status !== "loaded") {
            try {
              await Promise.race([
                document.fonts.ready,
                new Promise((resolve) => setTimeout(resolve, 350)),
              ]);
            } catch {}
          }

          const data = buildPodiumData();

          // Attempt 1: Crisp 2x Retina PNG canvas
          try {
            const url2x = renderScoreboardCanvas(data, 2);
            if (isValidImageDataUrl(url2x)) return url2x;
          } catch {}

          // Attempt 2: Lightweight 1x PNG canvas fallback (for constrained mobile GPU memory)
          try {
            const url1x = renderScoreboardCanvas(data, 1);
            if (isValidImageDataUrl(url1x)) return url1x;
          } catch {}

          // Attempt 3: Guaranteed standalone SVG image fallback
          return buildFallbackScoreboardSvgDataUrl(data);
        }

        let shareModalRenderToken = 0;

        async function openPodiumShareModal() {
          const token = ++shareModalRenderToken;
          state.shareModalOpen = true;
          state.shareImageBusy = true;
          state.shareImageStatus = "";
          render();

          try {
            const dataUrl = await generatePodiumScoreboardImage();
            if (token !== shareModalRenderToken || !state.shareModalOpen) return;
            state.shareImageDataUrl = isValidImageDataUrl(dataUrl)
              ? dataUrl
              : buildFallbackScoreboardSvgDataUrl(buildPodiumData());
            state.shareImageBusy = false;
            render();
          } catch {
            if (token !== shareModalRenderToken || !state.shareModalOpen) return;
            try {
              state.shareImageDataUrl = buildFallbackScoreboardSvgDataUrl(buildPodiumData());
              state.shareImageBusy = false;
              state.shareImageStatus = "";
            } catch {
              state.shareImageBusy = false;
              state.shareImageStatus = "Could not render scoreboard image. Tap Retry to try again.";
            }
            render();
          }
        }

        async function ensureShareImageReady() {
          if (isValidImageDataUrl(state.shareImageDataUrl)) return state.shareImageDataUrl;
          const generated = await generatePodiumScoreboardImage();
          state.shareImageDataUrl = generated;
          return generated;
        }

        async function downloadPodiumScoreboardImage() {
          const dataUrl = await ensureShareImageReady();
          if (!isValidImageDataUrl(dataUrl)) return;
          const isSvg = dataUrl.startsWith("data:image/svg+xml");
          const fileName = getExportFileName(isSvg);
          try {
            const blob = dataUrlToBlob(dataUrl);
            const url = blob ? URL.createObjectURL(blob) : dataUrl;
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            if (blob) {
              setTimeout(() => URL.revokeObjectURL(url), 4000);
            }
            state.shareImageStatus = isSvg ? "Scoreboard image downloaded!" : "Scoreboard PNG downloaded!";
          } catch {
            state.shareImageStatus = "Download failed. Try right-clicking or long-pressing the preview image to save.";
          }
          render();
        }

        async function nativeSharePodiumImage() {
          const dataUrl = await ensureShareImageReady();
          if (!isValidImageDataUrl(dataUrl)) return;
          const isSvg = dataUrl.startsWith("data:image/svg+xml");
          const fileName = getExportFileName(isSvg);
          const data = buildPodiumData();
          const shareText = `${data.headline} — Name, Place, Animal, Thing (${data.resultsList.length} ${data.resultsList.length === 1 ? "Round" : "Rounds"})`;
          try {
            const blob = dataUrlToBlob(dataUrl);
            if (blob && typeof File !== "undefined" && navigator.share) {
              const file = new File([blob], fileName, { type: isSvg ? "image/svg+xml" : "image/png" });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                  title: "Name, Place, Animal, Thing — Scoreboard",
                  text: shareText,
                  files: [file],
                });
                state.shareImageStatus = "Shared scoreboard image!";
                render();
                return;
              }
            }
            state.shareImageStatus = "Direct image sharing isn't supported in this browser — use Download PNG or Copy Image.";
          } catch (err) {
            if (err && err.name === "AbortError") {
              state.shareImageStatus = "";
            } else {
              state.shareImageStatus = "Unable to open native share sheet — use Download PNG or Copy Image.";
            }
          }
          render();
        }

        async function copyPodiumImageToClipboard() {
          const dataUrl = await ensureShareImageReady();
          if (!isValidImageDataUrl(dataUrl)) return;
          try {
            const blob = dataUrlToBlob(dataUrl);
            if (blob && !dataUrl.startsWith("data:image/svg+xml") && navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== "undefined") {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
              state.shareImageStatus = "Scoreboard image copied to clipboard!";
            } else {
              state.shareImageStatus = "Clipboard image copy isn't supported here — use Download PNG instead.";
            }
          } catch {
            state.shareImageStatus = "Clipboard permission denied — use Download PNG to save the image.";
          }
          render();

            <canvas id="podium-confetti-canvas" aria-hidden="true" class="pointer-events-none fixed inset-0 z-40 h-full w-full"></canvas>

        // =====================================================================
        // 7B. PODIUM WINNER CONFETTI CANVAS ENGINE
        // =====================================================================
        let confettiRafId = null;
        let confettiWaveTimers = [];
        let confettiResizeHandler = null;
        let confettiActiveForMatch = false;

        function stopPodiumConfetti() {
          if (confettiRafId !== null) {
            cancelAnimationFrame(confettiRafId);
            confettiRafId = null;
          }
          if (confettiWaveTimers.length > 0) {
            confettiWaveTimers.forEach((id) => clearTimeout(id));
            confettiWaveTimers = [];
          }
          if (confettiResizeHandler) {
            window.removeEventListener("resize", confettiResizeHandler);
            confettiResizeHandler = null;
          }
        }

        function startPodiumConfetti(modeOverride) {
          stopPodiumConfetti();
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            return;
          }

          const canvas = document.getElementById("podium-confetti-canvas");
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;

          const mode = modeOverride || state.confettiMode || "normal";
          const isFast = mode === "fast";
          const densityScale = isFast ? 0.52 : 1.15;
          const speedScale = isFast ? 1.48 : 1.0;

          const colors = [
            "#047857",
            "#10b981",
            "#34d399",
            "#f59e0b",
            "#fbbf24",
            "#fde047",
            "#f43f5e",
            "#ec4899",
            "#0ea5e9",
            "#6366f1",
            "#a855f7",
          ];
          const shapes = ["rect", "circle", "ribbon", "diamond", "star"];
          const particles = [];

          let width = window.innerWidth;
          let height = window.innerHeight;

          function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }

          resizeCanvas();
          confettiResizeHandler = resizeCanvas;
          window.addEventListener("resize", confettiResizeHandler);

          function pushParticle(x, y, vx, vy, options = {}) {
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            const baseLife = isFast ? 150 : (options.lifeBase ?? 320);
            particles.push({
              x,
              y,
              vx: vx * (isFast ? 1.18 : 1),
              vy: vy * (isFast ? 1.18 : 1),
              gravity: ((options.gravityBase ?? 0.15) + Math.random() * 0.1) * speedScale,
              drag: 0.986 + Math.random() * 0.008,
              maxVy: (4.2 + Math.random() * 2.6) * speedScale,
              w: shape === "ribbon" ? 4.5 + Math.random() * 3.5 : 6.5 + Math.random() * 5.5,
              h: shape === "ribbon" ? 14 + Math.random() * 8 : 6.5 + Math.random() * 5.5,
              shape,
              color: colors[Math.floor(Math.random() * colors.length)],
              rotation: Math.random() * Math.PI * 2,
              rotationSpeed: (Math.random() - 0.5) * 0.26 * speedScale,
              tilt: Math.random() * Math.PI * 2,
              tiltSpeed: (0.09 + Math.random() * 0.16) * speedScale,
              wobblePhase: Math.random() * Math.PI * 2,
              wobbleSpeed: (0.05 + Math.random() * 0.09) * speedScale,
              wobbleAmp: 0.7 + Math.random() * 0.95,
              alpha: 1,
              life: 0,
              maxLife: baseLife + Math.random() * (isFast ? 75 : 180),
            });
          }

          function spawnBurst(originX, originY, count, spreadMin, spreadMax, speedMin, speedMax, options) {
            const scaled = Math.max(8, Math.round(count * densityScale));
            for (let i = 0; i < scaled; i++) {
              const angle = spreadMin + Math.random() * (spreadMax - spreadMin);
              const speed = speedMin + Math.random() * (speedMax - speedMin);
              pushParticle(
                originX + (Math.random() - 0.5) * 34,
                originY + (Math.random() - 0.5) * 22,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                options
              );
            }
          }

          function spawnTopShower(count, options) {
            const scaled = Math.max(10, Math.round(count * densityScale));
            for (let i = 0; i < scaled; i++) {
              const x = width * (0.04 + Math.random() * 0.92);
              const y = -12 - Math.random() * 70;
              const vx = (Math.random() - 0.5) * 3.4;
              const vy = 1.6 + Math.random() * 4.2;
              pushParticle(x, y, vx, vy, { gravityBase: 0.11, lifeBase: 360, ...options });
            }
          }

          function scheduleWave(delayMs, fn) {
            const timerId = setTimeout(() => {
              confettiWaveTimers = confettiWaveTimers.filter((id) => id !== timerId);
              if (state.phase !== "gameover") return;
              fn();
            }, delayMs);
            confettiWaveTimers.push(timerId);
          }

          // Wave 1 (0ms): high-energy side cannons + full-width top shower
          spawnBurst(width * 0.08, height * 0.76, 85, -Math.PI * 0.45, -Math.PI * 0.12, 12, 22);
          spawnBurst(width * 0.92, height * 0.76, 85, -Math.PI * 0.88, -Math.PI * 0.55, 12, 22);
          spawnTopShower(90);

          if (isFast) {
            // Fast / Light mode: single snappy center encore then quick clean settle
            scheduleWave(340, () => {
              spawnBurst(width * 0.5, height * 0.28, 55, -Math.PI * 0.9, -Math.PI * 0.1, 8, 16);
            });
          } else {
            // Normal Vibrant mode: full multi-wave podium celebration
            scheduleWave(550, () => {
              spawnBurst(width * 0.24, height * 0.24, 58, -Math.PI * 0.85, -Math.PI * 0.15, 6, 13);
              spawnBurst(width * 0.76, height * 0.24, 58, -Math.PI * 0.85, -Math.PI * 0.15, 6, 13);
            });
            scheduleWave(1350, () => {
              spawnBurst(width * 0.5, height * 0.28, 76, -Math.PI * 0.92, -Math.PI * 0.08, 7, 15);
              spawnTopShower(60);
            });
            scheduleWave(2400, () => {
              spawnBurst(width * 0.1, height * 0.68, 55, -Math.PI * 0.44, -Math.PI * 0.14, 11, 20);
              spawnBurst(width * 0.9, height * 0.68, 55, -Math.PI * 0.86, -Math.PI * 0.56, 11, 20);
            });
            scheduleWave(3600, () => {
              spawnTopShower(68, { gravityBase: 0.09, lifeBase: 380 });
            });
          }

          let lastTime = performance.now();

          function tick(now) {
            const dt = Math.min((now - lastTime) / 16.667, 2.2);
            lastTime = now;

            ctx.clearRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.life += dt;
              p.vx *= Math.pow(p.drag, dt);
              p.vy = Math.min(p.vy * Math.pow(p.drag, dt) + p.gravity * dt, p.maxVy);
              p.wobblePhase += p.wobbleSpeed * dt;
              p.x += (p.vx + Math.sin(p.wobblePhase) * p.wobbleAmp) * dt;
              p.y += p.vy * dt;
              p.rotation += p.rotationSpeed * dt;
              p.tilt += p.tiltSpeed * dt;

              const fadeStart = p.maxLife * 0.74;
              if (p.life > fadeStart) {
                p.alpha = Math.max(0, 1 - (p.life - fadeStart) / (p.maxLife - fadeStart));
              }

              if (p.life >= p.maxLife || p.y > height + 48) {
                particles.splice(i, 1);
                continue;
              }

              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rotation);
              ctx.scale(1, Math.max(0.18, Math.abs(Math.cos(p.tilt))));
              ctx.fillStyle = p.color;

              if (p.shape === "circle") {
                ctx.beginPath();
                ctx.arc(0, 0, p.w * 0.5, 0, Math.PI * 2);
                ctx.fill();
              } else if (p.shape === "diamond") {
                ctx.beginPath();
                ctx.moveTo(0, -p.h * 0.6);
                ctx.lineTo(p.w * 0.55, 0);
                ctx.lineTo(0, p.h * 0.6);
                ctx.lineTo(-p.w * 0.55, 0);
                ctx.closePath();
                ctx.fill();
              } else if (p.shape === "star") {
                const outerR = p.w * 0.62;
                const innerR = outerR * 0.44;
                ctx.beginPath();
                for (let s = 0; s < 10; s++) {
                  const r = s % 2 === 0 ? outerR : innerR;
                  const a = (s * Math.PI) / 5 - Math.PI / 2;
                  if (s === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                  else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fill();
              } else {
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              }
              ctx.restore();
            }

            if (particles.length > 0 || confettiWaveTimers.length > 0) {
              confettiRafId = requestAnimationFrame(tick);
            } else {
              stopPodiumConfetti();
            }
          }

          confettiRafId = requestAnimationFrame(tick);
        }

        // =====================================================================
        // 9. PREVENT ACCIDENTAL PULL-TO-REFRESH & SAFETY-NET PERSISTENCE
        // =====================================================================
        let touchStartY = 0;
        let touchStartX = 0;

        function hasScrolledAncestor(el) {
          let node = el;
          while (node && node !== document.body && node !== document.documentElement) {
            if (node.scrollTop > 0 && node.scrollHeight > node.clientHeight) {
              const style = window.getComputedStyle(node);
              if (style.overflowY === "auto" || style.overflowY === "scroll") {
                return true;
              }
            }
            node = node.parentElement;
          }
          return false;
        }

        document.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length === 1) {
              touchStartY = e.touches[0].clientY;
              touchStartX = e.touches[0].clientX;
            }
          },
          { passive: true }
        );

        document.addEventListener(
          "touchmove",
          (e) => {
            if (state.phase === "title" || e.touches.length !== 1) return;
            const dy = e.touches[0].clientY - touchStartY;
            const dx = e.touches[0].clientX - touchStartX;
            const isVerticalDownPull = dy > 0 && Math.abs(dy) > Math.abs(dx);
            const atTopOfPage = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
            if (isVerticalDownPull && atTopOfPage && !hasScrolledAncestor(e.target)) {
              if (e.cancelable) e.preventDefault();
            }
          },
          { passive: false }
        );

        window.addEventListener("pagehide", () => {
          saveGameState();
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") saveGameState();
        });

        // =====================================================================
        // 10. NATIVE PHONE BACK BUTTON NAVIGATION (HISTORY API)
        // =====================================================================
        let pendingProgrammaticBacks = 0;
        let currentHistoryKey = "";
        let historyInitialized = false;

        function isProtectedActivePhase(phase) {
          return phase === "handoff" || phase === "playing" || phase === "appeal" || phase === "results";
        }

        function getNavigationSnapshot() {
          const overlay = state.backConfirmOpen
            ? "confirm-exit"
            : state.rulesOpen
              ? "rules"
              : state.reviewMenuOpen
                ? "review-menu"
                : state.reviewChatOpen
                  ? "review-chat"
                  : state.shareModalOpen
                    ? "share-image"
                    : state.historyDrawerOpen
                      ? "history-drawer"
                      : state.phase === "playing" && state.paused
                        ? "pause"
                        : "";
          return {
            phase: state.phase,
            overlay,
            key: `${state.phase}|${overlay}`,
          };
        }

        function initHistoryNavigation() {
          if (historyInitialized || !window.history || !window.history.replaceState) return;
          historyInitialized = true;
          const snap = getNavigationSnapshot();
          try {
            window.history.replaceState({ npat: true, phase: "title", overlay: "", key: "title|" }, "", window.location.href);
            currentHistoryKey = "title|";
            if (snap.key !== "title|") {
              window.history.pushState({ npat: true, ...snap }, "", window.location.href);
              currentHistoryKey = snap.key;
            }
          } catch {
            currentHistoryKey = snap.key;
          }
        }

        function syncHistoryWithState() {
          if (!window.history || !window.history.pushState) return;
          if (!historyInitialized) {
            initHistoryNavigation();
            return;
          }
          const snap = getNavigationSnapshot();
          if (snap.key === currentHistoryKey) return;

          const [prevPhase, prevOverlay] = currentHistoryKey.split("|");
          const nextPhase = snap.phase;
          const nextOverlay = snap.overlay;

          try {
            // Dismissing the leave-confirmation modal ("Stay") keeps the active game guard entry in place
            if (prevOverlay === "confirm-exit" && !nextOverlay && nextPhase === prevPhase) {
              window.history.replaceState({ npat: true, ...snap }, "", window.location.href);
              currentHistoryKey = snap.key;
              return;
            }

            // Closing an overlay/drawer via UI button on the same screen pops its pushed history state cleanly
            if (prevPhase === nextPhase && prevOverlay && !nextOverlay) {
              currentHistoryKey = snap.key;
              pendingProgrammaticBacks += 1;
              window.history.back();
              return;
            }

            // Returning cleanly to root Title screen without overlays
            if (nextPhase === "title" && !nextOverlay) {
              window.history.replaceState({ npat: true, ...snap }, "", window.location.href);
              currentHistoryKey = snap.key;
              return;
            }

            // Navigating to a new screen or opening an overlay/drawer pushes a fresh history state
            window.history.pushState({ npat: true, ...snap }, "", window.location.href);
            currentHistoryKey = snap.key;
          } catch {
            currentHistoryKey = snap.key;
          }
        }

        window.addEventListener("popstate", () => {
          if (pendingProgrammaticBacks > 0) {
            pendingProgrammaticBacks -= 1;
            return;
          }

          // 1. If leave confirmation modal is open, Back dismisses it ("Stay") and keeps the guard armed
          if (state.backConfirmOpen) {
            state.backConfirmOpen = false;
            const guardSnap = { npat: true, phase: state.phase, overlay: "", key: `${state.phase}|` };
            try {
              window.history.pushState(guardSnap, "", window.location.href);
            } catch {}
            currentHistoryKey = guardSnap.key;
            render();
            return;
          }

          // 2. Close open overlays/drawers first instead of leaving the screen
          if (state.rulesOpen) {
            state.rulesOpen = false;
            currentHistoryKey = `${state.phase}|`;
            render();
            return;
          }
          if (state.reviewMenuOpen) {
            state.reviewMenuOpen = false;
            currentHistoryKey = `${state.phase}|`;
            render();
            return;
          }
          if (state.reviewChatOpen) {
            state.reviewChatOpen = false;
            currentHistoryKey = `${state.phase}|`;
            render();
            return;
          }
          if (state.shareModalOpen) {
            state.shareModalOpen = false;
            state.shareImageStatus = "";
            currentHistoryKey = `${state.phase}|`;
            render();
            return;
          }
          if (state.historyDrawerOpen) {
            state.historyDrawerOpen = false;
            currentHistoryKey = `${state.phase}|`;
            render();
            return;
          }
          if (state.phase === "playing" && state.paused) {
            state.paused = false;
            currentHistoryKey = `${state.phase}|`;
            render();
            return;
          }

          // 3. Secondary screens navigate cleanly back inside the app without exiting browser tab
          if (state.phase === "lobby") {
            currentHistoryKey = "title|";
            leaveOnlineRoom();
            return;
          }
          if (state.phase === "gameover") {
            currentHistoryKey = "title|";
            resetGameToMenu();
            return;
          }

          // 4. Protect active gameplay & review sessions from accidental back-exit
          if (isProtectedActivePhase(state.phase)) {
            state.backConfirmOpen = true;
            const confirmSnap = {
              npat: true,
              phase: state.phase,
              overlay: "confirm-exit",
              key: `${state.phase}|confirm-exit`,
            };
            try {
              window.history.pushState(confirmSnap, "", window.location.href);
            } catch {}
            currentHistoryKey = confirmSnap.key;
            render();
          }
        });

        restoreGameState();
        initHistoryNavigation();
        render();
      })();
    </script>
  </body>
</html>
