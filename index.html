                      ${["casual", "sharp"].map((lvl) => `
                        <button type="button" data-action="set-bot-skill" data-skill="${lvl}"
                          class="flex-1 rounded-md py-2 text-xs font-semibold capitalize ${state.botDifficulty === lvl ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">
                          ${lvl}
                        </button>`).join("")}
                    </div>
                  </div>
                </div>
              </div>`;
          } else if (state.mode === "pass_and_play") {
            modePanel = `
              <div class="space-y-3 border-t border-slate-100 pt-5">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-semibold text-slate-800">Players (${state.localPlayers.length}/6)</span>
                  <button type="button" data-action="add-player" ${state.localPlayers.length >= 6 ? "disabled" : ""}
                    class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-40">
                    + Add Player
                  </button>
                </div>
                <div class="space-y-2">
                  ${state.localPlayers.map((p, i) => `
                    <div class="flex items-center gap-2">
                      <span class="w-6 font-mono-tabular text-xs font-semibold text-slate-400">${i + 1}.</span>
                      <input type="text" maxlength="24" data-player-id="${p.id}" value="${escapeHtml(p.name)}"
                        class="local-player-input flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-600/20" />
                      ${state.localPlayers.length > 2 ? `<button type="button" data-action="remove-player" data-id="${p.id}" class="rounded-lg px-2.5 py-2 text-xs font-semibold text-red-600 hover:bg-red-50">Remove</button>` : ""}
                    </div>`).join("")}
                </div>
                <p class="text-xs text-slate-500">A privacy curtain appears between turns so players cannot peek at earlier answers.</p>
              </div>`;
          } else {
            modePanel = `
              <div class="space-y-4 border-t border-slate-100 pt-5">
                <div>
                  <label for="online-name" class="block text-sm font-semibold text-slate-800">Your Display Name</label>
                  <input id="online-name" type="text" maxlength="24" value="${escapeHtml(state.onlineName)}"
                    class="mt-1.5 w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-600/20" />
                </div>
                ${state.onlineError ? `<p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}
                <div class="grid gap-3 sm:grid-cols-2">
                  <button type="button" data-action="create-online-room" ${state.onlineBusy ? "disabled" : ""}
                    class="rounded-lg bg-emerald-700 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-800 disabled:opacity-50">
                    ${state.onlineBusy ? "Connecting..." : "Create Online Room"}
                  </button>
                  <div class="flex gap-2">
                    <input id="join-code" type="text" maxlength="6" placeholder="CODE" value="${escapeHtml(state.joinCode)}"
                      class="w-28 rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-center font-mono-tabular text-sm font-bold uppercase tracking-widest focus:border-emerald-600 focus:outline-none" />
                    <button type="button" data-action="join-online-room" ${state.onlineBusy ? "disabled" : ""}
                      class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 hover:bg-slate-50 disabled:opacity-50">
                      Join
                    </button>
                  </div>
                </div>
                <p class="text-xs text-slate-500">
                  Play across phones, tablets, or laptops in real time via Firebase Firestore (${escapeHtml(firebaseConfig.projectId)}).
                </p>
              </div>`;
          }

          return `
            <main class="mx-auto flex min-h-screen max-w-5xl flex-col justify-between px-4 py-6 sm:px-8 sm:py-10">
              <div class="space-y-8">
                <section class="flex flex-col gap-5 border-b border-slate-200 pb-6 md:flex-row md:items-center md:justify-between">
                  <div class="flex items-start gap-4">
                    <svg viewBox="0 0 64 64" class="h-12 w-12 shrink-0" aria-hidden="true">
                      <rect x="6" y="8" width="52" height="48" rx="10" fill="#065F46"></rect>
                      <rect x="10" y="12" width="44" height="40" rx="6" fill="#FFFFFF"></rect>
                      <line x1="16" y1="24" x2="48" y2="24" stroke="#E2E8F0" stroke-width="2"></line>
                      <line x1="16" y1="34" x2="48" y2="34" stroke="#E2E8F0" stroke-width="2"></line>
                      <line x1="16" y1="44" x2="38" y2="44" stroke="#E2E8F0" stroke-width="2"></line>
                      <circle cx="45" cy="43" r="10" fill="#059669" stroke="#FFFFFF" stroke-width="2.5"></circle>
                      <text x="45" y="47" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">അ</text>
                      <text x="32" y="21" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="800">A–Z</text>
                    </svg>
                    <div>
                      <p class="text-xs font-semibold tracking-wide text-emerald-700">പേര് · സ്ഥലം · മൃഗം · പൂവ് · സാധനം</p>
                      <h1 class="mt-1 text-2xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Name, Place, Animal, Thing</h1>
                      <p class="mt-1 text-sm text-slate-600">10 pts unique word · 5 pts shared word · 0 pts blank or wrong letter</p>
                    </div>
                  </div>
                  <div class="flex flex-wrap items-center gap-2 self-start">
                    <div class="inline-flex rounded-lg bg-slate-100 p-1">
                      ${[
                        { id: "bilingual", label: "ML + EN" },
                        { id: "english", label: "English" },
                        { id: "malayalam", label: "മലയാളം" },
                      ].map((l) => `
                        <button type="button" data-action="set-lang" data-lang="${l.id}"
                          class="rounded-md px-3 py-1.5 text-xs font-semibold whitespace-nowrap ${
                            state.language === l.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900"
                          }">${l.label}</button>`).join("")}
                    </div>
                    <button type="button" data-action="open-rules"
                      class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-xs hover:bg-slate-50 whitespace-nowrap">
                      Rules
                    </button>
                  </div>
                </section>

                <div class="grid gap-8 lg:grid-cols-12 items-start">
                  <section class="space-y-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-7">
                    <div>
                      <h2 class="text-sm font-bold text-slate-900">1. Choose Game Mode</h2>
                      <div class="mt-3 grid grid-cols-3 gap-1 rounded-lg bg-slate-100 p-1">
                        ${modeTab("solo", "Solo vs Bot")}
                        ${modeTab("pass_and_play", "Pass & Play")}
                        ${modeTab("online", "Online Room")}
                      </div>
                    </div>
                    ${modePanel}
                  </section>

                  <section class="space-y-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-5">
                    <h2 class="text-sm font-bold text-slate-900">2. Round & Letter Rules</h2>
                    <div class="grid grid-cols-2 gap-4">
                      <div>
                        <span class="block text-xs font-semibold text-slate-600">Rounds</span>
                        <div class="mt-1.5 flex gap-1 rounded-lg bg-slate-100 p-1">
                          ${[1, 3, 5].map((r) => `
                            <button type="button" data-action="set-rounds" data-rounds="${r}"
                              class="flex-1 rounded-md py-1.5 font-mono-tabular text-xs font-semibold ${state.totalRounds === r ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">${r}</button>`).join("")}
                        </div>
                      </div>
                      <div>
                        <span class="block text-xs font-semibold text-slate-600">Timer</span>
                        <div class="mt-1.5 flex gap-1 rounded-lg bg-slate-100 p-1">
                          ${[30, 60, 90].map((s) => `
                            <button type="button" data-action="set-timer" data-sec="${s}"
                              class="flex-1 rounded-md py-1.5 font-mono-tabular text-xs font-semibold ${state.timerSeconds === s ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">${s}s</button>`).join("")}
                        </div>
                      </div>
                    </div>

                    <div class="space-y-3 border-t border-slate-100 pt-4">
                      <span class="block text-xs font-semibold text-slate-600">${state.language === "malayalam" ? "തുടക്ക അക്ഷരം · Starting Letter" : "Starting Letter"}</span>
                      <div class="grid grid-cols-2 gap-1.5 rounded-lg bg-slate-100 p-1">
                        <button type="button" data-action="set-letter-mode" data-lmode="random"
                          class="rounded-md px-2.5 py-2 text-xs font-semibold leading-tight ${state.letterMode === "random" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">Random Spin</button>
                        <button type="button" data-action="set-letter-mode" data-lmode="manual"
                          class="rounded-md px-2.5 py-2 text-xs font-semibold leading-tight ${state.letterMode === "manual" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">${state.language === "malayalam" ? "അക്ഷരം തിരഞ്ഞെടുക്കുക / Pick Letter" : "Pick A–Z"}</button>
                      </div>
                      ${state.letterMode === "manual" ? `
                        <div class="${state.language !== "english" ? "flex flex-wrap gap-1.5" : "grid grid-cols-7 gap-1"} pt-1">
                          ${getActiveAlphabet(state.language).map((l) => `
                            <button type="button" data-action="set-manual-letter" data-letter="${escapeHtml(l)}"
                              class="${state.language !== "english" ? "min-h-8 min-w-[2.25rem] px-2.5 py-1 text-xs sm:text-sm whitespace-nowrap" : "h-8 text-xs"} rounded-md font-display font-bold ${state.manualLetter === l ? "bg-emerald-700 text-white" : "border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100"}">${escapeHtml(l)}</button>`).join("")}
                        </div>` : ""}
                    </div>

                    ${state.mode !== "online" ? `
                      <button type="button" data-action="start-local"
                        class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800 transition-colors">
                        Start Game
                      </button>` : ""}
                  </section>
                </div>
              </div>
              <p class="mt-8 pt-2 text-center text-xs text-slate-500">
                Enter to jump between categories · Esc to pause · Works with English or Malayalam input
              </p>
            </main>`;
        }

        function renderLobby() {
          const r = state.room;
          const players = getOrderedRoomPlayers(r);
          const isHost = r.hostId === myClientId;
          const readyCount = players.filter((p) => Boolean(p.ready)).length;
          const allReady = players.length > 0 && readyCount === players.length;

          const lobbyMsgs = (Array.isArray(r.lobbyMessages) ? r.lobbyMessages : [])
            .slice()
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
            .slice(-40);

          const riddleIdx = ((state.lobbyRiddleIndex % LOBBY_RIDDLES.length) + LOBBY_RIDDLES.length) % LOBBY_RIDDLES.length;
          const riddle = LOBBY_RIDDLES[riddleIdx];

          return `
            <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-10 space-y-6">
              <!-- Room Header -->
              <section class="rounded-xl border border-slate-200 bg-white p-5 sm:p-6 shadow-sm">
                <div class="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <p class="text-xs font-semibold text-emerald-700">Online Multiplayer Lobby · Firebase Firestore</p>
                    <h1 class="mt-1 font-display text-2xl sm:text-3xl font-extrabold text-slate-900">Room ${escapeHtml(r.roomCode)}</h1>
                    <p class="mt-0.5 text-xs text-slate-500 font-mono-tabular">
                      ${r.totalRounds} rounds · ${r.timerSeconds}s per round · ${r.letterMode === "manual" ? `Starting: ${escapeHtml(r.manualLetter || r.targetLetter || getDefaultLetter(r.language))}` : (r.language === "malayalam" ? "Random Malayalam letter" : "Random letter")}
                    </p>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" data-action="copy-room-code"
                      class="rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
                      Copy Code
                    </button>
                    <button type="button" data-action="copy-invite-link"
                      class="rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
                      Copy Invite Link
                    </button>
                  </div>
                </div>
                ${state.onlineError ? `<p class="mt-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}
              </section>

              <div class="grid gap-6 lg:grid-cols-12 items-start">
                <!-- Left Column: Interactive Players + Warm-Up Riddle -->
                <div class="lg:col-span-7 space-y-6 min-w-0">
                  <!-- Interactive Player Lobby Cards -->
                  <section id="lobby-players-card" class="rounded-xl border border-slate-200 bg-white p-5 sm:p-6 shadow-sm space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <h2 class="font-display text-base font-extrabold text-slate-900">Connected Players (${players.length})</h2>
                        <p class="text-xs text-slate-500">Tap your avatar to customize it and toggle Ready when you're set.</p>
                      </div>
                      <span class="rounded-md border px-2.5 py-1 font-mono-tabular text-xs font-bold ${
                        allReady
                          ? "border-emerald-200 bg-emerald-50 text-emerald-800"
                          : "border-slate-200 bg-slate-50 text-slate-600"
                      }">
                        ${readyCount}/${players.length} Ready
                      </span>
                    </div>

                    <ul class="space-y-2.5">
                      ${players.map((p, idx) => {
                        const isMe = p.id === myClientId;
                        const isRoomHost = p.id === r.hostId;
                        const isReady = Boolean(p.ready);
                        const avatar = getPlayerAvatar(p, idx);
                        return `
                          <li class="flex items-center justify-between gap-3 rounded-xl border px-3.5 py-3 transition-colors ${
                            isReady
                              ? "border-emerald-200 bg-emerald-50/40"
                              : isMe
                                ? "border-slate-300 bg-slate-50/70"
                                : "border-slate-200 bg-white"
                          }">
                            <div class="flex items-center gap-3 min-w-0">
                              ${isMe ? `
                                <button type="button" data-action="cycle-avatar"
                                  title="Tap to change your avatar emoji"
                                  aria-label="Change avatar emoji (currently ${escapeHtml(avatar)})"
                                  class="group relative flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-emerald-200 bg-white text-2xl shadow-xs hover:border-emerald-400 hover:scale-105 active:scale-95 transition-transform">
                                  <span>${escapeHtml(avatar)}</span>
                                  <span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 rounded bg-slate-800 px-1 text-[9px] font-bold text-white leading-tight">Edit</span>
                                </button>` : `
                                <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-slate-50 text-2xl" aria-hidden="true">
                                  ${escapeHtml(avatar)}
                                </div>`}
                              <div class="min-w-0">
                                <div class="flex flex-wrap items-center gap-1.5">
                                  <span class="truncate font-semibold text-sm text-slate-900">${escapeHtml(p.name)}</span>
                                  ${isMe ? `<span class="text-[11px] font-semibold text-slate-500">(You)</span>` : ""}
                                  ${isRoomHost ? `<span class="rounded bg-emerald-700 px-1.5 py-0.5 text-[10px] font-bold text-white leading-none">Host</span>` : ""}
                                </div>
                                <p class="mt-0.5 text-[11px] text-slate-500">
                                  ${isMe ? "Tap avatar to switch emoji" : (isReady ? "Ready to play" : "Getting ready...")}
                                </p>
                              </div>
                            </div>

                            <div class="shrink-0">
                              ${isMe ? `
                                <button type="button" data-action="toggle-ready" aria-pressed="${isReady}"
                                  class="rounded-lg border px-3 py-1.5 text-xs font-bold transition-colors ${
                                    isReady
                                      ? "border-emerald-700 bg-emerald-700 text-white hover:bg-emerald-800"
                                      : "border-slate-300 bg-white text-slate-700 hover:border-emerald-400 hover:text-emerald-800"
                                  }">
                                  ${isReady ? "✓ Ready" : "Mark Ready"}
                                </button>` : `
                                <span class="inline-flex items-center rounded-md border px-2.5 py-1 text-xs font-bold ${
                                  isReady
                                    ? "border-emerald-200 bg-emerald-100/80 text-emerald-800"
                                    : "border-slate-200 bg-slate-100 text-slate-500"
                                }">
                                  ${isReady ? "✓ Ready" : "Waiting"}
                                </span>`}
                            </div>
                          </li>`;
                      }).join("")}
                    </ul>

                    <p class="text-xs text-slate-500">
                      Share code <span class="font-mono-tabular font-bold text-slate-800">${escapeHtml(r.roomCode)}</span> with friends on any device to join this lobby.
                    </p>

                    <div class="flex flex-col gap-3 pt-1 sm:flex-row">
                      ${isHost
                        ? `<button type="button" data-action="start-online-round" class="flex-1 rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800 transition-colors">
                            Start Round 1${players.length > 1 ? ` (${readyCount}/${players.length} Ready)` : ""}
                          </button>`
                        : `<div class="flex-1 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-center text-sm font-medium text-slate-600">Waiting for host to start Round 1...</div>`}
                      <button type="button" data-action="leave-online-room" class="rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors">Leave Room</button>
                    </div>
                  </section>

                  <!-- Warm-Up Riddles & Fun Tips Card -->
                  <section id="lobby-riddle-card" aria-label="Warm-Up Riddle" class="rounded-xl border border-amber-200/80 bg-gradient-to-br from-amber-50/70 via-white to-emerald-50/40 p-5 sm:p-6 shadow-sm space-y-3.5">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-xs font-bold text-amber-800">${escapeHtml(riddle.tag)}</span>
                      <span class="font-mono-tabular text-[11px] font-semibold text-slate-500">Warm-Up ${riddleIdx + 1}/${LOBBY_RIDDLES.length}</span>
                    </div>

                    <div>
                      <p class="font-display text-base sm:text-lg font-extrabold text-slate-900 leading-snug">
                        ${escapeHtml(riddle.question)}
                      </p>
                      ${riddle.subtitle ? `<p class="mt-1 text-xs text-slate-600">${escapeHtml(riddle.subtitle)}</p>` : ""}
                    </div>

                    ${state.lobbyRiddleShowAnswer ? `
                      <div id="lobby-riddle-answer" class="rounded-lg border border-emerald-200 bg-emerald-50/90 px-3.5 py-2.5 text-sm font-bold text-emerald-900">
                        Answer: ${escapeHtml(riddle.answer)}
                      </div>` : ""}

                    <div class="flex flex-wrap items-center gap-2 pt-0.5">
                      <button type="button" data-action="toggle-riddle-answer"
                        class="rounded-lg border border-amber-300 bg-white px-3.5 py-2 text-xs font-bold text-amber-900 hover:bg-amber-50 transition-colors">
                        ${state.lobbyRiddleShowAnswer ? "Hide Answer" : "Show Answer"}
                      </button>
                      <button type="button" data-action="next-riddle"
                        class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
                        Next →
                      </button>
                    </div>
                  </section>
                </div>

                <!-- Right Column: Floating Reactions + Compact Lobby Chat -->
                <div class="lg:col-span-5 lg:sticky lg:top-6 space-y-5 min-w-0">
                  <!-- Floating Emoji Reactions Bar -->
                  <section id="lobby-reactions-bar" aria-label="Floating Emoji Reactions" class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                      <h2 class="font-display text-sm font-extrabold text-slate-900">Send Live Reaction</h2>
                      <span class="text-[11px] font-medium text-slate-500">Floats for everyone</span>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                      ${LOBBY_REACTIONS.map((emoji) => `
                        <button type="button" data-action="send-lobby-reaction" data-emoji="${escapeHtml(emoji)}"
                          aria-label="Send ${escapeHtml(emoji)} reaction"
                          class="flex items-center justify-center rounded-xl border border-slate-200 bg-slate-50/80 py-2.5 text-2xl hover:border-emerald-300 hover:bg-emerald-50/70 hover:scale-105 active:scale-95 transition-transform">
                          ${escapeHtml(emoji)}
                        </button>`).join("")}
                    </div>
                  </section>

                  <!-- Compact Lobby Chat -->
                  <aside id="lobby-chat-panel" aria-label="Lobby Chat" class="rounded-xl border border-slate-200 bg-white shadow-sm flex flex-col overflow-hidden">
                    <div class="border-b border-slate-100 bg-slate-50/70 px-4 py-3">
                      <div class="flex items-center justify-between gap-2">
                        <h2 class="font-display text-sm font-extrabold text-slate-900">Lobby Chat</h2>
                        <span class="font-mono-tabular text-[11px] font-semibold text-slate-500">${lobbyMsgs.length} ${lobbyMsgs.length === 1 ? "msg" : "msgs"}</span>
                      </div>
                    </div>

                    <div id="lobby-chat-list" class="p-3.5 space-y-2.5 min-h-[160px] max-h-[260px] overflow-y-auto bg-white">
                      ${lobbyMsgs.length === 0 ? `
                        <div class="rounded-lg border border-dashed border-slate-200 bg-slate-50/70 px-3 py-6 text-center">
                          <p class="text-xs font-semibold text-slate-600">Say hi while waiting!</p>
                          <p class="mt-1 text-[11px] text-slate-500">Tap a quick-chat pill below or type a message.</p>
                        </div>` : lobbyMsgs.map((msg) => {
                          const isMine = msg.senderId === myClientId;
                          return `
                            <div class="flex flex-col ${isMine ? "items-end" : "items-start"}">
                              <div class="max-w-[90%] rounded-lg border px-3 py-2 text-xs ${
                                isMine
                                  ? "border-emerald-200 bg-emerald-50/80 text-slate-900"
                                  : "border-slate-200 bg-slate-50 text-slate-900"
                              }">
                                <div class="flex items-center gap-1.5 text-[11px]">
                                  <span aria-hidden="true">${escapeHtml(msg.avatar || "🦁")}</span>

        function renderPlaying() {
          const isOnline = state.mode === "online" && state.room;
          const letter = isOnline ? state.room.targetLetter : state.targetLetter;
          const round = isOnline ? state.room.currentRound : state.currentRound;
          const totalRounds = isOnline ? state.room.totalRounds : state.totalRounds;
          const timeLeft = isOnline ? state.onlineTimeLeft : state.timeLeft;
          const maxSec = isOnline ? state.room.timerSeconds : state.timerSeconds;

          const submittedIds = isOnline ? getOnlineSubmittedIds(state.room) : [];
          const playerName = isOnline
            ? ((state.room.playersMap && state.room.playersMap[myClientId] && state.room.playersMap[myClientId].name) || state.onlineName)
            : ((state.activePlayers.filter((p) => !p.isBot)[state.turnIndex] || {}).name);

          const ratio = maxSec > 0 ? Math.max(0, Math.min(100, (timeLeft / maxSec) * 100)) : 0;
          const urgent = timeLeft <= 10;
          const readyCount = CATEGORIES.filter((c) => validateWordForLetter(state.answers[c.id], letter, c.id).valid).length;
          const isClubbedGroup = String(letter || "").includes("/");
          const readyActive = isReadyCountdownActive();
          const readyRemaining = readyActive ? Math.max(0, state.readyCountdownEndsAt - Date.now()) : 0;
          const readyStep = readyActive ? getReadyCountdownStep(readyRemaining) : null;
          const readyBarPct = readyActive ? Math.max(0, Math.min(100, (readyRemaining / GET_READY_DURATION_MS) * 100)) : 0;
          const inputsLocked = state.submittedOnline || readyActive;

          return `

              <div class="mx-auto max-w-4xl px-4 py-2.5 sm:px-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
                <div class="flex items-center justify-between gap-3 sm:justify-start min-w-0">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="${getLetterBadgeStyle(letter, "header")} shrink-0 items-center justify-center rounded-xl bg-emerald-700 font-display font-extrabold text-white shadow-xs">${escapeHtml(letter)}</div>

                  </div>
                  <div class="w-28 sm:hidden shrink-0">
                    <div class="flex items-baseline justify-between text-xs font-semibold">
                      <span class="${urgent ? "text-red-700" : "text-slate-500"}" data-hud-label>${urgent ? "Hurry" : "Time"}</span>
                      <span class="font-mono-tabular text-base font-bold ${urgent ? "text-red-700" : "text-slate-900"}" data-hud-text>${timeLeft}s</span>
                    </div>
                    <div class="mt-1 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
                      <div class="h-full transition-[width] duration-300 ${urgent ? "bg-red-600" : "bg-emerald-600"}" data-hud-bar style="width:${ratio}%"></div>
                    </div>
                  </div>
                </div>
                <div class="flex items-center justify-between gap-2 sm:justify-end sm:gap-3 shrink-0">
                  <div class="sm:hidden min-w-0 text-xs text-slate-600 truncate">
                    <span class="font-mono-tabular font-semibold text-slate-500">R${round}/${totalRounds}</span>
                    <span class="mx-1 text-slate-300">·</span>
                    <span class="font-bold text-slate-800">${escapeHtml(playerName || "Player")}</span>
                  </div>
                  <div class="hidden sm:block w-36">
                    <div class="flex items-baseline justify-between text-xs font-semibold">
                      <span id="hud-timer-label" class="${urgent ? "text-red-700" : "text-slate-500"}" data-hud-label>${urgent ? "Hurry" : "Time"}</span>
                      <span id="hud-timer-text" class="font-mono-tabular text-base font-bold ${urgent ? "text-red-700" : "text-slate-900"}" data-hud-text>${timeLeft}s</span>
                    </div>
                    <div class="mt-1 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
                      <div id="hud-timer-bar" class="h-full transition-[width] duration-300 ${urgent ? "bg-red-600" : "bg-emerald-600"}" data-hud-bar style="width:${ratio}%"></div>
                    </div>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <button type="button" data-action="toggle-mute"
                      class="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 sm:py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">

                    ${!isOnline ? `
                      <button type="button" data-action="toggle-pause"

                      </button>` : ""}
                  </div>
                </div>
              </div>
            </header>

            <main class="mx-auto max-w-3xl px-4 py-5 sm:px-6 sm:py-7">

                <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                  <div class="flex flex-col items-center gap-3 sm:flex-row sm:items-center sm:gap-5 text-center sm:text-left min-w-0">

                      ${escapeHtml(letter)}

                    <div class="min-w-0 space-y-1">
                      <p class="text-[11px] font-bold uppercase tracking-wider text-emerald-700">
                        ${isClubbedGroup ? "Active Letter Group · അക്ഷരക്കൂട്ടം" : "Active Letter · ഈ റൗണ്ടിലെ അക്ഷരം"}
                      </p>
                      <p class="text-sm sm:text-base font-bold text-slate-900">
                        ${state.language === "malayalam"
                          ? `${escapeHtml(letter)} ൽ തുടങ്ങുന്ന വാക്കുകൾ എഴുതുക`
                          : `Write words starting with "${escapeHtml(letter)}"`}
                      </p>
                      <p class="text-xs text-slate-500">
                        <span id="ready-count" class="font-mono-tabular font-bold text-emerald-800">${readyCount}/5 ready</span>
                        <span class="mx-1.5 text-slate-300">·</span>
                        <span>Round ${round} of ${totalRounds}</span>
                      </p>
                    </div>
                  </div>
                  <div class="flex justify-center sm:justify-end shrink-0">
                    <button type="button" data-action="reset-game"
                      class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900">
                      New Game / Reset
                    </button>
                  </div>
                </div>
              </section>

              ${state.onlineError ? `<p class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}

              <form id="play-sheet-form" class="notebook-paper rounded-xl border border-slate-200 p-5 shadow-sm sm:p-7 space-y-5">
                ${CATEGORIES.map((cat, idx) => {
                  const val = state.answers[cat.id];
                  const v = validateWordForLetter(val, letter, cat.id);
                  const lbl = formatCatLabel(cat);
                  const showErr = val.trim().length > 0 && !v.valid;
                  const showOk = val.trim().length > 0 && v.valid;
                  const inputPlaceholder = state.language === "malayalam"
                    ? `${letter} ൽ തുടങ്ങുന്ന ${cat.ml} എഴുതുക`
                    : `Enter ${cat.en.toLowerCase()} starting with "${letter}"`;
                  return `
                    <div class="border-b border-slate-200/80 pb-5 last:border-b-0 last:pb-0">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <label for="cat-${cat.id}" class="flex items-baseline gap-2 text-base font-bold text-slate-900">
                          <span class="font-mono-tabular text-xs font-semibold text-slate-400">0${idx + 1}.</span>
                          <span>${escapeHtml(lbl.primary)}</span>
                          ${lbl.secondary ? `<span class="text-sm font-medium text-slate-500">${escapeHtml(lbl.secondary)}</span>` : ""}
                        </label>
                        <span id="status-${cat.id}" class="text-xs font-semibold ${
                          showOk ? "text-emerald-700" : showErr ? "text-red-700" : "hidden"
                        }">${showOk || showErr ? escapeHtml(v.message) : ""}</span>
                      </div>
                      <input id="cat-${cat.id}" data-cat="${cat.id}" data-idx="${idx}" type="text" autocomplete="off"
                        ${inputsLocked ? "disabled" : ""}
                        value="${escapeHtml(val)}"
                        placeholder="${escapeHtml(inputPlaceholder)}"
                        class="cat-input mt-2 w-full rounded-lg border px-3.5 py-2.5 text-base font-medium text-slate-900 focus:outline-none focus:ring-2 ${
                          showErr
                            ? "border-red-400 bg-red-50/40 focus:border-red-600 focus:ring-red-600/15"
                            : showOk
                              ? "border-emerald-400 bg-emerald-50/20 focus:border-emerald-600 focus:ring-emerald-600/20"
                              : "border-slate-300 bg-white focus:border-emerald-600 focus:ring-emerald-600/20"
                        }" />
                    </div>`;
                }).join("")}

                <div class="pt-2">
                  ${state.submittedOnline
                    ? `<div id="online-wait-status" class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-center text-sm font-semibold text-emerald-900">
                         Sheet submitted · Waiting for other players (${submittedIds.length}/${players.length})
                       </div>`
                    : `<button type="submit" ${inputsLocked ? "disabled" : ""} class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800 disabled:opacity-60 transition-colors">Submit Sheet</button>`}
                </div>
              </form>
            </main>

            ${readyActive && readyStep ? `
              <div id="get-ready-overlay" role="dialog" aria-modal="true" aria-label="Get Ready Countdown"
                class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-5 backdrop-blur-md">
                <div class="w-full max-w-md rounded-3xl border border-white/15 bg-gradient-to-b from-slate-900 via-emerald-950 to-slate-900 p-7 sm:p-9 text-center text-white shadow-2xl space-y-6">
                  <div class="space-y-1.5">
                    <p class="font-mono-tabular text-xs font-bold uppercase tracking-widest text-emerald-300">
                      Round ${round} of ${totalRounds}
                    </p>
                    <h2 class="font-display text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                      Get Ready! · തയ്യാറാകൂ!
                    </h2>
                  </div>

                  <div class="flex flex-col items-center gap-2.5">
                    <span class="text-[11px] font-semibold uppercase tracking-wider text-emerald-200/80">
                      ${isClubbedGroup ? "Round Letter Group · അക്ഷരക്കൂട്ടം" : "Round Letter · അക്ഷരം"}
                    </span>
                    <div class="${getLetterBadgeStyle(letter, "ready")} items-center justify-center rounded-2xl bg-emerald-500 font-display font-extrabold text-slate-950 shadow-xl ring-4 ring-emerald-400/35">
                      ${escapeHtml(letter)}
                    </div>
                  </div>

                  <div class="space-y-2 py-1">
                    <div id="ready-countdown-value" class="ready-pop font-display font-extrabold leading-none tracking-tight ${
                      readyStep.isGo ? "text-6xl sm:text-7xl text-emerald-300" : "text-7xl sm:text-8xl text-white"
                    }">${escapeHtml(readyStep.label)}</div>
                    <p id="ready-countdown-sub" class="text-sm font-medium text-emerald-100/90">${escapeHtml(readyStep.sub)}</p>
                  </div>

                  <div class="h-2 w-full overflow-hidden rounded-full bg-white/15">
                    <div id="ready-countdown-bar" class="h-full rounded-full bg-emerald-400 transition-[width] duration-75" style="width:${readyBarPct}%"></div>
                  </div>
                </div>
              </div>` : ""}

            ${state.paused ? `
              <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4" role="dialog" aria-modal="true">
                <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-lg space-y-5">
                  <div>
                    <h2 class="font-display text-xl font-extrabold text-slate-900">Game Paused</h2>
                    <p class="mt-1 text-sm text-slate-600">Countdown timer is frozen while paused.</p>
                  </div>
                  <div class="space-y-2.5">
                    <button type="button" data-action="toggle-pause" class="w-full rounded-lg bg-emerald-700 px-4 py-3 text-sm font-bold text-white hover:bg-emerald-800">Resume Game</button>
                    <button type="button" data-action="restart-round" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">Restart Round</button>
                    <button type="button" data-action="reset-game" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100">New Game / Reset</button>
                  </div>
                </div>
              </div>` : ""}`;
        }

        function renderAppeal() {
          const isOnline = state.mode === "online" && state.room;
          const result = isOnline
            ? buildOnlineCurrentRoundResult(state.room)
            : state.roundResults[state.roundResults.length - 1];
          const totalRounds = isOnline ? state.room.totalRounds : state.totalRounds;
          const isAdmin = isCurrentUserAdmin();
          const adminId = getRoomAdminId();
          const adminName = getRoomAdminName();
          const reviewerId = getCurrentReviewerId();
          const chatSender = getCurrentChatSender();
          const passAndPlayHumans = !isOnline && state.mode === "pass_and_play"
            ? state.activePlayers.filter((p) => !p.isBot)
            : [];

          const rawMessages = isOnline
            ? (Array.isArray(state.room.reviewMessages) ? state.room.reviewMessages : [])
            : (Array.isArray(state.reviewMessages) ? state.reviewMessages : []);
          const roundMessages = rawMessages
            .filter((m) => !m.round || Number(m.round) === Number(result.roundNumber))
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          // Track unread count per room/round cleanly
          const seenKey = `${isOnline ? state.room.roomCode : "local"}|${result.roundNumber}`;
          if (state.reviewChatSeenKey !== seenKey) {
            state.reviewChatSeenKey = seenKey;
            state.reviewChatSeenCount = state.reviewChatOpen ? roundMessages.length : 0;
          }
          if (state.reviewChatOpen) {
            state.reviewChatSeenCount = roundMessages.length;
          }
          const unreadCount = Math.max(0, roundMessages.length - (state.reviewChatSeenCount || 0));

          const rulingCount = result.playerScores.reduce((acc, ps) => {
            return acc + CATEGORIES.filter((cat) => ps.cells[cat.id].appealDecision !== "auto").length;
          }, 0);

          const activeCatFilter =
            state.reviewCategoryFilter === "all" || CATEGORIES.some((c) => c.id === state.reviewCategoryFilter)
              ? state.reviewCategoryFilter
              : "all";
          const visibleCategories =
            activeCatFilter === "all"
              ? CATEGORIES
              : CATEGORIES.filter((c) => c.id === activeCatFilter);

          const getShortCategoryPillLabel = (cat) => {
            if (state.language === "english") {
              if (cat.id === "animal") return "Animal…";
              if (cat.id === "plant") return "Flower…";
              return cat.en;
            }
            if (cat.id === "animal") return "മൃഗം…";
            if (cat.id === "plant") return "പൂവ്…";
            return cat.ml;
          };

          const getCompactStatusChip = (c) => {
            if (c.appealDecision === "invalid" || c.appealDecision === "rejected") {
              return { text: "Disapproved", cls: "bg-red-50 text-red-700 ring-1 ring-red-200/80" };
            }
            if (c.appealDecision === "duplicate") {
              return { text: "Match", cls: "bg-amber-50 text-amber-800 ring-1 ring-amber-200/90" };
            }
            if (c.appealDecision === "valid" || c.appealDecision === "approved") {
              return { text: "Admin OK", cls: "bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200/80" };
            }
            if (c.status === "unique") {
              return { text: "Unique", cls: "bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200/80" };
            }
            if (c.status === "shared") {
              return { text: "Shared", cls: "bg-amber-50 text-amber-800 ring-1 ring-amber-200/80" };
            }
            if (!c.raw.trim()) {
              return { text: "Blank", cls: "bg-slate-100 text-slate-500" };
            }
            return { text: "Wrong letter", cls: "bg-red-50 text-red-700 ring-1 ring-red-200/80" };
          };

          const menuOpen = Boolean(state.reviewMenuOpen);
          const chatOpen = Boolean(state.reviewChatOpen);

          return `
            <main class="mx-auto max-w-6xl px-3.5 py-4 pb-20 sm:px-8 sm:py-7 sm:pb-24 space-y-3.5 sm:space-y-5">
              <!-- Compact Review Header -->
              <section class="flex flex-col gap-2.5 border-b border-slate-200 pb-3.5 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                  <div class="${getLetterBadgeStyle(result.letter, "card")} shrink-0 items-center justify-center rounded-xl bg-amber-600 font-display font-extrabold text-white">${escapeHtml(result.letter)}</div>
                  <div class="min-w-0">
                    <p class="text-[11px] sm:text-xs font-semibold text-amber-700">അപ്പീൽ &amp; റിവ്യൂ · Round ${result.roundNumber} of ${totalRounds}</p>
                    <h1 class="font-display text-lg sm:text-2xl font-extrabold text-slate-900 leading-tight truncate">Appeal &amp; Review</h1>
                    <p class="mt-0.5 text-[11px] sm:text-xs text-slate-500 truncate">
                      ${isAdmin
                        ? `Room Admin (${escapeHtml(adminName)}) · ${rulingCount} ${rulingCount === 1 ? "ruling" : "rulings"}`
                        : `Room Admin: ${escapeHtml(adminName)} · ${rulingCount} ${rulingCount === 1 ? "ruling" : "rulings"}`}
                    </p>
                  </div>
                </div>
                <div class="flex items-center justify-between gap-2 sm:justify-end shrink-0">
                  <button type="button" data-action="toggle-review-chat"
                    aria-expanded="${chatOpen}" aria-controls="review-chat-drawer"
                    class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-emerald-200 bg-emerald-50 px-3 text-xs font-bold text-emerald-800 hover:bg-emerald-100 transition-colors whitespace-nowrap">
                    <svg viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5 shrink-0" aria-hidden="true">
                      <path fill-rule="evenodd" d="M10 2c-4.418 0-8 2.91-8 6.5 0 1.693.79 3.235 2.092 4.393L3.1 16.2a.75.75 0 00.973.92l3.437-1.26c.786.22 1.622.34 2.49.34 4.418 0 8-2.91 8-6.5S14.418 2 10 2z" clip-rule="evenodd" />
                    </svg>

                      : `<button type="button" data-action="next-round" class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">Start Round ${result.roundNumber + 1}</button>
                         <button type="button" data-action="reopen-appeal" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">Reopen Appeal & Review</button>
                         <button type="button" data-action="finish-game" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">End Match Early & Show Podium</button>`

                  <button type="button" data-action="reset-game" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100">New Game / Reset</button>

        function buildPodiumData() {
          const isOnline = state.mode === "online" && state.room;
          const players = isOnline ? getOrderedRoomPlayers(state.room) : state.activePlayers;
          const resultsList = isOnline ? getOnlineAllRoundResults(state.room) : state.roundResults;

          const avatarByPlayerId = {};
          const playerBgByPlayerId = {};
          const AVATAR_PALETTES = [
            { bg: "bg-amber-100", ring: "ring-amber-300", hex: "#FEF3C7" },
            { bg: "bg-emerald-100", ring: "ring-emerald-300", hex: "#D1FAE5" },
            { bg: "bg-sky-100", ring: "ring-sky-300", hex: "#E0F2FE" },
            { bg: "bg-rose-100", ring: "ring-rose-300", hex: "#FFE4E6" },
            { bg: "bg-violet-100", ring: "ring-violet-300", hex: "#EDE9FE" },
            { bg: "bg-orange-100", ring: "ring-orange-300", hex: "#FFEDD5" },
          ];
          players.forEach((p, idx) => {
            avatarByPlayerId[p.id] = getPlayerAvatar(p, idx);
            playerBgByPlayerId[p.id] = AVATAR_PALETTES[idx % AVATAR_PALETTES.length];
          });

          const resolveAvatar = (playerId, fallbackIdx = 0) =>
            avatarByPlayerId[playerId] || LOBBY_AVATARS[Math.abs(fallbackIdx) % LOBBY_AVATARS.length];
          const resolvePalette = (playerId, fallbackIdx = 0) =>
            playerBgByPlayerId[playerId] || AVATAR_PALETTES[Math.abs(fallbackIdx) % AVATAR_PALETTES.length];

          const standings = calculateStandings(players, resultsList).map((s, idx) => ({
            ...s,
            avatar: resolveAvatar(s.playerId, idx),
            avatarPalette: resolvePalette(s.playerId, idx),
          }));
          const winners = standings.filter((s) => s.rank === 1);
          const winner = winners[0];
          const headline = winners.length > 1
            ? `Tie for 1st: ${winners.map((w) => w.playerName).join(" & ")}`
            : winner ? `${winner.playerName} Wins!` : "Final Standings";

          const top3 = standings.slice(0, 3);
          const slots = top3.length === 3
            ? [
                { ...top3[1], tier: 2 },
                { ...top3[0], tier: 1 },
                { ...top3[2], tier: 3 },
              ]
            : top3.length === 2
              ? [
                  { ...top3[1], tier: 2 },
                  { ...top3[0], tier: 1 },
                ]
              : top3.map((entry, idx) => ({ ...entry, tier: idx + 1 }));

          const roundHistoryEntries = resultsList.map((r) => {
            const sortedPlayers = [...r.playerScores]
              .map((ps, idx) => {
                let uniqueCount = 0;
                let sharedCount = 0;
                let validCount = 0;
                CATEGORIES.forEach((cat) => {
                  const cell = ps.cells[cat.id];
                  if (!cell) return;
                  if (cell.status === "unique") { uniqueCount += 1; validCount += 1; }
                  else if (cell.status === "shared") { sharedCount += 1; validCount += 1; }
                });
                return {
                  ...ps,
                  avatar: resolveAvatar(ps.playerId, idx),
                  avatarPalette: resolvePalette(ps.playerId, idx),
                  uniqueCount,
                  sharedCount,
                  validCount,
                };
              })
              .sort((a, b) => b.roundTotal - a.roundTotal || b.uniqueCount - a.uniqueCount || a.playerName.localeCompare(b.playerName));

            const challenged = [];
            r.playerScores.forEach((ps, idx) => {
              CATEGORIES.forEach((cat) => {
                const cell = ps.cells[cat.id];
                if (!cell || !cell.raw || !cell.raw.trim()) return;
                const isChallenged = cell.appealDecision && cell.appealDecision !== "auto";
                if (isChallenged) {
                  const lbl = formatCatLabel(cat);
                  challenged.push({
                    playerId: ps.playerId,
                    playerName: ps.playerName,
                    avatar: resolveAvatar(ps.playerId, idx),
                    categoryLabel: lbl.secondary ? `${lbl.primary} (${lbl.secondary})` : lbl.primary,
                    word: cell.raw,
                    decision: cell.appealDecision,
                    points: cell.points,
                    reason: cell.reason,
                  });
                }
              });
            });

            return { roundNumber: r.roundNumber, letter: r.letter, sortedPlayers, challenged };
          });

          const totalChallenged = roundHistoryEntries.reduce((sum, entry) => sum + entry.challenged.length, 0);

          return {
            isOnline,
            players,
            resultsList,
            standings,
            winners,
            winner,
            headline,
            top3,
            slots,
            roundHistoryEntries,
            totalChallenged,
          };
        }

        function drawRoundedRectPath(ctx, x, y, w, h, r) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.lineTo(x + w - radius, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
          ctx.lineTo(x + w, y + h - radius);
          ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
          ctx.lineTo(x + radius, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
          ctx.lineTo(x, y + radius);
          ctx.quadraticCurveTo(x, y, x + radius, y);
          ctx.closePath();
        }

        function truncateCanvasText(ctx, text, maxWidth) {
          const str = String(text ?? "");
          if (maxWidth <= 0) return "";
          if (ctx.measureText(str).width <= maxWidth) return str;
          const ellipsis = "…";
          const ellipsisW = ctx.measureText(ellipsis).width;
          if (ellipsisW >= maxWidth) return ellipsis;
          let lo = 0;
          let hi = str.length;
          while (lo < hi) {
            const mid = Math.ceil((lo + hi) / 2);
            if (ctx.measureText(str.slice(0, mid)).width + ellipsisW <= maxWidth) {
              lo = mid;
            } else {
              hi = mid - 1;
            }
          }
          return str.slice(0, lo) + ellipsis;
        }

        function isValidImageDataUrl(url) {
          if (typeof url !== "string" || url.length < 180) return false;
          return url.startsWith("data:image/png;base64,") || url.startsWith("data:image/svg+xml");
        }

        function dataUrlToBlob(dataUrl) {
          const str = String(dataUrl || "");
          if (str.startsWith("data:image/svg+xml;charset=utf-8,")) {
            const svgText = decodeURIComponent(str.slice("data:image/svg+xml;charset=utf-8,".length));
            return new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
          }
          const parts = str.split(",");
          if (parts.length < 2) return null;
          const mimeMatch = parts[0].match(/:(.*?);/);
          const mime = mimeMatch ? mimeMatch[1] : "image/png";
          const binary = atob(parts[1]);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new Blob([bytes], { type: mime });
        }

        function getExportFileName(isSvg = false) {
          const now = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
          return `name-place-animal-thing-scoreboard-${stamp}.${isSvg ? "svg" : "png"}`;
        }

        function drawCanvasTrophy(ctx, cx, topY) {
          ctx.save();
          ctx.translate(cx, topY);
          // Cup handles
          ctx.strokeStyle = "#D97706";
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.arc(-13, 13, 6.5, Math.PI * 0.55, Math.PI * 1.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(13, 13, 6.5, -Math.PI * 0.5, Math.PI * 0.45);
          ctx.stroke();

          // Cup body
          const cupGrad = ctx.createLinearGradient(-12, 4, 12, 26);
          cupGrad.addColorStop(0, "#FEF08A");
          cupGrad.addColorStop(0.5, "#F59E0B");
          cupGrad.addColorStop(1, "#B45309");
          ctx.fillStyle = cupGrad;
          ctx.strokeStyle = "#B45309";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(-12, 4);
          ctx.lineTo(12, 4);
          ctx.lineTo(11, 15);
          ctx.quadraticCurveTo(10, 26, 0, 27);
          ctx.quadraticCurveTo(-10, 26, -11, 15);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Stem & Base
          ctx.fillStyle = "#D97706";
          ctx.fillRect(-3, 26, 6, 7);
          ctx.fillStyle = "#92400E";
          drawRoundedRectPath(ctx, -10, 32, 20, 4.5, 2);
          ctx.fill();
          ctx.fillStyle = "#78350F";
          drawRoundedRectPath(ctx, -13, 36, 26, 4.5, 2);
          ctx.fill();

          // Star highlight on cup
          ctx.fillStyle = "#FFFBEB";
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? 4.8 : 2.1;
            const a = (i * Math.PI) / 5 - Math.PI / 2;
            const px = Math.cos(a) * r;
            const py = 14 + Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        function renderScoreboardCanvas(data, dpr) {
          const { resultsList, standings, winner, headline, slots } = data;

          const W = 1080;
          const OUTER_PAD = 36;
          const CARD_X = OUTER_PAD;
          const CARD_W = W - OUTER_PAD * 2;
          const INNER_PAD = 36;
          const CONTENT_X = CARD_X + INNER_PAD;
          const CONTENT_W = CARD_W - INNER_PAD * 2;

          const FONT_DISPLAY = '"Bricolage Grotesque", "Noto Sans Malayalam", "Plus Jakarta Sans", system-ui, sans-serif';
          const FONT_SANS = '"Plus Jakarta Sans", "Noto Sans Malayalam", system-ui, sans-serif';
          const FONT_MONO = '"JetBrains Mono", ui-monospace, SFMono-Regular, monospace';

          // Compact deterministic height — Header + 3-Tier Podium + Final Scoreboard + Footer (NO Round History)
          const HEADER_H = 188;
          const PODIUM_STAGE_H = slots.length > 0 ? 316 : 0;
          const TABLE_HEADER_H = 44;
          const TABLE_ROW_H = 48;
          const TABLE_SECTION_H = 38 + TABLE_HEADER_H + Math.max(1, standings.length) * TABLE_ROW_H;
          const FOOTER_H = 46;

          let totalInnerH = INNER_PAD;
          totalInnerH += HEADER_H + 26;
          if (PODIUM_STAGE_H > 0) totalInnerH += PODIUM_STAGE_H + 30;
          totalInnerH += TABLE_SECTION_H + 26;
          totalInnerH += FOOTER_H + 16;

          const CARD_H = Math.ceil(totalInnerH);
          const H = CARD_H + OUTER_PAD * 2;

          const canvas = document.createElement("canvas");
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          const ctx = canvas.getContext("2d");
          if (!ctx) return "";
          ctx.scale(dpr, dpr);
          ctx.textBaseline = "middle";

          // 1. Clean neutral background
          ctx.fillStyle = "#F1F5F9";
          ctx.fillRect(0, 0, W, H);

          // 2. Main white card with soft elevation
          ctx.save();
          ctx.shadowColor = "rgba(15, 23, 42, 0.08)";
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 8;
          drawRoundedRectPath(ctx, CARD_X, OUTER_PAD, CARD_W, CARD_H, 22);
          ctx.fillStyle = "#FFFFFF";
          ctx.fill();
          ctx.restore();

          drawRoundedRectPath(ctx, CARD_X, OUTER_PAD, CARD_W, CARD_H, 22);
          ctx.strokeStyle = "#E2E8F0";
          ctx.lineWidth = 1.5;
          ctx.stroke();

          let y = OUTER_PAD + INNER_PAD;

          // 3. Header Banner (Deep Emerald Brand Card)
          const bannerGrad = ctx.createLinearGradient(CONTENT_X, y, CONTENT_X + CONTENT_W, y + HEADER_H);
          bannerGrad.addColorStop(0, "#065F46");
          bannerGrad.addColorStop(1, "#047857");
          drawRoundedRectPath(ctx, CONTENT_X, y, CONTENT_W, HEADER_H, 16);
          ctx.fillStyle = bannerGrad;
          ctx.fill();

          ctx.save();
          drawRoundedRectPath(ctx, CONTENT_X, y, CONTENT_W, HEADER_H, 16);
          ctx.clip();
          ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
          ctx.beginPath();
          ctx.arc(CONTENT_X + CONTENT_W - 40, y + 20, 110, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(CONTENT_X + 60, y + HEADER_H + 15, 85, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = "#A7F3D0";
          ctx.font = `600 14px ${FONT_SANS}`;
          ctx.textAlign = "left";
          ctx.fillText("പേര് · സ്ഥലം · മൃഗം · പൂവ് · സാധനം", CONTENT_X + 28, y + 32);

          ctx.fillStyle = "#D1FAE5";
          ctx.font = `600 13px ${FONT_MONO}`;
          ctx.textAlign = "right";
          const roundsMeta = `${resultsList.length} ${resultsList.length === 1 ? "ROUND" : "ROUNDS"} PLAYED`;
          ctx.fillText(roundsMeta, CONTENT_X + CONTENT_W - 28, y + 32);

          ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
          ctx.font = `700 16px ${FONT_SANS}`;
          ctx.textAlign = "left";
          ctx.fillText("Name, Place, Animal, Thing", CONTENT_X + 28, y + 58);

          ctx.fillStyle = "#FFFFFF";
          ctx.font = `800 38px ${FONT_DISPLAY}`;
          ctx.textAlign = "left";
          ctx.fillText(truncateCanvasText(ctx, headline, CONTENT_W - 56), CONTENT_X + 28, y + 110);

          if (winner) {
            ctx.fillStyle = "#FDE68A";
            ctx.font = `700 16px ${FONT_MONO}`;
            const statLine = `${winner.totalScore} total points  ·  ${winner.uniqueCount} unique  ·  ${winner.sharedCount} shared`;
            ctx.fillText(statLine, CONTENT_X + 28, y + 152);
          }

          y += HEADER_H + 26;

          // 4. Stepped 3-Tier Victory Podium Stage (Gold #1, Silver #2, Bronze #3)
          if (slots.length > 0) {
            const stageBg = ctx.createLinearGradient(CONTENT_X, y, CONTENT_X, y + PODIUM_STAGE_H);
            stageBg.addColorStop(0, "#FFFBEB");
            stageBg.addColorStop(0.5, "#FFFFFF");
            stageBg.addColorStop(1, "#F8FAFC");
            drawRoundedRectPath(ctx, CONTENT_X, y, CONTENT_W, PODIUM_STAGE_H, 16);
            ctx.fillStyle = stageBg;
            ctx.fill();
            ctx.strokeStyle = "#E2E8F0";
            ctx.lineWidth = 1.2;
            ctx.stroke();

            const stageBottomY = y + PODIUM_STAGE_H - 12;
            const gap = 22;
            const slotCount = slots.length;
            const stagePadX = 34;
            const usableW = CONTENT_W - stagePadX * 2;
            const slotW = slotCount === 1
              ? Math.min(340, usableW)
              : slotCount === 2
                ? Math.min(300, (usableW - gap) / 2)
                : (usableW - gap * (slotCount - 1)) / slotCount;
            const totalSlotsW = slotW * slotCount + gap * (slotCount - 1);
            const startX = CONTENT_X + (CONTENT_W - totalSlotsW) / 2;

            slots.forEach((entry, idx) => {
              const tier = entry.tier || entry.rank;
              const isGold = tier === 1;
              const isSilver = tier === 2;
              const sx = startX + idx * (slotW + gap);
              const cx = sx + slotW / 2;

              const pedH = isGold ? 116 : isSilver ? 88 : 66;
              const pedTopY = stageBottomY - pedH;

              // Draw stepped metallic pedestal block
              const pedGrad = ctx.createLinearGradient(sx, pedTopY, sx, stageBottomY);
              if (isGold) {
                pedGrad.addColorStop(0, "#FCD34D");
                pedGrad.addColorStop(0.55, "#FBBF24");
                pedGrad.addColorStop(1, "#F59E0B");
              } else if (isSilver) {
                pedGrad.addColorStop(0, "#E2E8F0");
                pedGrad.addColorStop(0.45, "#CBD5E1");
                pedGrad.addColorStop(1, "#94A3B8");
              } else {
                pedGrad.addColorStop(0, "#FED7AA");
                pedGrad.addColorStop(0.55, "#FDBA74");
                pedGrad.addColorStop(1, "#FB923C");
              }

              ctx.save();
              ctx.shadowColor = isGold
                ? "rgba(180, 83, 9, 0.22)"
                : isSilver
                  ? "rgba(51, 65, 85, 0.24)"
                  : "rgba(194, 65, 12, 0.2)";
              ctx.shadowBlur = 14;
              ctx.shadowOffsetY = 5;
              drawRoundedRectPath(ctx, sx, pedTopY, slotW, pedH, 12);
              ctx.fillStyle = pedGrad;
              ctx.fill();
              ctx.restore();

              // Crisp top specular metallic highlight on silver/gold/bronze steps
              ctx.save();
              drawRoundedRectPath(ctx, sx, pedTopY, slotW, pedH, 12);
              ctx.clip();
              ctx.strokeStyle = isSilver ? "rgba(255, 255, 255, 0.85)" : "rgba(255, 255, 255, 0.45)";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(sx + 8, pedTopY + 1.5);
              ctx.lineTo(sx + slotW - 8, pedTopY + 1.5);
              ctx.stroke();
              ctx.restore();

              drawRoundedRectPath(ctx, sx, pedTopY, slotW, pedH, 12);
              ctx.strokeStyle = isGold ? "#D97706" : isSilver ? "#64748B" : "#EA580C";
              ctx.lineWidth = 1.5;
              ctx.stroke();

              // Pedestal Ordinal Rank label & Points
              const ordinalLabel = formatRankOrdinal(entry.rank);
              ctx.textAlign = "center";
              ctx.fillStyle = isGold ? "#451A03" : isSilver ? "#0F172A" : "#431407";
              ctx.font = `800 ${isGold ? 28 : isSilver ? 24 : 21}px ${FONT_DISPLAY}`;
              ctx.fillText(ordinalLabel, cx, pedTopY + (isGold ? 34 : isSilver ? 28 : 22));

              ctx.font = `800 ${isGold ? 24 : 20}px ${FONT_MONO}`;
              ctx.fillText(`${entry.totalScore} pts`, cx, pedTopY + (isGold ? 72 : isSilver ? 60 : 46));

              if (isGold) {
                ctx.fillStyle = "rgba(69, 26, 3, 0.78)";
                ctx.font = `700 12px ${FONT_SANS}`;
                ctx.fillText("WINNER", cx, pedTopY + 98);
              }

              // Player Name & unique/shared stats above pedestal
              ctx.fillStyle = "#64748B";
              ctx.font = `600 12px ${FONT_MONO}`;
              ctx.fillText(`${entry.uniqueCount}U · ${entry.sharedCount}S`, cx, pedTopY - 14);

              ctx.fillStyle = "#0F172A";
              ctx.font = `800 ${isGold ? 19 : 17}px ${FONT_DISPLAY}`;
              ctx.fillText(truncateCanvasText(ctx, entry.playerName, slotW - 14), cx, pedTopY - 36);

              // Circular Illustrated Avatar Medallion above player name
              const avatarR = isGold ? 34 : 28;
              const avatarCy = pedTopY - 62 - avatarR;

              ctx.save();
              ctx.beginPath();
              ctx.arc(cx, avatarCy, avatarR, 0, Math.PI * 2);
              if (isSilver) {
                const silverAvGrad = ctx.createLinearGradient(cx - avatarR, avatarCy - avatarR, cx + avatarR, avatarCy + avatarR);
                silverAvGrad.addColorStop(0, "#F8FAFC");
                silverAvGrad.addColorStop(0.5, "#E2E8F0");
                silverAvGrad.addColorStop(1, "#CBD5E1");
                ctx.fillStyle = silverAvGrad;
              } else {
                ctx.fillStyle = isGold ? "#FEF3C7" : "#FFEDD5";
              }
              ctx.fill();
              ctx.lineWidth = isGold ? 4 : 3.5;
              ctx.strokeStyle = isGold ? "#F59E0B" : isSilver ? "#64748B" : "#FB923C";
              ctx.stroke();
              ctx.restore();

              // Avatar emoji
              ctx.font = `${isGold ? 32 : 26}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
              ctx.fillStyle = "#0F172A";
              ctx.fillText(entry.avatar || "🦁", cx, avatarCy + 1);

              // Compact Ordinal Rank Badge seated at bottom of avatar medallion
              const badgeW = 36;
              const badgeH = 18;
              const badgeX = cx - badgeW / 2;
              const badgeY = avatarCy + avatarR - 9;
              drawRoundedRectPath(ctx, badgeX, badgeY, badgeW, badgeH, 6);
              ctx.fillStyle = isGold ? "#451A03" : isSilver ? "#334155" : "#7C2D12";
              ctx.fill();
              ctx.strokeStyle = isGold ? "#FBBF24" : isSilver ? "#CBD5E1" : "#FDBA74";
              ctx.lineWidth = 1.2;
              ctx.stroke();
              ctx.fillStyle = isGold ? "#FDE68A" : isSilver ? "#F8FAFC" : "#FFEDD5";
              ctx.font = `800 11px ${FONT_MONO}`;
              ctx.fillText(ordinalLabel, cx, badgeY + badgeH / 2 + 0.5);

              // Trophy above 1st or clean tier caption above 2nd / 3rd
              if (isGold) {
                drawCanvasTrophy(ctx, cx, avatarCy - avatarR - 46);
              } else {
                const caption = entry.rank === 1 ? "CO-WINNER" : entry.rank === 2 ? "RUNNER-UP" : "3RD PLACE";
                ctx.fillStyle = entry.rank === 1 ? "#B45309" : isSilver ? "#475569" : "#C2410C";
                ctx.font = `700 11px ${FONT_MONO}`;
                ctx.fillText(caption, cx, avatarCy - avatarR - 14);
              }
            });

            // Stage floor bar
            ctx.fillStyle = "#CBD5E1";
            ctx.fillRect(CONTENT_X + 20, stageBottomY, CONTENT_W - 40, 4);

            y += PODIUM_STAGE_H + 30;
          }

          // 5. Final Scoreboard Table
          ctx.textAlign = "left";
          ctx.fillStyle = "#0F172A";
          ctx.font = `800 20px ${FONT_DISPLAY}`;
          ctx.fillText("Final Scoreboard", CONTENT_X, y + 14);

          ctx.textAlign = "right";
          ctx.fillStyle = "#64748B";
          ctx.font = `600 13px ${FONT_MONO}`;
          ctx.fillText(`${standings.length} ${standings.length === 1 ? "player" : "players"}`, CONTENT_X + CONTENT_W, y + 14);

          y += 38;

          const tableH = TABLE_HEADER_H + Math.max(1, standings.length) * TABLE_ROW_H;
          ctx.save();
          drawRoundedRectPath(ctx, CONTENT_X, y, CONTENT_W, tableH, 12);
          ctx.clip();

          ctx.fillStyle = "#F1F5F9";
          ctx.fillRect(CONTENT_X, y, CONTENT_W, TABLE_HEADER_H);

          const rankColW = 72;
          const totalColW = 104;
          const numRounds = resultsList.length;
          const maxRoundAreaW = Math.min(numRounds * 220, Math.floor(CONTENT_W * 0.58));
          const roundColW = numRounds > 0 ? Math.floor(maxRoundAreaW / numRounds) : 0;
          const playerColW = CONTENT_W - rankColW - totalColW - roundColW * numRounds;

          const colRankX = CONTENT_X + 18;
          const colPlayerX = CONTENT_X + rankColW;
          const colRoundsStartX = colPlayerX + playerColW;
          const colTotalRightX = CONTENT_X + CONTENT_W - 18;

          ctx.fillStyle = "#475569";
          ctx.font = `700 13px ${FONT_SANS}`;
          ctx.textAlign = "left";
          ctx.fillText("Rank", colRankX, y + TABLE_HEADER_H / 2);
          ctx.fillText("Player", colPlayerX, y + TABLE_HEADER_H / 2);

          ctx.font = `700 12px ${FONT_MONO}`;
          ctx.textAlign = "right";
          resultsList.forEach((r, idx) => {
            const rx = colRoundsStartX + (idx + 1) * roundColW - 10;
            const rawHeader = `R${r.roundNumber} (${r.letter})`;
            ctx.fillText(truncateCanvasText(ctx, rawHeader, roundColW - 10), rx, y + TABLE_HEADER_H / 2);
          });

          ctx.fillStyle = "#0F172A";
          ctx.font = `700 13px ${FONT_SANS}`;
          ctx.fillText("Total", colTotalRightX, y + TABLE_HEADER_H / 2);

          standings.forEach((s, rowIdx) => {
            const ry = y + TABLE_HEADER_H + rowIdx * TABLE_ROW_H;
            ctx.fillStyle = s.rank === 1 ? "#FFFBEB" : rowIdx % 2 === 1 ? "#F8FAFC" : "#FFFFFF";
            ctx.fillRect(CONTENT_X, ry, CONTENT_W, TABLE_ROW_H);

            ctx.strokeStyle = "#E2E8F0";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(CONTENT_X, ry);
            ctx.lineTo(CONTENT_X + CONTENT_W, ry);
            ctx.stroke();

            const midY = ry + TABLE_ROW_H / 2;

            ctx.textAlign = "left";
            ctx.fillStyle = s.rank === 1 ? "#B45309" : s.rank === 2 ? "#334155" : s.rank === 3 ? "#C2410C" : "#64748B";
            ctx.font = `700 14px ${FONT_MONO}`;
            ctx.fillText(formatRankOrdinal(s.rank), colRankX, midY);

            ctx.fillStyle = "#0F172A";
            ctx.font = `700 15px ${FONT_SANS}`;
            const rowName = `${s.avatar || ""}  ${s.playerName}`.trim();
            ctx.fillText(truncateCanvasText(ctx, rowName, playerColW - 16), colPlayerX, midY);

            ctx.textAlign = "right";
            ctx.fillStyle = "#475569";
            ctx.font = `600 14px ${FONT_MONO}`;
            resultsList.forEach((r, idx) => {
              const ps = r.playerScores.find((p) => p.playerId === s.playerId);
              const rx = colRoundsStartX + (idx + 1) * roundColW - 10;
              ctx.fillText(String(ps ? ps.roundTotal : 0), rx, midY);
            });

            ctx.fillStyle = "#047857";
            ctx.font = `800 16px ${FONT_MONO}`;
            ctx.fillText(`${s.totalScore}`, colTotalRightX, midY);
          });

          ctx.restore();

          drawRoundedRectPath(ctx, CONTENT_X, y, CONTENT_W, tableH, 12);
          ctx.strokeStyle = "#CBD5E1";
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // 6. Minimal Footer
          const footerY = OUTER_PAD + CARD_H - FOOTER_H;
          ctx.strokeStyle = "#E2E8F0";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(CONTENT_X, footerY);
          ctx.lineTo(CONTENT_X + CONTENT_W, footerY);
          ctx.stroke();

          ctx.textAlign = "left";
          ctx.fillStyle = "#64748B";
          ctx.font = `600 13px ${FONT_SANS}`;
          ctx.fillText("Name, Place, Animal, Thing · പേര്, സ്ഥലം, മൃഗം, പൂവ്, സാധനം", CONTENT_X, footerY + 24);

          const dateLabel = new Date().toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric",
          });
          ctx.textAlign = "right";
          ctx.fillStyle = "#94A3B8";
          ctx.font = `600 12px ${FONT_MONO}`;
          ctx.fillText(dateLabel, CONTENT_X + CONTENT_W, footerY + 24);

          return canvas.toDataURL("image/png");
        }

        function buildFallbackScoreboardSvgDataUrl(data) {

          const podiumSvg = slots.map((entry, idx) => {
            const tier = entry.tier || entry.rank;
            const isGold = tier === 1;
            const isSilver = tier === 2;
            const slotW = slots.length === 1 ? 340 : slots.length === 2 ? 320 : 280;
            const gap = 24;
            const totalW = slotW * slots.length + gap * (slots.length - 1);
            const sx = (W - totalW) / 2 + idx * (slotW + gap);
            const pedH = isGold ? 114 : isSilver ? 86 : 64;
            const topY = 472 - pedH;
            const fill = isGold ? "url(#goldPedGrad)" : isSilver ? "url(#silverPedGrad)" : "url(#bronzePedGrad)";
            const stroke = isGold ? "#D97706" : isSilver ? "#64748B" : "#EA580C";
            const txtCol = isGold ? "#451A03" : isSilver ? "#0F172A" : "#431407";
            const ordinalLabel = formatRankOrdinal(entry.rank);
            return `
              <g>
                <circle cx="${sx + slotW / 2}" cy="${topY - 76}" r="${isGold ? 32 : 26}" fill="${isGold ? "#FEF3C7" : isSilver ? "url(#silverAvGrad)" : "#FFEDD5"}" stroke="${stroke}" stroke-width="3.5"></circle>
                <text x="${sx + slotW / 2}" y="${topY - 68}" text-anchor="middle" font-size="${isGold ? 30 : 24}">${safe(entry.avatar || "🦁")}</text>
                <rect x="${sx + slotW / 2 - 18}" y="${topY - 76 + (isGold ? 23 : 17)}" width="36" height="18" rx="6" fill="${isGold ? "#451A03" : isSilver ? "#334155" : "#7C2D12"}" stroke="${isGold ? "#FBBF24" : isSilver ? "#CBD5E1" : "#FDBA74"}" stroke-width="1.2"></rect>
                <text x="${sx + slotW / 2}" y="${topY - 76 + (isGold ? 35 : 29)}" text-anchor="middle" font-family="monospace" font-size="11" font-weight="800" fill="${isGold ? "#FDE68A" : isSilver ? "#F8FAFC" : "#FFEDD5"}">${ordinalLabel}</text>

                <text x="${sx + slotW / 2}" y="${topY + 34}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="${txtCol}">${ordinalLabel}</text>
                <text x="${sx + slotW / 2}" y="${topY + Math.min(pedH - 14, 68)}" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800" fill="${txtCol}">${entry.totalScore} pts</text>
              </g>`;
          }).join("");

          const rowsSvg = standings.map((s, idx) => {
            const ry = 554 + idx * rowH;
            const rankColor = s.rank === 1 ? "#B45309" : s.rank === 2 ? "#334155" : s.rank === 3 ? "#C2410C" : "#64748B";
            return `
              <g>
                <rect x="72" y="${ry}" width="936" height="${rowH}" fill="${s.rank === 1 ? "#FFFBEB" : idx % 2 === 1 ? "#F8FAFC" : "#FFFFFF"}"></rect>
                <line x1="72" y1="${ry}" x2="1008" y2="${ry}" stroke="#E2E8F0"></line>
                <text x="92" y="${ry + 28}" font-family="monospace" font-size="14" font-weight="700" fill="${rankColor}">${formatRankOrdinal(s.rank)}</text>
                <text x="160" y="${ry + 28}" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">${safe(`${s.avatar || ""} ${s.playerName}`.trim())}</text>
                <text x="988" y="${ry + 28}" text-anchor="end" font-family="monospace" font-size="16" font-weight="800" fill="#047857">${s.totalScore} pts</text>
              </g>`;
          }).join("");

          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            <defs>
              <linearGradient id="goldPedGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FCD34D"></stop>
                <stop offset="55%" stop-color="#FBBF24"></stop>
                <stop offset="100%" stop-color="#F59E0B"></stop>
              </linearGradient>
              <linearGradient id="silverPedGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#E2E8F0"></stop>
                <stop offset="45%" stop-color="#CBD5E1"></stop>
                <stop offset="100%" stop-color="#94A3B8"></stop>
              </linearGradient>
              <linearGradient id="silverAvGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#F8FAFC"></stop>
                <stop offset="50%" stop-color="#E2E8F0"></stop>
                <stop offset="100%" stop-color="#CBD5E1"></stop>
              </linearGradient>
              <linearGradient id="bronzePedGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FED7AA"></stop>
                <stop offset="55%" stop-color="#FDBA74"></stop>

            </defs>
            <rect width="${W}" height="${H}" fill="#F1F5F9"></rect>
