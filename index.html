          "ഹ": { name: ["ഹരീഷ്", "ഹേമ", "ഹരി", "ഹസീന"], place: ["ഹരിപ്പാട്", "ഹൈദരാബാദ്", "ഹംപി", "ഹവാന"], animal: ["ഹംസം", "ഹിപ്പോപ്പൊട്ടാമസ്", "ഹൈറൻ", "ഹമ്മിംഗ്ബേർഡ്"], plant: ["ഹൈബിസ്കസ്", "ഹേസൽനട്ട്", "ഹോളി"], thing: ["ഹെൽമെറ്റ്", "ഹാമർ", "ഹാർമോണിയം", "ഹെഡ്ഫോൺ"] },
          "ട": { name: ["ടോം", "ടീന", "ടോണി", "ടൈറ്റസ്"], place: ["ടോക്കിയോ", "ടൊറന്റോ", "ടാൻസാനിയ", "ടർക്കി"], animal: ["ടൈഗർ", "ടർക്കി", "ടൂക്കൻ", "ടോർട്ടോയ്സ്"], plant: ["ടൊമാറ്റോ", "ട്യൂലിപ്പ്", "ടാപ്പിയോക്ക", "ടീക്ക്"], thing: ["ടേബിൾ", "ടോർച്ച്", "ടിവി", "ടവൽ"] },
          "ഡ": { name: ["ഡാനിയൽ", "ഡയാന", "ഡേവിഡ്", "ഡോളി"], place: ["ഡൽഹി", "ഡബ്ലിൻ", "ഡെന്മാർക്ക്", "ഡാർജിലിംഗ്"], animal: ["ഡോൾഫിൻ", "ഡക്ക്", "ഡോങ്കി", "ഡ്രാഗൺഫ്ലൈ"], plant: ["ഡാലിയ", "ഡ്രാഗൺ ഫ്രൂട്ട്", "ഡെയ്സി", "ഡേറ്റ്സ്"], thing: ["ഡ്രം", "ഡെസ്ക്", "ഡയറി", "ഡസ്റ്റർ"] },
          "ഞ": { name: ["ഞരളത്ത്"], place: ["ഞാറക്കൽ", "ഞീഴൂർ", "ഞാങ്ങാട്ടിരി"], animal: ["ഞണ്ട്", "ഞാറപ്പക്ഷി"], plant: ["ഞാവൽ", "ഞെരിഞ്ഞിൽ", "ഞാറ", "ഞവര"], thing: ["ഞാൺ", "ഞാറ്റടി"] },
          "ള": { name: ["ളോഹൻ"], place: ["ളാഹ", "ളാലം"], animal: ["ളോഹപ്പക്ഷി"], plant: ["ളാഹക്കായ"], thing: ["ളോഹ"] },
          "ഴ": { name: ["ഴാങ്"], place: ["ഴാങ്ജിയാജി"], animal: ["ഴോലപ്പക്ഷി"], plant: ["ഴാങ്ങൽ"], thing: ["ഴാലർ"] },
          "റ": { name: ["റഹീം", "റഷീദ്", "റീന", "റോഹൻ"], place: ["റാന്നി", "റോം", "റഷ്യ", "റിയാദ്"], animal: ["റാബിറ്റ്", "റൈനോ", "റോബിൻ", "റൂസ്റ്റർ"], plant: ["റോസാപ്പൂവ്", "റംബുട്ടാൻ", "റാസ്ബെറി", "റബ്ബർ"], thing: ["റേഡിയോ", "റിംഗ്", "റൂളർ", "റിബൺ"] },
        };

        const MALAYALAM_INITIAL_MAP = {
          "അ": ["A"], "ആ": ["A"], "ഇ": ["I", "E"], "ഈ": ["I", "E"], "ഉ": ["U", "O"], "ഊ": ["U"],
          "ഋ": ["R"], "എ": ["E"], "ഏ": ["E"], "ഐ": ["A", "I"], "ഒ": ["O"], "ഓ": ["O"], "ഔ": ["O", "A"],
          "ക": ["K", "C"], "ഖ": ["K"], "ഗ": ["G"], "ഘ": ["G"], "ച": ["C"], "ഛ": ["C"],
          "ജ": ["J"], "ഝ": ["J"], "ട": ["T"], "ഠ": ["T"], "ഡ": ["D"], "ഢ": ["D"],
          "ത": ["T"], "ഥ": ["T"], "ദ": ["D"], "ധ": ["D"], "ന": ["N"], "പ": ["P"], "ഫ": ["F", "P"],
          "ബ": ["B"], "ഭ": ["B"], "മ": ["M"], "യ": ["Y"], "ര": ["R"], "ല": ["L"],
          "വ": ["V", "W"], "ശ": ["S"], "ഷ": ["S"], "സ": ["S"], "ഹ": ["H"], "ള": ["L"], "ഴ": ["Z", "L"], "റ": ["R"],
        };

        // =====================================================================
        // 3. SOUND ENGINE (Web Audio API)
        // =====================================================================
        const soundFx = (() => {
          let ctx = null;
          let muted = false;
          function ensureCtx() {
            if (muted) return null;
            if (!ctx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              ctx = new AC();
            }
            if (ctx.state === "suspended") ctx.resume().catch(() => {});
            return ctx;
          }
          function tone(freq, dur, type = "sine", vol = 0.08, delay = 0) {
            const c = ensureCtx();
            if (!c) return;
            const now = c.currentTime + delay;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + dur + 0.02);
          }
          return {
            isMuted: () => muted,
            toggleMute: () => { muted = !muted; return muted; },
            playStart: () => { tone(523.25, 0.12, "triangle", 0.08, 0); tone(659.25, 0.12, "triangle", 0.08, 0.09); tone(783.99, 0.18, "triangle", 0.09, 0.18); },
            playCountdownTick: (step) => {
              const freq = step === 3 ? 493.88 : step === 2 ? 587.33 : 698.46;
              tone(freq, 0.13, "triangle", 0.075, 0);
            },
            playUrgentTick: () => tone(1046.5, 0.09, "square", 0.04),
            playSubmit: () => { tone(587.33, 0.1, "sine", 0.07, 0); tone(880, 0.18, "sine", 0.08, 0.08); },
            playPop: () => { tone(740, 0.07, "sine", 0.05, 0); tone(987.77, 0.08, "sine", 0.04, 0.045); },
            playTimeUp: () => { tone(440, 0.18, "sawtooth", 0.06, 0); tone(349.23, 0.32, "sawtooth", 0.06, 0.16); },
            playVictory: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, "triangle", 0.08, i * 0.11)),
          };
        })();

        // =====================================================================
        // 4. PURE GAME RULES, VALIDATION, APPEALS & 10/5/0 SCORING
        // =====================================================================
        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function formatRankOrdinal(rank) {
          const n = Math.max(1, Math.floor(Number(rank) || 1));
          const mod100 = n % 100;
          if (mod100 >= 11 && mod100 <= 13) return `${n}th`;
          const mod10 = n % 10;
          if (mod10 === 1) return `${n}st`;
          if (mod10 === 2) return `${n}nd`;
          if (mod10 === 3) return `${n}rd`;
          return `${n}th`;
        }

        function createEmptyAnswers() {
          return { name: "", place: "", animal: "", plant: "", thing: "" };
        }

        function isMalayalamLetter(letter) {
          return /[\u0D00-\u0D7F]/.test(String(letter || ""));
        }

        function normalizeTargetLetter(letter) {
          const s = String(letter || "").trim().normalize("NFC");
          if (!s) return "K";
          return isMalayalamLetter(s) ? s : s.toUpperCase();
        }

        function getActiveAlphabet(lang) {
          const effectiveLang = lang || state.language;
          if (effectiveLang === "malayalam") return MALAYALAM_ALPHABET;
          if (effectiveLang === "bilingual") return BILINGUAL_ALPHABET;
          return ALPHABET;
        }

        function getDefaultLetter(lang) {
          const effectiveLang = lang || state.language;
          if (effectiveLang === "malayalam") return "ക / ഖ";
          if (effectiveLang === "bilingual") return "K / Q";
          return "K";
        }

        function getAcceptedLatinChars(targetLetter) {
          const clean = normalizeTargetLetter(targetLetter);
          if (clean.includes("/")) {
            return clean.split("/").map((p) => p.trim().toUpperCase()).filter(Boolean);
          }
          return clean ? [clean.toUpperCase()] : [];
        }

        function getAcceptedMalayalamChars(targetLetter) {
          const clean = normalizeTargetLetter(targetLetter);
          if (MALAYALAM_GROUP_CHARS[clean]) return MALAYALAM_GROUP_CHARS[clean];
          if (clean.includes("/")) {
            const expanded = [];
            clean.split("/").map((p) => p.trim()).filter(Boolean).forEach((p) => {
              const base = MALAYALAM_CHILLU_TO_BASE[p] || p;
              if (!expanded.includes(base)) expanded.push(base);
            });
            return expanded;
          }
          const base = MALAYALAM_CHILLU_TO_BASE[clean] || clean;
          return [base];
        }

        function getLetterBadgeStyle(letter, variant) {
          const text = String(letter || "");
          const isClubbed = text.includes("/");
          const isLongGroup = text.length > 10;
          if (variant === "hero") {
            if (isLongGroup) {
              return "inline-flex min-h-[4.25rem] px-5 py-3 text-xl sm:text-3xl tracking-wide leading-tight text-center";
            }
            if (isClubbed) {
              return "inline-flex min-h-[4.5rem] min-w-[7.5rem] px-6 py-3 text-3xl sm:text-4xl tracking-wide whitespace-nowrap";
            }
            return "inline-flex h-20 w-20 sm:h-24 sm:w-24 text-5xl sm:text-6xl";
          }
          if (variant === "ready") {
            if (isLongGroup) {
              return "inline-flex min-h-[5rem] px-6 py-4 text-2xl sm:text-4xl tracking-wide leading-tight text-center";
            }
            if (isClubbed) {
              return "inline-flex min-h-[5.5rem] min-w-[9rem] px-8 py-4 text-4xl sm:text-5xl tracking-wide whitespace-nowrap";
            }
            return "inline-flex h-28 w-28 sm:h-32 sm:w-32 text-6xl sm:text-7xl";
          }
          if (variant === "handoff") {
            return isClubbed
              ? "inline-flex min-h-[4.25rem] min-w-[5.5rem] px-6 py-3 text-xl sm:text-2xl whitespace-nowrap"
              : "flex h-20 w-20 text-4xl";
          }
          if (variant === "header") {
            if (isLongGroup) {
              return "flex min-h-11 px-3 py-1 text-xs sm:text-sm leading-tight";
            }
            return isClubbed
              ? "flex h-12 min-w-[3.5rem] px-3.5 text-base sm:text-lg whitespace-nowrap"
              : "flex h-12 w-12 sm:h-13 sm:w-13 text-2xl sm:text-3xl";
          }
          return isClubbed
            ? "flex h-12 min-w-[3rem] px-3 text-sm sm:text-base whitespace-nowrap"
            : "flex h-12 w-12 text-2xl";
        }

        function normalizeWord(raw) {
          return String(raw || "")
            .normalize("NFC")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ")
            .replace(/^[^a-z0-9\u0D00-\u0D7F]+|[^a-z0-9\u0D00-\u0D7F]+$/g, "");
        }

        function getLeadingBaseChar(raw) {
          const clean = String(raw || "")
            .normalize("NFC")
            .replace(/^[\s\u200B-\u200D\uFEFF"'`([{<.,!?:;\-–—]+/, "");
          if (!clean) return "";
          const first = Array.from(clean)[0] || "";
          return MALAYALAM_CHILLU_TO_BASE[first] || first;
        }

        function startsWithTargetLetter(trimmed, targetLetter) {
          const cleanTarget = normalizeTargetLetter(targetLetter);
          const leading = getLeadingBaseChar(trimmed);
          if (!leading) return false;

          if (isMalayalamLetter(cleanTarget)) {
            return getAcceptedMalayalamChars(cleanTarget).includes(leading);
          }

          const acceptedLatin = getAcceptedLatinChars(cleanTarget);
          if (acceptedLatin.includes(leading.toUpperCase())) return true;
          const ml = MALAYALAM_INITIAL_MAP[leading];
          return Boolean(ml && acceptedLatin.some((ch) => ml.includes(ch)));
        }

        function looksLikeGibberish(norm) {
          if (/(.)\1\1/.test(norm)) return true;
          if (/^[a-z\s]+$/.test(norm)) {
            const lettersOnly = norm.replace(/\s+/g, "");
            if (lettersOnly.length >= 3 && !/[aeiouy]/.test(lettersOnly)) return true;
            if (lettersOnly.length > 28) return true;
          }
          return false;
        }

        function getDictionaryPoolForTarget(letter, catId) {
          const key = normalizeTargetLetter(letter);
          if (isMalayalamLetter(key)) {
            const chars = getAcceptedMalayalamChars(key);
            const merged = [];
            chars.forEach((ch) => {
              const items = (MALAYALAM_WORD_DICTIONARY[ch] || {})[catId] || [];
              items.forEach((w) => merged.push(w));
            });
            return merged;
          }
          const latinChars = getAcceptedLatinChars(key);
          if (latinChars.length > 1) {
            const merged = [];
            latinChars.forEach((ch) => {
              const items = (WORD_DICTIONARY[ch] || {})[catId] || [];
              items.forEach((w) => merged.push(w));
            });
            return merged;
          }
          return (WORD_DICTIONARY[key] || {})[catId] || [];
        }

        function isInDictionary(word, letter, catId) {
          const norm = normalizeWord(word);
          if (!norm) return false;
          const pool = getDictionaryPoolForTarget(letter, catId);
          return pool.some((item) => normalizeWord(item) === norm);
        }

        function validateWordForLetter(raw, targetLetter, catId) {
          const trimmed = String(raw || "").trim();
          const target = normalizeTargetLetter(targetLetter);
          if (!trimmed) return { valid: false, reason: "blank", message: "No answer entered", inDictionary: false };
          const norm = normalizeWord(trimmed);
          if (norm.length < 2) return { valid: false, reason: "too_short", message: "Enter at least 2 letters", inDictionary: false };
          if (!startsWithTargetLetter(trimmed, target)) return { valid: false, reason: "wrong_letter", message: `Must start with "${target}"`, inDictionary: false };
          const inDict = catId ? isInDictionary(trimmed, target, catId) : false;
          if (!inDict && looksLikeGibberish(norm)) return { valid: false, reason: "gibberish", message: "Word looks invalid", inDictionary: false };
          return { valid: true, reason: "ok", message: inDict ? `Verified "${target}" word` : `Starts with "${target}"`, inDictionary: inDict };
        }

        function getAppealKey(playerId, catId) {
          return `${playerId}__${catId}`;
        }

        function parseAppealKey(key) {
          const s = String(key || "");
          const idx = s.lastIndexOf("__");
          if (idx <= 0) return null;
          return { playerId: s.slice(0, idx), catId: s.slice(idx + 2) };
        }

        function getCellAdminRuling(appeals, playerId, catId) {
          const entry = appeals && appeals[getAppealKey(playerId, catId)];
          if (!entry || typeof entry !== "object") {
            return { decision: "auto", by: "", isOverridden: false };
          }
          // New Admin-only direct ruling format: { decision: "valid" | "duplicate" | "invalid", by, adminId }
          if (typeof entry.decision === "string") {
            const rawDec = entry.decision;
            const normalized =
              rawDec === "valid" || rawDec === "approved"
                ? "valid"
                : rawDec === "duplicate"
                  ? "duplicate"
                  : rawDec === "invalid" || rawDec === "rejected"
                    ? "invalid"
                    : "auto";
            return {
              decision: normalized,
              by: entry.by || "Admin",
              isOverridden: normalized !== "auto",
            };
          }
          // Backward compatibility with legacy peer-vote map format
          let approveCount = 0;
          let rejectCount = 0;
          let lastBy = "";
          for (const [voterId, vote] of Object.entries(entry)) {
            if (!voterId || !vote || !vote.decision) continue;
            if (vote.decision === "approved") {
              approveCount += 1;
              lastBy = vote.by || lastBy;
            } else if (vote.decision === "rejected") {
              rejectCount += 1;
              lastBy = vote.by || lastBy;
            }
          }
          if (rejectCount > approveCount) return { decision: "invalid", by: lastBy || "Admin", isOverridden: true };
          if (approveCount > rejectCount) return { decision: "valid", by: lastBy || "Admin", isOverridden: true };
          return { decision: "auto", by: "", isOverridden: false };
        }

        function setAdminRulingInMap(appeals, targetPlayerId, catId, adminId, adminName, decision) {
          const next = { ...(appeals || {}) };
          const key = getAppealKey(targetPlayerId, catId);
          if (!decision || decision === "auto") {
            delete next[key];
          } else {
            next[key] = {
              decision,
              by: adminName || "Admin",
              adminId: adminId || "",
              updatedAt: Date.now(),
            };
          }
          return next;
        }

        function scoreRound(roundNumber, targetLetter, submissions, appeals = {}) {
          const upper = normalizeTargetLetter(targetLetter);
          const wordCounts = { name: new Map(), place: new Map(), animal: new Map(), plant: new Map(), thing: new Map() };

          const pre = submissions.map(({ player, answers }) => {
            const cellPre = {};
            for (const cat of CATEGORIES) {
              const raw = String((answers && answers[cat.id]) || "").trim();
              const norm = normalizeWord(raw);
              const val = validateWordForLetter(raw, upper, cat.id);
              const ruling = getCellAdminRuling(appeals, player.id, cat.id);
              const decision = ruling.decision;
              const effectiveValid =
                raw.length > 0 &&
                (decision === "valid" || decision === "duplicate" || (decision === "auto" && val.valid));

              cellPre[cat.id] = { raw, norm, val, decision, ruling, effectiveValid };
              if (effectiveValid && norm) {
                wordCounts[cat.id].set(norm, (wordCounts[cat.id].get(norm) || 0) + 1);
              }
            }
            return { player, cellPre };
          });

          const playerScores = pre.map(({ player, cellPre }) => {
            const cells = {};
            let roundTotal = 0;
            for (const cat of CATEGORIES) {
              const item = cellPre[cat.id];
              const byLabel = item.ruling.by ? ` (${item.ruling.by})` : "";
              if (!item.raw) {
                cells[cat.id] = {
                  raw: "", normalized: "", points: 0, status: "blank",
                  reason: "No answer entered", appealDecision: "auto", rulingBy: "",
                };
              } else if (!item.effectiveValid) {
                const isAdminInvalid = item.decision === "invalid";
                cells[cat.id] = {
                  raw: item.raw, normalized: item.norm, points: 0,
                  status: isAdminInvalid ? "invalid" : (item.val.reason === "wrong_letter" ? "wrong_letter" : "invalid"),
                  reason: isAdminInvalid
                    ? `Disapproved by Admin${byLabel}`
                    : item.val.message,
                  appealDecision: item.decision,
                  rulingBy: item.ruling.by,
                };
              } else if (item.decision === "duplicate") {
                roundTotal += 5;
                cells[cat.id] = {
                  raw: item.raw, normalized: item.norm, points: 5,
                  status: "shared",
                  reason: `Same / matching word — Admin${byLabel} (+5)`,
                  appealDecision: "duplicate",
                  rulingBy: item.ruling.by,
                };
              } else if (item.decision === "valid") {
                roundTotal += 10;
                cells[cat.id] = {
                  raw: item.raw, normalized: item.norm, points: 10,
                  status: "unique",
                  reason: `Approved by Admin${byLabel} (+10)`,
                  appealDecision: "valid",
                  rulingBy: item.ruling.by,
                };
              } else {
                const isShared = (wordCounts[cat.id].get(item.norm) || 1) > 1;
                const pts = isShared ? 5 : 10;
                roundTotal += pts;
                cells[cat.id] = {
                  raw: item.raw, normalized: item.norm, points: pts,
                  status: isShared ? "shared" : "unique",
                  reason: isShared ? "Shared word (+5)" : "Unique word (+10)",
                  appealDecision: "auto",
                  rulingBy: "",
                };
              }
            }
            return { playerId: player.id, playerName: player.name, isBot: Boolean(player.isBot), cells, roundTotal };
          });

          return { roundNumber, letter: upper, playerScores };
        }

        function pickBotAnswers(targetLetter, difficulty) {
          const ans = createEmptyAnswers();
          const blankChance = difficulty === "casual" ? 0.14 : 0.03;
          for (const cat of CATEGORIES) {
            const pool = getDictionaryPoolForTarget(targetLetter, cat.id);
            if (!pool.length) continue;
            ans[cat.id] = Math.random() < blankChance ? "" : pool[Math.floor(Math.random() * pool.length)];
          }
          return ans;
        }

        function pickNextLetter(usedLetters, lang) {
          const alphabet = getActiveAlphabet(lang);
          const used = new Set((usedLetters || []).map((l) => normalizeTargetLetter(l)));
          const avail = alphabet.filter((l) => !used.has(l));
          const pool = avail.length ? avail : alphabet;
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function calculateStandings(players, roundResults) {
          const map = new Map();
          players.forEach((p) => {
            map.set(p.id, { playerId: p.id, playerName: p.name, totalScore: 0, uniqueCount: 0, sharedCount: 0, rank: 1 });
          });

              }
              const entry = map.get(ps.playerId);
              entry.totalScore += ps.roundTotal;
              CATEGORIES.forEach((cat) => {
                if (ps.cells[cat.id].status === "unique") entry.uniqueCount += 1;
                if (ps.cells[cat.id].status === "shared") entry.sharedCount += 1;
              });
            });
          });
          const sorted = Array.from(map.values()).sort((a, b) =>
            b.totalScore - a.totalScore || b.uniqueCount - a.uniqueCount || a.playerName.localeCompare(b.playerName)
          );
          for (let i = 0; i < sorted.length; i++) {
            sorted[i].rank = i > 0 && sorted[i].totalScore === sorted[i - 1].totalScore ? sorted[i - 1].rank : i + 1;
          }
          return sorted;

            node.style.setProperty("--rot", `${rotDeg}deg`);
            node.style.setProperty("--dur", `${durSec}s`);
            node.style.animationDelay = `${delayMs}ms`;

            const sizeCls = i === 0 ? "text-4xl sm:text-5xl" : "text-2xl sm:text-3xl opacity-90";
            node.innerHTML = `
              <span class="${sizeCls} drop-shadow-sm leading-none">${escapeHtml(emoji)}</span>
              ${i === 0 && senderName ? `<span class="mt-1 rounded-full bg-slate-900/80 px-2 py-0.5 text-[10px] font-bold text-white shadow-sm whitespace-nowrap">${escapeHtml(senderName)}</span>` : ""}
            `;
            stage.appendChild(node);
            setTimeout(() => node.remove(), Number(durSec) * 1000 + delayMs + 250);
          }
        }

        function getCurrentReviewerId() {
          if (state.mode === "online" && state.room) return myClientId;
          if (state.mode === "solo") return "human_1";
          const humans = state.activePlayers.filter((p) => !p.isBot);
          if (state.reviewingPlayerId && humans.some((p) => p.id === state.reviewingPlayerId)) {
            return state.reviewingPlayerId;
          }
          return humans[0] ? humans[0].id : "";
        }

        function getRoomAdminId() {
          if (state.mode === "online" && state.room) return state.room.hostId || "";
          if (state.mode === "solo") return "human_1";
          const humans = state.activePlayers.filter((p) => !p.isBot);
          return humans[0] ? humans[0].id : "";
        }

        function getRoomAdminName() {
          const adminId = getRoomAdminId();
          if (state.mode === "online" && state.room) {
            const p = state.room.playersMap && state.room.playersMap[adminId];
            return (p && p.name) || "Host";
          }
          const p = state.activePlayers.find((x) => x.id === adminId);
          return (p && p.name) || state.soloName || "Admin";
        }

        function isCurrentUserAdmin() {
          const adminId = getRoomAdminId();
          if (!adminId) return false;
          if (state.mode === "online" && state.room) return state.room.hostId === myClientId;
          if (state.mode === "solo") return true;
          return getCurrentReviewerId() === adminId;
        }

        function getCurrentChatSender() {
          if (state.mode === "online" && state.room) {
            const players = getOrderedRoomPlayers(state.room);
            const myIdx = players.findIndex((x) => x.id === myClientId);
            const p = (state.room.playersMap && state.room.playersMap[myClientId]) || players[myIdx];
            return {
              id: myClientId,
              name: (p && p.name) || state.onlineName || "Player",
              avatar: getPlayerAvatar(p, myIdx >= 0 ? myIdx : 0),
              isAdmin: state.room.hostId === myClientId,
            };
          }
          const reviewerId = getCurrentReviewerId();
          const adminId = getRoomAdminId();
          const idx = state.activePlayers.findIndex((x) => x.id === reviewerId);
          const p = idx >= 0 ? state.activePlayers[idx] : null;
          return {
            id: reviewerId || "human_1",
            name: (p && p.name) || state.soloName || "Player 1",
            avatar: getPlayerAvatar(p, idx >= 0 ? idx : 0),
            isAdmin: Boolean(reviewerId && reviewerId === adminId),
          };
        }

        function formatChatTime(ts) {
          if (!ts) return "";
          try {
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          } catch {
            return "";
          }
        }

        const STORAGE_KEY = "peru_sadhanam_game_state_v1";

        let timerInterval = null;
        let roomUnsubscribe = null;
        let draftSyncTimer = null;
        let finalizingRoundFlag = false;
        let lastUrgentSecond = -1;
        let lastSavedOnlineSecond = -1;
        let pendingOnlineRestore = null;

        function saveGameState() {
          if (state.phase === "title") return;
          try {
            const payload = {
              version: 1,
              savedAt: Date.now(),
              phase: state.phase,
              mode: state.mode,
              language: state.language,
              totalRounds: state.totalRounds,
              timerSeconds: state.timerSeconds,
              letterMode: state.letterMode,
              manualLetter: state.manualLetter,
              soloName: state.soloName,
              botCount: state.botCount,
              botDifficulty: state.botDifficulty,
              localPlayers: state.localPlayers,
              onlineName: state.onlineName,
              joinCode: state.joinCode,
              activePlayers: state.activePlayers,
              currentRound: state.currentRound,
              targetLetter: state.targetLetter,
              usedLetters: state.usedLetters,
              turnIndex: state.turnIndex,
              timeLeft: state.timeLeft,
              paused: state.paused,
              answers: state.answers,
              roundSubmissions: state.roundSubmissions,
              roundResults: state.roundResults,
              appeals: state.appeals,
              reviewingPlayerId: state.reviewingPlayerId,
              reviewMessages: state.reviewMessages,
              submittedOnline: state.submittedOnline,
              onlineTimeLeft: state.onlineTimeLeft,
              savedRoomCode: state.room ? state.room.roomCode : (pendingOnlineRestore ? pendingOnlineRestore.roomCode : ""),
              savedRoomRound: state.room ? (state.room.currentRound || 0) : (pendingOnlineRestore ? pendingOnlineRestore.currentRound : 0),
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          } catch {
            // Ignore storage quota or private mode errors
          }
        }

        function clearSavedGameState() {
          pendingOnlineRestore = null;
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch {
            // Ignore storage errors
          }
        }

        function restoreGameState() {
          let raw = null;
          try {
            raw = localStorage.getItem(STORAGE_KEY);
          } catch {
            return;
          }
          if (!raw) return;

          let saved = null;
          try {
            saved = JSON.parse(raw);
          } catch {
            clearSavedGameState();
            return;
          }

          if (!saved || typeof saved !== "object") {
            clearSavedGameState();
            return;
          }

          const validPhases = ["lobby", "handoff", "playing", "appeal", "results", "gameover"];
          if (!validPhases.includes(saved.phase)) {
            clearSavedGameState();
            return;
          }

          // If user opened an explicit ?room=XXXX invite link to a different room, honor the link
          if (initialJoinCode && initialJoinCode !== saved.savedRoomCode) {
            return;
          }

          if (["solo", "pass_and_play", "online"].includes(saved.mode)) state.mode = saved.mode;
          if (["bilingual", "malayalam", "english"].includes(saved.language)) state.language = saved.language;
          if (typeof saved.totalRounds === "number" && saved.totalRounds > 0) state.totalRounds = saved.totalRounds;
          if (typeof saved.timerSeconds === "number" && saved.timerSeconds > 0) state.timerSeconds = saved.timerSeconds;
          if (["random", "manual"].includes(saved.letterMode)) state.letterMode = saved.letterMode;
          if (typeof saved.manualLetter === "string" && saved.manualLetter.trim().length > 0) {
            state.manualLetter = normalizeTargetLetter(saved.manualLetter);
          }
          if (typeof saved.soloName === "string") state.soloName = saved.soloName;
          if (typeof saved.botCount === "number" && saved.botCount >= 1 && saved.botCount <= 3) state.botCount = saved.botCount;
          if (["casual", "sharp"].includes(saved.botDifficulty)) state.botDifficulty = saved.botDifficulty;
          if (Array.isArray(saved.localPlayers) && saved.localPlayers.length >= 2) state.localPlayers = saved.localPlayers;
          if (typeof saved.onlineName === "string") state.onlineName = saved.onlineName;
          if (typeof saved.joinCode === "string") state.joinCode = saved.joinCode;

          const restoredAnswers = { ...createEmptyAnswers() };
          if (saved.answers && typeof saved.answers === "object") {
            CATEGORIES.forEach((cat) => {
              if (typeof saved.answers[cat.id] === "string") restoredAnswers[cat.id] = saved.answers[cat.id];
            });
          }

          if (saved.mode === "online") {
            const roomCode = typeof saved.savedRoomCode === "string" ? saved.savedRoomCode.trim().toUpperCase() : "";
            if (!roomCode || !db) {
              clearSavedGameState();
              return;
            }
            pendingOnlineRestore = {
              roomCode,
              currentRound: Number(saved.savedRoomRound) || 0,
              answers: restoredAnswers,
              submittedOnline: Boolean(saved.submittedOnline),
            };
            state.answers = { ...restoredAnswers };
            state.submittedOnline = Boolean(saved.submittedOnline);
            state.onlineTimeLeft = typeof saved.onlineTimeLeft === "number" && saved.onlineTimeLeft >= 0
              ? saved.onlineTimeLeft
              : state.timerSeconds;
            state.joinCode = roomCode;
            subscribeToRoom(roomCode);
            return;
          }

          // Local modes (solo | pass_and_play)
          if (!Array.isArray(saved.activePlayers) || saved.activePlayers.length === 0) {
            clearSavedGameState();
            return;
          }
          const needsResults = ["appeal", "results", "gameover"].includes(saved.phase);
          if (needsResults && (!Array.isArray(saved.roundResults) || saved.roundResults.length === 0)) {
            clearSavedGameState();
            return;
          }
          const humans = saved.activePlayers.filter((p) => !p.isBot);
          if (["handoff", "playing"].includes(saved.phase) && humans.length === 0) {
            clearSavedGameState();
            return;
          }

          state.activePlayers = saved.activePlayers;
          state.currentRound = Number(saved.currentRound) || 1;
          state.targetLetter = typeof saved.targetLetter === "string" && saved.targetLetter.trim()
            ? normalizeTargetLetter(saved.targetLetter)
            : getDefaultLetter(state.language);
          state.usedLetters = Array.isArray(saved.usedLetters) ? saved.usedLetters : [state.targetLetter];
          state.turnIndex = Number.isInteger(saved.turnIndex) && saved.turnIndex >= 0 && saved.turnIndex < Math.max(1, humans.length)
            ? saved.turnIndex
            : 0;
          state.timeLeft = typeof saved.timeLeft === "number" && saved.timeLeft >= 0 ? saved.timeLeft : state.timerSeconds;
          state.paused = Boolean(saved.paused);
          state.answers = restoredAnswers;
          state.roundSubmissions = Array.isArray(saved.roundSubmissions) ? saved.roundSubmissions : [];
          state.roundResults = Array.isArray(saved.roundResults) ? saved.roundResults : [];
          state.appeals = saved.appeals && typeof saved.appeals === "object" ? saved.appeals : {};
          state.reviewingPlayerId = typeof saved.reviewingPlayerId === "string" ? saved.reviewingPlayerId : "";
          state.reviewMessages = Array.isArray(saved.reviewMessages) ? saved.reviewMessages : [];
          state.phase = saved.phase;

          if (state.phase === "playing" && !state.paused) {
            if (state.timeLeft <= 0) {
              submitLocalTurn(true);
            } else {
              startTimer();
            }
          }
        }

        const GET_READY_DURATION_MS = 2800;
        let readyCountdownInterval = null;
        let lastReadyStepKey = "";

        function isReadyCountdownActive() {
          return (
            state.phase === "playing" &&
            !state.submittedOnline &&
            Number(state.readyCountdownEndsAt || 0) > Date.now()
          );
        }

        function getReadyCountdownStep(msRemaining) {
          if (msRemaining > 2000) {
            return { key: "3", label: "3", sub: "തയ്യാറാകൂ! · Get ready...", isGo: false, tickNum: 3 };
          }
          if (msRemaining > 1200) {
            return { key: "2", label: "2", sub: "തയ്യാറാകൂ! · Fingers on keyboard...", isGo: false, tickNum: 2 };
          }
          if (msRemaining > 400) {
            return { key: "1", label: "1", sub: "Almost time...", isGo: false, tickNum: 1 };
          }
          return { key: "go", label: "GO!", sub: "തുടങ്ങൂ! · Start writing!", isGo: true, tickNum: 0 };
        }

        function stopReadyCountdown() {
          if (readyCountdownInterval) {
            clearInterval(readyCountdownInterval);
            readyCountdownInterval = null;
          }
          lastReadyStepKey = "";
        }

        function startReadyCountdown(endsAtMs) {
          stopReadyCountdown();
          const target = Number(endsAtMs || 0);
          if (target <= Date.now()) {
            state.readyCountdownEndsAt = 0;
            return;
          }
          state.readyCountdownEndsAt = target;

          function tickReady() {
            if (state.phase !== "playing" || state.submittedOnline) {
              state.readyCountdownEndsAt = 0;
              stopReadyCountdown();
              return;
            }
            const remaining = target - Date.now();
            if (remaining <= 0) {
              state.readyCountdownEndsAt = 0;
              stopReadyCountdown();
              if (lastReadyStepKey !== "go") soundFx.playStart();
              render();
              const first = document.getElementById("cat-name");
              if (first && !state.paused && !state.backConfirmOpen) {
                try { first.focus({ preventScroll: true }); } catch { first.focus(); }
              }
              return;
            }

            const step = getReadyCountdownStep(remaining);
            const pct = Math.max(0, Math.min(100, (remaining / GET_READY_DURATION_MS) * 100));
            const valEl = document.getElementById("ready-countdown-value");
            const subEl = document.getElementById("ready-countdown-sub");
            const barEl = document.getElementById("ready-countdown-bar");

            if (step.key !== lastReadyStepKey) {
              lastReadyStepKey = step.key;
              if (step.isGo) soundFx.playStart();
              else soundFx.playCountdownTick(step.tickNum);

              if (valEl) {
                valEl.textContent = step.label;
                valEl.className = "ready-pop font-display font-extrabold leading-none tracking-tight " +
                  (step.isGo ? "text-6xl sm:text-7xl text-emerald-300" : "text-7xl sm:text-8xl text-white");
                void valEl.offsetWidth;
              }
              if (subEl) subEl.textContent = step.sub;
            }
            if (barEl) barEl.style.width = pct + "%";
          }

          tickReady();
          readyCountdownInterval = setInterval(tickReady, 70);
        }

        function stopTimer() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        }

        function detachRoomListener() {
          if (roomUnsubscribe) {
            roomUnsubscribe();
            roomUnsubscribe = null;
          }
          if (draftSyncTimer) {
            clearTimeout(draftSyncTimer);
            draftSyncTimer = null;
          }
        }

        function getOrderedRoomPlayers(room) {
          if (!room) return [];
          const list = Object.values(room.playersMap || {});
          return list.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
        }

        function getOnlineSubmittedIds(room) {
          if (!room || !room.submittedMap) return [];
          return Object.keys(room.submittedMap).filter((id) => Boolean(room.submittedMap[id]));
        }

        function buildOnlineCurrentRoundResult(room) {
          const players = getOrderedRoomPlayers(room);
          const subs = players.map((p) => ({
            player: p,
            answers: (room.submissions && room.submissions[p.id]) || createEmptyAnswers(),
          }));
          return scoreRound(room.currentRound, room.targetLetter, subs, room.appeals || {});
        }

        function getOnlineAllRoundResults(room) {
          if (!room) return [];
          const hist = room.roundHistory || {};
          const keys = Object.keys(hist).map(Number).sort((a, b) => a - b);
          const list = keys.map((k) => {
            const entry = hist[String(k)];
            const players = getOrderedRoomPlayers(room);
            const subs = players.map((p) => ({
              player: p,
              answers: (entry.submissions && entry.submissions[p.id]) || createEmptyAnswers(),
            }));
            const appealsToUse = Number(k) === room.currentRound && (room.phase === "appeal" || room.phase === "results")
              ? (room.appeals || entry.appeals || {})
              : (entry.appeals || {});
            return scoreRound(entry.roundNumber, entry.letter, subs, appealsToUse);
          });

          if ((room.phase === "appeal" || room.phase === "results") && !hist[String(room.currentRound)]) {
            list.push(buildOnlineCurrentRoundResult(room));
          }
          return list;
        }

        function updateHudTimerOnly() {
          const isOnline = state.mode === "online" && state.room;
          const t = isOnline ? state.onlineTimeLeft : state.timeLeft;
          const max = isOnline ? state.room.timerSeconds : state.timerSeconds;
          const urgent = t <= 10;
          const pct = Math.max(0, Math.min(100, (t / max) * 100)) + "%";
          document.querySelectorAll("[data-hud-text]").forEach((el) => {
            el.textContent = t + "s";
            el.className = "font-mono-tabular text-base font-bold " + (urgent ? "text-red-700" : "text-slate-900");
          });
          document.querySelectorAll("[data-hud-label]").forEach((el) => {
            el.textContent = urgent ? "Hurry" : "Time";
            el.className = urgent ? "text-red-700" : "text-slate-500";
          });
          document.querySelectorAll("[data-hud-bar]").forEach((el) => {
            el.style.width = pct;
            el.className = "h-full transition-[width] duration-300 " + (urgent ? "bg-red-600" : "bg-emerald-600");
          });
        }

        function startTimer() {
          stopTimer();
          lastUrgentSecond = -1;
          lastSavedOnlineSecond = -1;

          if (state.mode === "online" && state.room) {
            timerInterval = setInterval(() => {
              if (!state.room || state.room.phase !== "playing") {
                stopTimer();
                return;
              }
              const maxSec = state.room.timerSeconds || 60;
              if (isReadyCountdownActive()) {
                state.onlineTimeLeft = maxSec;
                updateHudTimerOnly();
                return;
              }
              const msLeft = Math.max(0, (state.room.roundEndsAt || 0) - Date.now());
              const secs = Math.min(maxSec, Math.ceil(msLeft / 1000));
              state.onlineTimeLeft = secs;
              if (secs !== lastSavedOnlineSecond) {
                lastSavedOnlineSecond = secs;
                saveGameState();
              }
              if (secs > 0 && secs <= 10 && lastUrgentSecond !== secs) {
                lastUrgentSecond = secs;
                soundFx.playUrgentTick();
              }
              updateHudTimerOnly();

              if (secs <= 0 && !state.submittedOnline) {
                submitOnlineSheet(true);
              }

              // Host moves room from playing -> appeal after everyone submits or slight grace buffer
              if (state.room.hostId === myClientId && Date.now() >= (state.room.roundEndsAt || 0) + 1200) {
                finalizeOnlineRoundToAppeal();
              }
            }, 250);
            return;
          }

          timerInterval = setInterval(() => {
            if (state.phase !== "playing" || state.paused || state.backConfirmOpen || isReadyCountdownActive()) return;
            state.timeLeft = Math.max(0, state.timeLeft - 1);
            saveGameState();
            if (state.timeLeft > 0 && state.timeLeft <= 10) soundFx.playUrgentTick();
            if (state.timeLeft <= 0) {
              submitLocalTurn(true);
            } else {
              updateHudTimerOnly();
            }
          }, 1000);
        }

        function formatFirebaseError(err, fallbackMsg) {
          const code = err && err.code ? String(err.code) : "";
          if (code === "permission-denied" || (err && /permission/i.test(err.message || ""))) {
            return 'Firestore permission denied. In Firebase Console -> Firestore Database -> Rules, allow read/write access on the "rooms" collection.';
          }
          if (code === "unavailable" || code === "failed-precondition") {
            return "Could not reach Firebase Firestore. Ensure Cloud Firestore is created in your Firebase project and you are online.";
          }
          return (err && err.message) || fallbackMsg;
        }

        function subscribeToRoom(roomCode) {
          detachRoomListener();
          if (!db) return;
          const roomRef = db.collection("rooms").doc(roomCode);

          roomUnsubscribe = roomRef.onSnapshot(
            (snap) => {
              if (!snap.exists) {
                stopTimer();
                detachRoomListener();
                clearSavedGameState();
                state.room = null;
                state.phase = "title";
                state.onlineError = `Room "${roomCode}" was closed or does not exist.`;
                render();
                return;
              }

              const incoming = snap.data();
              const prevPhase = state.room ? state.room.phase : "title";
              const prevRound = state.room ? state.room.currentRound : 0;

              state.room = incoming;
              state.mode = "online";
              state.phase = incoming.phase;
              state.onlineError = "";

              if (incoming.phase === "playing" && (prevPhase !== "playing" || prevRound !== incoming.currentRound)) {
                finalizingRoundFlag = false;
                const isRestoringSameRound = Boolean(
                  pendingOnlineRestore &&
                  pendingOnlineRestore.roomCode === roomCode &&
                  pendingOnlineRestore.currentRound === incoming.currentRound
                );
                if (isRestoringSameRound) {
                  state.answers = { ...createEmptyAnswers(), ...pendingOnlineRestore.answers };
                  const serverDraft = incoming.submissions && incoming.submissions[myClientId];
                  if (serverDraft && CATEGORIES.every((c) => !state.answers[c.id])) {
                    state.answers = { ...createEmptyAnswers(), ...serverDraft };
                  }
                  pendingOnlineRestore = null;
                } else {
                  pendingOnlineRestore = null;
                  const serverDraft = incoming.submissions && incoming.submissions[myClientId];
                  state.answers = serverDraft ? { ...createEmptyAnswers(), ...serverDraft } : createEmptyAnswers();
                }
                state.submittedOnline = Boolean(incoming.submittedMap && incoming.submittedMap[myClientId]);
                const maxSec = incoming.timerSeconds || 60;
                const serverStartsAt = Number(incoming.roundStartsAt || 0);
                if (!isRestoringSameRound && !state.submittedOnline && serverStartsAt > Date.now()) {
                  state.onlineTimeLeft = maxSec;
                  startReadyCountdown(serverStartsAt);
                } else {
                  state.readyCountdownEndsAt = 0;
                  stopReadyCountdown();
                  state.onlineTimeLeft = Math.min(maxSec, Math.max(0, Math.ceil(((incoming.roundEndsAt || 0) - Date.now()) / 1000)));
                  if (!isRestoringSameRound) soundFx.playStart();
                }
                startTimer();
              } else if (incoming.phase === "playing") {
                pendingOnlineRestore = null;
                const nowSubmitted = Boolean(incoming.submittedMap && incoming.submittedMap[myClientId]);
                if (nowSubmitted) {
                  state.submittedOnline = true;
                  state.readyCountdownEndsAt = 0;
                  stopReadyCountdown();
                }
                if (!timerInterval) startTimer();

                // Host checks if all players have submitted
                const players = getOrderedRoomPlayers(incoming);
                const submittedIds = getOnlineSubmittedIds(incoming);
                if (incoming.hostId === myClientId && players.length > 0 && submittedIds.length >= players.length) {
                  finalizeOnlineRoundToAppeal();
                  return;
                }

                // Update waiting banner without blowing away input focus
                if (document.getElementById("play-sheet-form")) {
                  updateHudTimerOnly();
                  const statusEl = document.getElementById("online-wait-status");
                  if (statusEl) {
                    statusEl.textContent = `Sheet submitted · Waiting for other players (${submittedIds.length}/${players.length})`;
                  }
                  saveGameState();
                  return;
                }
              } else {
                pendingOnlineRestore = null;
                state.readyCountdownEndsAt = 0;
                stopReadyCountdown();
                stopTimer();
              }

              if (incoming.phase === "lobby" && incoming.recentReactions && typeof incoming.recentReactions === "object") {
                const nowMs = Date.now();
                for (const entry of Object.values(incoming.recentReactions)) {
                  if (!entry || !entry.id || seenLobbyReactionIds.has(entry.id)) continue;
                  seenLobbyReactionIds.add(entry.id);
                  const age = nowMs - (entry.createdAt || 0);
                  if (prevPhase === "lobby" && age < 15000) {
                    spawnFloatingReaction(entry.emoji || "🔥", entry.senderName || "");
                  } else if (prevPhase !== "lobby" && age < 4000) {
                    spawnFloatingReaction(entry.emoji || "🔥", entry.senderName || "");
                  }
                }
              }

              if (incoming.phase === "appeal" && prevPhase === "playing") {
                state.reviewChatDraft = "";
                soundFx.playTimeUp();
              }
              if (incoming.phase === "appeal" && Array.isArray(incoming.reviewMessages)) {
                const roundNum = Number(incoming.currentRound || 1);
                const hydrateKey = `${roomCode}|${roundNum}`;
                const isFirstHydrate = reviewToastHydratedKey !== hydrateKey && prevPhase !== "appeal";
                reviewToastHydratedKey = hydrateKey;
                const nowMs = Date.now();
                const currentMsgs = incoming.reviewMessages
                  .filter((m) => m && m.id && (!m.round || Number(m.round) === roundNum))
                  .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                for (const m of currentMsgs) {
                  if (seenReviewMessageIds.has(m.id)) continue;
                  seenReviewMessageIds.add(m.id);
                  const ageMs = nowMs - (m.createdAt || 0);
                  if (!isFirstHydrate || ageMs < 5000) {
                    showReviewChatToast(m, { isSelf: m.senderId === myClientId });
                  }
                }
              }
              if (incoming.phase === "appeal" || incoming.phase === "results") {
                const roundNum = Number(incoming.currentRound || 1);
                const appealsKey = `${roomCode}|${roundNum}`;
                const incomingAppeals = incoming.appeals && typeof incoming.appeals === "object" ? incoming.appeals : {};
                const nextSigMap = {};
                for (const [k, v] of Object.entries(incomingAppeals)) {
                  const sig = getAppealEntrySig(v);
                  if (sig) nextSigMap[k] = sig;
                }
                if (appealsToastHydratedKey !== appealsKey) {
                  appealsToastHydratedKey = appealsKey;
                  lastOnlineAppealsSigMap = nextSigMap;
                } else {
                  const allKeys = new Set([...Object.keys(lastOnlineAppealsSigMap), ...Object.keys(nextSigMap)]);
                  const changedKeys = [];
                  for (const k of allKeys) {
                    if ((lastOnlineAppealsSigMap[k] || "") !== (nextSigMap[k] || "")) {
                      changedKeys.push(k);
                    }
                  }
                  lastOnlineAppealsSigMap = nextSigMap;
                  if (changedKeys.length > 0) {
                    const scored = buildOnlineCurrentRoundResult(incoming);
                    const fallbackAdmin = getRoomAdminName();
                    changedKeys.slice(-2).forEach((k) => {
                      const parsed = parseAppealKey(k);
                      if (!parsed) return;
                      const ruling = getCellAdminRuling(incomingAppeals, parsed.playerId, parsed.catId);
                      const entry = incomingAppeals[k];
                      const byName = (entry && entry.by) || ruling.by || fallbackAdmin;
                      const payload = buildRulingToastPayload(scored, parsed.playerId, parsed.catId, ruling.decision, byName);
                      if (payload) showReviewRulingToast(payload);
                    });
                  }
                }
              } else {
                appealsToastHydratedKey = "";
                lastOnlineAppealsSigMap = {};
              }
              if (incoming.phase === "gameover" && prevPhase !== "gameover") {
                soundFx.playVictory();
              }

              render();
            },
            (err) => {
              state.onlineError = formatFirebaseError(err, "Real-time room sync lost.");
              render();
            }
          );
        }

        async function joinOnlineRoom() {
          if (!db) {
            state.onlineError = firebaseInitError || "Firebase Firestore is not initialized.";
            render();
            return;
          }
          const code = state.joinCode.trim().toUpperCase();
          if (!code) {
            state.onlineError = "Enter a room code to join.";
            render();
            return;
          }
          const name = state.onlineName.trim() || "Player";

          state.onlineBusy = true;
          state.onlineError = "";
          render();

          try {
            const roomRef = db.collection("rooms").doc(code);
            const snap = await roomRef.get();
            if (!snap.exists) {
              state.onlineBusy = false;
              state.onlineError = `Room "${code}" not found. Check the code and try again.`;
              render();
              return;
            }
            const data = snap.data();
            const existingPlayer = data.playersMap && data.playersMap[myClientId];
            const existingCount = Object.keys(data.playersMap || {}).length;
            const assignedAvatar =
              existingPlayer && existingPlayer.avatar
                ? existingPlayer.avatar
                : LOBBY_AVATARS[existingCount % LOBBY_AVATARS.length];
            await roomRef.update({
              [`playersMap.${myClientId}`]: {
                id: myClientId,
                name,
                avatar: assignedAvatar,
                ready: existingPlayer ? Boolean(existingPlayer.ready) : false,
                joinedAt: existingPlayer ? existingPlayer.joinedAt : Date.now(),
              },
            });
            state.onlineBusy = false;
            state.lobbyChatDraft = "";
            state.lobbyRiddleShowAnswer = false;

            state.onlineBusy = false;

          const manualCandidate = activePool.includes(state.manualLetter)

            : (activePool.includes(r.targetLetter) ? r.targetLetter : getDefaultLetter(roomLang));
          const letter = r.letterMode === "manual"
            ? normalizeTargetLetter(manualCandidate)
            : pickNextLetter(r.usedLetters || [], roomLang);
          const nextRound = (r.currentRound || 0) + 1;
          const used = (r.usedLetters || []).includes(letter) ? r.usedLetters : [...(r.usedLetters || []), letter];
          const roundStartsAt = Date.now() + GET_READY_DURATION_MS;
          const roundEndsAt = roundStartsAt + (r.timerSeconds || 60) * 1000;

          try {
            await db.collection("rooms").doc(r.roomCode).update({
              phase: "playing",
              currentRound: nextRound,
              targetLetter: letter,
              usedLetters: used,
              roundStartsAt,
              roundEndsAt,
              submissions: {},
              submittedMap: {},
              appeals: {},
              reviewMessages: [],
            });

        async function setOnlineAppeal(playerId, catId, decision) {
          if (!db || !state.room) return;
          // Strictly restrict appeal rulings to the Room Admin / Host
          if (state.room.hostId !== myClientId) return;

          const r = state.room;
          const myPlayer = r.playersMap && r.playersMap[myClientId];
          const adminName = (myPlayer && myPlayer.name) || state.onlineName || "Host";
          const key = getAppealKey(playerId, catId);
          const currentRuling = getCellAdminRuling(r.appeals || {}, playerId, catId);
          const targetDecision = decision === currentRuling.decision ? "auto" : decision;

          const nowTs = Date.now();
          const updatePayload = {};
          const nextAppeals = { ...(r.appeals || {}) };
          const prevSig = lastOnlineAppealsSigMap[key] || "";
          if (targetDecision === "auto") {
            delete nextAppeals[key];
            delete lastOnlineAppealsSigMap[key];
            updatePayload[`appeals.${key}`] = window.firebase.firestore.FieldValue.delete();
            if (r.roundHistory && r.roundHistory[String(r.currentRound)]) {
              updatePayload[`roundHistory.${r.currentRound}.appeals.${key}`] = window.firebase.firestore.FieldValue.delete();
            }
          } else {
            const val = {
              decision: targetDecision,
              by: adminName,
              adminId: myClientId,
              updatedAt: nowTs,
            };
            nextAppeals[key] = val;
            lastOnlineAppealsSigMap[key] = getAppealEntrySig(val);
            updatePayload[`appeals.${key}`] = val;
            if (r.roundHistory && r.roundHistory[String(r.currentRound)]) {
              updatePayload[`roundHistory.${r.currentRound}.appeals.${key}`] = val;
            }
          }

          appealsToastHydratedKey = `${r.roomCode}|${Number(r.currentRound || 1)}`;
          const optimisticResult = buildOnlineCurrentRoundResult({ ...r, appeals: nextAppeals });
          const optimisticPayload = buildRulingToastPayload(optimisticResult, playerId, catId, targetDecision, adminName);
          if (optimisticPayload) showReviewRulingToast(optimisticPayload);

          try {
            await db.collection("rooms").doc(r.roomCode).update(updatePayload);
          } catch (err) {
            if (prevSig) lastOnlineAppealsSigMap[key] = prevSig;
            else delete lastOnlineAppealsSigMap[key];
            state.onlineError = formatFirebaseError(err, "Failed to update admin ruling.");
            render();
          }
        }

        // =====================================================================
        // 6. LOCAL GAME ACTIONS (SOLO & PASS-AND-PLAY)
        // =====================================================================
        function startLocalGame() {
          const roster =
            state.mode === "solo"
              ? [
                  { id: "human_1", name: state.soloName.trim() || "Player 1" },
                  ...Array.from({ length: state.botCount }, (_, i) => ({
                    id: "bot_" + (i + 1),
                    name: BOT_NAMES[i] || "Bot " + (i + 1),
                    isBot: true,
                  })),
                ]
              : state.localPlayers.map((p, idx) => ({
                  id: p.id,
                  name: p.name.trim() || "Player " + (idx + 1),
                }));

          state.activePlayers = roster;
          state.roundResults = [];
          state.usedLetters = [];
          beginLocalRound(1);
        }

        function beginLocalRound(roundNum) {
          const activePool = getActiveAlphabet(state.language);
          const manualCandidate = activePool.includes(state.manualLetter)
            ? state.manualLetter
            : getDefaultLetter(state.language);
          const letter = state.letterMode === "manual"
            ? normalizeTargetLetter(manualCandidate)
            : pickNextLetter(state.usedLetters, state.language);
          state.currentRound = roundNum;
          state.targetLetter = letter;
          if (!state.usedLetters.includes(letter)) state.usedLetters.push(letter);
          state.turnIndex = 0;
          state.roundSubmissions = [];
          state.appeals = {};
          state.reviewMessages = [];
          state.reviewChatDraft = "";
          state.answers = createEmptyAnswers();
          state.timeLeft = state.timerSeconds;
          state.paused = false;

          if (state.mode === "pass_and_play") {
            stopReadyCountdown();
            stopTimer();
            state.readyCountdownEndsAt = 0;
            state.phase = "handoff";
            render();
          } else {
            state.phase = "playing";
            const endsAt = Date.now() + GET_READY_DURATION_MS;
            state.readyCountdownEndsAt = endsAt;
            render();
            startReadyCountdown(endsAt);
            startTimer();
          }
        }

        function submitLocalTurn(isTimeout = false) {
          stopTimer();
          const humans = state.activePlayers.filter((p) => !p.isBot);
          const currentPlayer = humans[state.turnIndex];
          if (!currentPlayer) return;

          if (isTimeout) soundFx.playTimeUp();
          else soundFx.playSubmit();

          state.roundSubmissions.push({ player: currentPlayer, answers: { ...state.answers } });

          if (state.turnIndex + 1 < humans.length) {
            state.turnIndex += 1;
            state.answers = createEmptyAnswers();
            state.timeLeft = state.timerSeconds;
            state.phase = "handoff";
            render();
            return;
          }

          const botSubs = state.activePlayers
            .filter((p) => p.isBot)
            .map((bot) => ({ player: bot, answers: pickBotAnswers(state.targetLetter, state.botDifficulty) }));

          state.roundSubmissions = [...state.roundSubmissions, ...botSubs];
          state.reviewingPlayerId = humans[0] ? humans[0].id : "";
          const scored = scoreRound(state.currentRound, state.targetLetter, state.roundSubmissions, state.appeals);
          state.roundResults = [...state.roundResults.filter((r) => r.roundNumber !== state.currentRound), scored];
          state.phase = "appeal";
          render();
        }

        function setLocalAppeal(playerId, catId, decision) {
          // Strictly restrict appeal rulings to the Room Admin / primary player
          if (!isCurrentUserAdmin()) return;

          const adminId = getRoomAdminId();
          const adminName = getRoomAdminName();
          const currentRuling = getCellAdminRuling(state.appeals, playerId, catId);
          const nextDecision = currentRuling.decision === decision ? "auto" : decision;

          state.appeals = setAdminRulingInMap(state.appeals, playerId, catId, adminId, adminName, nextDecision);
          const updated = scoreRound(state.currentRound, state.targetLetter, state.roundSubmissions, state.appeals);
          state.roundResults = state.roundResults.map((r) => (r.roundNumber === state.currentRound ? updated : r));
          render();
          const toastPayload = buildRulingToastPayload(updated, playerId, catId, nextDecision, adminName);
          if (toastPayload) showReviewRulingToast(toastPayload);
        }

        function sendLocalReviewMessage(rawText) {
          const text = String(rawText || "").trim().slice(0, 240);
          if (!text) return;
          const sender = getCurrentChatSender();
          const msg = {
            id: "msg_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
            round: state.currentRound,
            senderId: sender.id,
            senderName: sender.name,
            avatar: sender.avatar,
            isAdmin: sender.isAdmin,
            text,
            createdAt: Date.now(),
          };
          seenReviewMessageIds.add(msg.id);
          state.reviewMessages = [
            ...(Array.isArray(state.reviewMessages) ? state.reviewMessages : []),
            msg,
          ];
          state.reviewChatDraft = "";
          render();
          showReviewChatToast(msg, { isSelf: true });
        }
