        // =====================================================================
        // 3. SOUND ENGINE (Web Audio API)
        // =====================================================================
        const soundFx = (() => {
          let ctx = null;
          let muted = false;
          function ensureCtx() {
            if (muted) return null;
            if (!ctx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              ctx = new AC();
            }
            if (ctx.state === "suspended") ctx.resume().catch(() => {});
            return ctx;
          }
          function tone(freq, dur, type = "sine", vol = 0.08, delay = 0) {
            const c = ensureCtx();
            if (!c) return;
            const now = c.currentTime + delay;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + dur + 0.02);
          }
          return {
            isMuted: () => muted,
            toggleMute: () => { muted = !muted; return muted; },
            playStart: () => { tone(523.25, 0.12, "triangle", 0.08, 0); tone(659.25, 0.12, "triangle", 0.08, 0.09); tone(783.99, 0.18, "triangle", 0.09, 0.18); },

            playVictory: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, "triangle", 0.08, i * 0.11)),

        // =====================================================================
        // 4. PURE GAME RULES, VALIDATION, APPEALS & 10/5/0 SCORING
        // =====================================================================
        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function createEmptyAnswers() {
          return { name: "", place: "", animal: "", plant: "", thing: "" };
        }

        function normalizeWord(raw) {
          return String(raw || "")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ")
            .replace(/^[^a-z0-9\u0D00-\u0D7F]+|[^a-z0-9\u0D00-\u0D7F]+$/g, "");
        }

        function startsWithTargetLetter(trimmed, upperTarget) {
          const first = trimmed[0];
          if (!first) return false;
          if (first.toUpperCase() === upperTarget) return true;
          const ml = MALAYALAM_INITIAL_MAP[first];
          return Boolean(ml && ml.includes(upperTarget));
        }

        function looksLikeGibberish(norm) {
          if (/(.)\1\1/.test(norm)) return true;
          if (/^[a-z\s]+$/.test(norm)) {
            const lettersOnly = norm.replace(/\s+/g, "");
            if (lettersOnly.length >= 3 && !/[aeiouy]/.test(lettersOnly)) return true;
            if (lettersOnly.length > 28) return true;
          }
          return false;
        }

        function isInDictionary(word, letter, catId) {
          const norm = normalizeWord(word);
          if (!norm) return false;
          const pool = (WORD_DICTIONARY[letter.toUpperCase()] || {})[catId] || [];
          return pool.some((item) => normalizeWord(item) === norm);
        }

        function validateWordForLetter(raw, targetLetter, catId) {
          const trimmed = String(raw || "").trim();
          const upper = targetLetter.toUpperCase();
          if (!trimmed) return { valid: false, reason: "blank", message: "No answer entered", inDictionary: false };
          const norm = normalizeWord(trimmed);
          if (norm.length < 2) return { valid: false, reason: "too_short", message: "Enter at least 2 letters", inDictionary: false };
          if (!startsWithTargetLetter(trimmed, upper)) return { valid: false, reason: "wrong_letter", message: `Must start with "${upper}"`, inDictionary: false };
          const inDict = catId ? isInDictionary(trimmed, upper, catId) : false;
          if (!inDict && looksLikeGibberish(norm)) return { valid: false, reason: "gibberish", message: "Word looks invalid", inDictionary: false };
          return { valid: true, reason: "ok", message: inDict ? `Verified "${upper}" word` : `Starts with "${upper}"`, inDictionary: inDict };
        }

        function getAppealKey(playerId, catId) {
          return `${playerId}__${catId}`;
        }

        function getAppealEntry(appeals, playerId, catId) {
          if (!appeals) return { decision: "auto", by: "" };
          const key = getAppealKey(playerId, catId);
          return appeals[key] || { decision: "auto", by: "" };
        }

        function setAppealInMap(appeals, playerId, catId, decision, appealedBy) {
          const next = { ...(appeals || {}) };
          const key = getAppealKey(playerId, catId);
          if (decision === "auto") {
            delete next[key];
          } else {
            next[key] = { decision, by: appealedBy || "" };
          }
          return next;
        }

        function scoreRound(roundNumber, targetLetter, submissions, appeals = {}) {
          const upper = targetLetter.toUpperCase();
          const wordCounts = { name: new Map(), place: new Map(), animal: new Map(), plant: new Map(), thing: new Map() };

          const pre = submissions.map(({ player, answers }) => {
            const cellPre = {};
            for (const cat of CATEGORIES) {
              const raw = String((answers && answers[cat.id]) || "").trim();
              const norm = normalizeWord(raw);
              const val = validateWordForLetter(raw, upper, cat.id);
              const appeal = getAppealEntry(appeals, player.id, cat.id);
              const decision = appeal.decision || "auto";
              const effectiveValid =
                raw.length > 0 &&
                (decision === "approved" || (decision === "auto" && val.valid));

              cellPre[cat.id] = { raw, norm, val, decision, appealedBy: appeal.by || "", effectiveValid };
              if (effectiveValid && norm) {
                wordCounts[cat.id].set(norm, (wordCounts[cat.id].get(norm) || 0) + 1);
              }
            }
            return { player, cellPre };
          });

          const playerScores = pre.map(({ player, cellPre }) => {
            const cells = {};
            let roundTotal = 0;
            for (const cat of CATEGORIES) {
              const item = cellPre[cat.id];
              if (!item.raw) {
                cells[cat.id] = {
                  raw: "", normalized: "", points: 0, status: "blank",
                  reason: "No answer entered", appealDecision: "auto", appealedBy: "",
                };
              } else if (!item.effectiveValid) {
                const isRejected = item.decision === "rejected";
                cells[cat.id] = {
                  raw: item.raw, normalized: item.norm, points: 0,
                  status: isRejected ? "invalid" : (item.val.reason === "wrong_letter" ? "wrong_letter" : "invalid"),
                  reason: isRejected
                    ? (item.appealedBy ? `Marked incorrect by ${item.appealedBy}` : "Marked incorrect on appeal")
                    : item.val.message,
                  appealDecision: item.decision,
                  appealedBy: item.appealedBy,
                };
              } else {
                const isShared = (wordCounts[cat.id].get(item.norm) || 1) > 1;
                const pts = isShared ? 5 : 10;
                roundTotal += pts;
                const reason =
                  item.decision === "approved"
                    ? (isShared ? "Approved on appeal · +5 (shared)" : "Approved on appeal · +10")
                    : (isShared ? "Shared word (+5)" : "Unique word (+10)");
                cells[cat.id] = {
                  raw: item.raw, normalized: item.norm, points: pts,
                  status: isShared ? "shared" : "unique",
                  reason,
                  appealDecision: item.decision,
                  appealedBy: item.appealedBy,
                };
              }
            }
            return { playerId: player.id, playerName: player.name, isBot: Boolean(player.isBot), cells, roundTotal };
          });

          return { roundNumber, letter: upper, playerScores };
        }

        function pickBotAnswers(targetLetter, difficulty) {
          const dict = WORD_DICTIONARY[targetLetter.toUpperCase()];
          const ans = createEmptyAnswers();
          if (!dict) return ans;
          const blankChance = difficulty === "casual" ? 0.14 : 0.03;
          for (const cat of CATEGORIES) {
            const pool = dict[cat.id] || [];
            if (!pool.length) continue;
            ans[cat.id] = Math.random() < blankChance ? "" : pool[Math.floor(Math.random() * pool.length)];
          }
          return ans;
        }

        function pickNextLetter(usedLetters) {
          const used = new Set((usedLetters || []).map((l) => l.toUpperCase()));
          const avail = ALPHABET.filter((l) => !used.has(l));
          const pool = avail.length ? avail : ALPHABET;
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function calculateStandings(players, roundResults) {
          const map = new Map();
          players.forEach((p) => {
            map.set(p.id, { playerId: p.id, playerName: p.name, totalScore: 0, uniqueCount: 0, sharedCount: 0, rank: 1 });
          });
          roundResults.forEach((r) => {
            r.playerScores.forEach((ps) => {
              if (!map.has(ps.playerId)) {
                map.set(ps.playerId, { playerId: ps.playerId, playerName: ps.playerName, totalScore: 0, uniqueCount: 0, sharedCount: 0, rank: 1 });
              }
              const entry = map.get(ps.playerId);
              entry.totalScore += ps.roundTotal;
              CATEGORIES.forEach((cat) => {
                if (ps.cells[cat.id].status === "unique") entry.uniqueCount += 1;
                if (ps.cells[cat.id].status === "shared") entry.sharedCount += 1;
              });
            });
          });
          const sorted = Array.from(map.values()).sort((a, b) =>
            b.totalScore - a.totalScore || b.uniqueCount - a.uniqueCount || a.playerName.localeCompare(b.playerName)
          );
          for (let i = 0; i < sorted.length; i++) {
            sorted[i].rank = i > 0 && sorted[i].totalScore === sorted[i - 1].totalScore ? sorted[i - 1].rank : i + 1;
          }
          return sorted;
        }

        function formatCatLabel(cat) {
          if (state.language === "english") return { primary: cat.en, secondary: "" };
          return { primary: cat.ml, secondary: cat.en };
        }

        // =====================================================================
        // 5. STATE & FIREBASE FIRESTORE ONLINE MULTIPLAYER ENGINE
        // =====================================================================
        const BOT_NAMES = ["Kuttappan Bot", "Minnu Bot", "Appu Bot"];

        function getOrCreateClientId() {
          try {
            const existing = sessionStorage.getItem("peru_sadhanam_client_id");
            if (existing) return existing;
            const created = "p_" + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem("peru_sadhanam_client_id", created);
            return created;
          } catch {
            return "p_" + Math.random().toString(36).slice(2, 10);
          }
        }
        const myClientId = getOrCreateClientId();

        const urlParams = new URLSearchParams(window.location.search);
        const initialJoinCode = (urlParams.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);

        const state = {
          phase: "title", // title | lobby | handoff | playing | appeal | results | gameover
          mode: initialJoinCode ? "online" : "solo", // solo | pass_and_play | online
          language: "bilingual",
          totalRounds: 3,
          timerSeconds: 60,
          letterMode: "random",
          manualLetter: "K",
          soloName: "Player 1",
          botCount: 1,
          botDifficulty: "casual",
          localPlayers: [
            { id: "lp_1", name: "Player 1" },
            { id: "lp_2", name: "Player 2" },
          ],
          onlineName: "Player 1",
          joinCode: initialJoinCode,
          onlineError: firebaseInitError,
          onlineBusy: false,
          // Active local session
          activePlayers: [],
          currentRound: 1,
          targetLetter: "K",
          usedLetters: [],
          turnIndex: 0,
          timeLeft: 60,
          paused: false,
          hintsEnabled: false,
          answers: createEmptyAnswers(),
          roundSubmissions: [],
          roundResults: [],
          appeals: {},
          // Firebase Firestore Online Room state
          room: null,
          submittedOnline: false,
          onlineTimeLeft: 60,
        };

        let timerInterval = null;
        let roomUnsubscribe = null;
        let draftSyncTimer = null;
        let finalizingRoundFlag = false;
        let lastUrgentSecond = -1;

        function stopTimer() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        }

        function detachRoomListener() {
          if (roomUnsubscribe) {
            roomUnsubscribe();
            roomUnsubscribe = null;
          }
          if (draftSyncTimer) {
            clearTimeout(draftSyncTimer);
            draftSyncTimer = null;
          }
        }

        function getOrderedRoomPlayers(room) {
          if (!room) return [];
          const list = Object.values(room.playersMap || {});
          return list.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
        }

        function getOnlineSubmittedIds(room) {
          if (!room || !room.submittedMap) return [];
          return Object.keys(room.submittedMap).filter((id) => Boolean(room.submittedMap[id]));
        }

        function buildOnlineCurrentRoundResult(room) {
          const players = getOrderedRoomPlayers(room);
          const subs = players.map((p) => ({
            player: p,
            answers: (room.submissions && room.submissions[p.id]) || createEmptyAnswers(),
          }));
          return scoreRound(room.currentRound, room.targetLetter, subs, room.appeals || {});
        }

        function getOnlineAllRoundResults(room) {
          if (!room) return [];
          const hist = room.roundHistory || {};
          const keys = Object.keys(hist).map(Number).sort((a, b) => a - b);
          const list = keys.map((k) => {
            const entry = hist[String(k)];
            const players = getOrderedRoomPlayers(room);
            const subs = players.map((p) => ({
              player: p,
              answers: (entry.submissions && entry.submissions[p.id]) || createEmptyAnswers(),
            }));
            const appealsToUse = Number(k) === room.currentRound && (room.phase === "appeal" || room.phase === "results")
              ? (room.appeals || entry.appeals || {})
              : (entry.appeals || {});
            return scoreRound(entry.roundNumber, entry.letter, subs, appealsToUse);
          });

          if ((room.phase === "appeal" || room.phase === "results") && !hist[String(room.currentRound)]) {
            list.push(buildOnlineCurrentRoundResult(room));
          }
          return list;
        }

        function updateHudTimerOnly() {
          const timerEl = document.getElementById("hud-timer-text");
          const barEl = document.getElementById("hud-timer-bar");
          const labelEl = document.getElementById("hud-timer-label");
          const isOnline = state.mode === "online" && state.room;
          const t = isOnline ? state.onlineTimeLeft : state.timeLeft;
          const max = isOnline ? state.room.timerSeconds : state.timerSeconds;
          if (!timerEl || !barEl || !labelEl) return;
          const urgent = t <= 10;
          timerEl.textContent = t + "s";
          timerEl.className = "font-mono-tabular text-base font-bold " + (urgent ? "text-red-700" : "text-slate-900");
          labelEl.textContent = urgent ? "Hurry" : "Time";
          labelEl.className = urgent ? "text-red-700" : "text-slate-500";
          barEl.style.width = Math.max(0, Math.min(100, (t / max) * 100)) + "%";
          barEl.className = "h-full transition-[width] duration-300 " + (urgent ? "bg-red-600" : "bg-emerald-600");
        }

        function startTimer() {
          stopTimer();
          lastUrgentSecond = -1;

          if (state.mode === "online" && state.room) {
            timerInterval = setInterval(() => {
              if (!state.room || state.room.phase !== "playing") {
                stopTimer();
                return;
              }
              const msLeft = Math.max(0, (state.room.roundEndsAt || 0) - Date.now());
              const secs = Math.ceil(msLeft / 1000);
              state.onlineTimeLeft = secs;
              if (secs > 0 && secs <= 10 && lastUrgentSecond !== secs) {
                lastUrgentSecond = secs;
                soundFx.playUrgentTick();
              }
              updateHudTimerOnly();

              if (secs <= 0 && !state.submittedOnline) {
                submitOnlineSheet(true);
              }

              // Host moves room from playing -> appeal after everyone submits or slight grace buffer
              if (state.room.hostId === myClientId && Date.now() >= (state.room.roundEndsAt || 0) + 1200) {
                finalizeOnlineRoundToAppeal();
              }
            }, 250);
            return;
          }

          timerInterval = setInterval(() => {
            if (state.phase !== "playing" || state.paused) return;
            state.timeLeft = Math.max(0, state.timeLeft - 1);
            if (state.timeLeft > 0 && state.timeLeft <= 10) soundFx.playUrgentTick();
            if (state.timeLeft <= 0) {
              submitLocalTurn(true);
            } else {
              updateHudTimerOnly();
            }
          }, 1000);
        }

        function formatFirebaseError(err, fallbackMsg) {
          const code = err && err.code ? String(err.code) : "";
          if (code === "permission-denied" || (err && /permission/i.test(err.message || ""))) {
            return 'Firestore permission denied. In Firebase Console -> Firestore Database -> Rules, allow read/write access on the "rooms" collection.';
          }
          if (code === "unavailable" || code === "failed-precondition") {
            return "Could not reach Firebase Firestore. Ensure Cloud Firestore is created in your Firebase project and you are online.";
          }
          return (err && err.message) || fallbackMsg;
        }

        function subscribeToRoom(roomCode) {
          detachRoomListener();
          if (!db) return;
          const roomRef = db.collection("rooms").doc(roomCode);

          roomUnsubscribe = roomRef.onSnapshot(
            (snap) => {
              if (!snap.exists) {
                stopTimer();
                detachRoomListener();
                state.room = null;
                state.phase = "title";
                state.onlineError = `Room "${roomCode}" was closed or does not exist.`;
                render();
                return;
              }

              const incoming = snap.data();
              const prevPhase = state.room ? state.room.phase : "title";
              const prevRound = state.room ? state.room.currentRound : 0;

              state.room = incoming;
              state.mode = "online";
              state.phase = incoming.phase;
              state.onlineError = "";

              if (incoming.phase === "playing" && (prevPhase !== "playing" || prevRound !== incoming.currentRound)) {
                finalizingRoundFlag = false;
                state.answers = createEmptyAnswers();
                state.submittedOnline = Boolean(incoming.submittedMap && incoming.submittedMap[myClientId]);
                state.onlineTimeLeft = Math.max(0, Math.ceil(((incoming.roundEndsAt || 0) - Date.now()) / 1000));
                soundFx.playStart();
                startTimer();
              } else if (incoming.phase === "playing") {
                const nowSubmitted = Boolean(incoming.submittedMap && incoming.submittedMap[myClientId]);
                if (nowSubmitted) state.submittedOnline = true;
                if (!timerInterval) startTimer();

                // Host checks if all players have submitted
                const players = getOrderedRoomPlayers(incoming);
                const submittedIds = getOnlineSubmittedIds(incoming);
                if (incoming.hostId === myClientId && players.length > 0 && submittedIds.length >= players.length) {
                  finalizeOnlineRoundToAppeal();
                  return;
                }

                // Update waiting banner without blowing away input focus
                if (document.getElementById("play-sheet-form")) {
                  updateHudTimerOnly();
                  const statusEl = document.getElementById("online-wait-status");
                  if (statusEl) {
                    statusEl.textContent = `Sheet submitted · Waiting for other players (${submittedIds.length}/${players.length})`;
                  }
                  return;
                }
              } else {
                stopTimer();
              }

              if (incoming.phase === "appeal" && prevPhase === "playing") {
                soundFx.playTimeUp();
              }
              if (incoming.phase === "gameover" && prevPhase !== "gameover") {
                soundFx.playVictory();
              }

              render();
            },
            (err) => {
              state.onlineError = formatFirebaseError(err, "Real-time room sync lost.");
              render();
            }
          );
        }

        async function createOnlineRoom() {
          if (!db) {
            state.onlineError = firebaseInitError || "Firebase Firestore is not initialized.";
            render();
            return;
          }
          const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          let code = "";
          for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
          const name = state.onlineName.trim() || "Host";

          state.onlineBusy = true;
          state.onlineError = "";
          render();

          try {
            const roomRef = db.collection("rooms").doc(code);
            const payload = {
              roomCode: code,
              hostId: myClientId,
              phase: "lobby",
              totalRounds: state.totalRounds,
              timerSeconds: state.timerSeconds,
              letterMode: state.letterMode,
              manualLetter: state.manualLetter,
              usedLetters: [],
              currentRound: 0,
              targetLetter: state.manualLetter,
              roundEndsAt: 0,
              playersMap: {
                [myClientId]: { id: myClientId, name, joinedAt: Date.now() },
              },
              submissions: {},
              submittedMap: {},
              appeals: {},
              roundHistory: {},
              createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            };
            await roomRef.set(payload);
            state.onlineBusy = false;
            state.room = payload;
            state.phase = "lobby";
            subscribeToRoom(code);
            render();
          } catch (err) {
            state.onlineBusy = false;
            state.onlineError = formatFirebaseError(err, "Failed to create room.");
            render();
          }
        }

        async function joinOnlineRoom() {
          if (!db) {
            state.onlineError = firebaseInitError || "Firebase Firestore is not initialized.";
            render();
            return;
          }
          const code = state.joinCode.trim().toUpperCase();
          if (!code) {
            state.onlineError = "Enter a room code to join.";
            render();
            return;
          }
          const name = state.onlineName.trim() || "Player";

          state.onlineBusy = true;
          state.onlineError = "";
          render();

          try {
            const roomRef = db.collection("rooms").doc(code);
            const snap = await roomRef.get();
            if (!snap.exists) {
              state.onlineBusy = false;
              state.onlineError = `Room "${code}" not found. Check the code and try again.`;
              render();
              return;
            }
            const data = snap.data();
            const existingPlayer = data.playersMap && data.playersMap[myClientId];
            await roomRef.update({
              [`playersMap.${myClientId}`]: {
                id: myClientId,
                name,
                joinedAt: existingPlayer ? existingPlayer.joinedAt : Date.now(),
              },
            });
            state.onlineBusy = false;
            subscribeToRoom(code);
          } catch (err) {
            state.onlineBusy = false;
            state.onlineError = formatFirebaseError(err, "Could not join room.");
            render();
          }
        }

        async function startOnlineRound() {
          if (!db || !state.room || state.room.hostId !== myClientId) return;
          const r = state.room;
          const letter = r.letterMode === "manual"
            ? (state.manualLetter || r.targetLetter || "K").toUpperCase()
            : pickNextLetter(r.usedLetters || []);
          const nextRound = (r.currentRound || 0) + 1;
          const used = (r.usedLetters || []).includes(letter) ? r.usedLetters : [...(r.usedLetters || []), letter];
          const roundEndsAt = Date.now() + (r.timerSeconds || 60) * 1000;

          try {
            await db.collection("rooms").doc(r.roomCode).update({
              phase: "playing",
              currentRound: nextRound,
              targetLetter: letter,
              usedLetters: used,
              roundEndsAt,
              submissions: {},
              submittedMap: {},
              appeals: {},
            });
          } catch (err) {
            state.onlineError = formatFirebaseError(err, "Failed to start round.");
            render();
          }
        }

        async function submitOnlineSheet(isTimeout = false) {
          if (!db || !state.room || state.submittedOnline) return;
          state.submittedOnline = true;
          if (isTimeout) soundFx.playTimeUp();
          else soundFx.playSubmit();

          const r = state.room;
          try {
            await db.collection("rooms").doc(r.roomCode).update({
              [`submissions.${myClientId}`]: { ...state.answers },
              [`submittedMap.${myClientId}`]: true,
            });
            render();
          } catch (err) {
            state.submittedOnline = false;
            state.onlineError = formatFirebaseError(err, "Failed to submit sheet.");
            render();
          }
        }

        async function finalizeOnlineRoundToAppeal() {
          if (!db || !state.room || state.room.hostId !== myClientId || finalizingRoundFlag) return;
          if (state.room.phase !== "playing") return;
          finalizingRoundFlag = true;
          stopTimer();

          try {
            await db.collection("rooms").doc(state.room.roomCode).update({
              phase: "appeal",
            });
          } catch (err) {
            finalizingRoundFlag = false;
            state.onlineError = formatFirebaseError(err, "Failed to transition to Appeal & Review.");
            render();
          }
        }

        async function setOnlineAppeal(playerId, catId, decision) {
          if (!db || !state.room) return;
          const r = state.room;
          const myPlayer = r.playersMap && r.playersMap[myClientId];
          const myName = (myPlayer && myPlayer.name) || state.onlineName || "Player";
          const key = getAppealKey(playerId, catId);

          const updatePayload = {};
          if (decision === "auto") {
            updatePayload[`appeals.${key}`] = window.firebase.firestore.FieldValue.delete();
            if (r.roundHistory && r.roundHistory[String(r.currentRound)]) {
              updatePayload[`roundHistory.${r.currentRound}.appeals.${key}`] = window.firebase.firestore.FieldValue.delete();
            }
          } else {
            const val = { decision, by: myName };
            updatePayload[`appeals.${key}`] = val;
            if (r.roundHistory && r.roundHistory[String(r.currentRound)]) {
              updatePayload[`roundHistory.${r.currentRound}.appeals.${key}`] = val;
            }
          }

          try {
            await db.collection("rooms").doc(r.roomCode).update(updatePayload);
          } catch (err) {
            state.onlineError = formatFirebaseError(err, "Failed to update appeal.");
            render();
          }
        }

        async function confirmOnlineAppeals() {
          if (!db || !state.room || state.room.hostId !== myClientId) return;
          const r = state.room;
          try {
            await db.collection("rooms").doc(r.roomCode).update({
              phase: "results",
              [`roundHistory.${r.currentRound}`]: {
                roundNumber: r.currentRound,
                letter: r.targetLetter,
                submissions: r.submissions || {},
                appeals: r.appeals || {},
              },
            });
          } catch (err) {
            state.onlineError = formatFirebaseError(err, "Failed to lock round scores.");
            render();
          }
        }

        async function reopenOnlineAppeal() {
          if (!db || !state.room || state.room.hostId !== myClientId) return;
          try {
            await db.collection("rooms").doc(state.room.roomCode).update({ phase: "appeal" });
          } catch (err) {
            state.onlineError = formatFirebaseError(err, "Failed to reopen Appeal & Review.");
            render();
          }
        }

        async function leaveOnlineRoom() {
          const r = state.room;
          stopTimer();
          detachRoomListener();
          state.room = null;
          state.submittedOnline = false;
          state.phase = "title";
          render();

          if (db && r && r.phase === "lobby" && r.hostId !== myClientId) {
            try {
              await db.collection("rooms").doc(r.roomCode).update({
                [`playersMap.${myClientId}`]: window.firebase.firestore.FieldValue.delete(),
              });
            } catch {
              // Ignore cleanup errors on exit
            }
          }
        }

        // =====================================================================
        // 6. LOCAL GAME ACTIONS (SOLO & PASS-AND-PLAY)
        // =====================================================================
        function startLocalGame() {
          const roster =
            state.mode === "solo"
              ? [
                  { id: "human_1", name: state.soloName.trim() || "Player 1" },
                  ...Array.from({ length: state.botCount }, (_, i) => ({
                    id: "bot_" + (i + 1),
                    name: BOT_NAMES[i] || "Bot " + (i + 1),
                    isBot: true,
                  })),
                ]
              : state.localPlayers.map((p, idx) => ({
                  id: p.id,
                  name: p.name.trim() || "Player " + (idx + 1),
                }));

          state.activePlayers = roster;
          state.roundResults = [];
          state.usedLetters = [];
          beginLocalRound(1);
        }

        function beginLocalRound(roundNum) {
          const letter = state.letterMode === "manual" ? state.manualLetter.toUpperCase() : pickNextLetter(state.usedLetters);
          state.currentRound = roundNum;
          state.targetLetter = letter;
          if (!state.usedLetters.includes(letter)) state.usedLetters.push(letter);
          state.turnIndex = 0;
          state.roundSubmissions = [];
          state.appeals = {};
          state.answers = createEmptyAnswers();
          state.timeLeft = state.timerSeconds;
          state.paused = false;

          if (state.mode === "pass_and_play") {
            stopTimer();
            state.phase = "handoff";
          } else {
            state.phase = "playing";
            soundFx.playStart();
            startTimer();
          }
          render();
        }

        function submitLocalTurn(isTimeout = false) {
          stopTimer();
          const humans = state.activePlayers.filter((p) => !p.isBot);
          const currentPlayer = humans[state.turnIndex];
          if (!currentPlayer) return;

          if (isTimeout) soundFx.playTimeUp();
          else soundFx.playSubmit();

          state.roundSubmissions.push({ player: currentPlayer, answers: { ...state.answers } });

          if (state.turnIndex + 1 < humans.length) {
            state.turnIndex += 1;
            state.answers = createEmptyAnswers();
            state.timeLeft = state.timerSeconds;
            state.phase = "handoff";
            render();
            return;
          }

          const botSubs = state.activePlayers
            .filter((p) => p.isBot)
            .map((bot) => ({ player: bot, answers: pickBotAnswers(state.targetLetter, state.botDifficulty) }));

          state.roundSubmissions = [...state.roundSubmissions, ...botSubs];
          const scored = scoreRound(state.currentRound, state.targetLetter, state.roundSubmissions, state.appeals);
          state.roundResults = [...state.roundResults.filter((r) => r.roundNumber !== state.currentRound), scored];
          state.phase = "appeal";
          render();
        }

        function setLocalAppeal(playerId, catId, decision) {
          const existing = getAppealEntry(state.appeals, playerId, catId).decision;
          const nextDecision = existing === decision ? "auto" : decision;
          state.appeals = setAppealInMap(state.appeals, playerId, catId, nextDecision, "");
          const updated = scoreRound(state.currentRound, state.targetLetter, state.roundSubmissions, state.appeals);
          state.roundResults = state.roundResults.map((r) => (r.roundNumber === state.currentRound ? updated : r));
          render();
        }

        // =====================================================================
        // 7. VIEW RENDERERS
        // =====================================================================
        function renderTitle() {
          const modeTab = (id, label) => `
            <button type="button" data-action="set-mode" data-mode="${id}"

          } else {
            modePanel = `
              <div class="space-y-4 border-t border-slate-100 pt-5">
                <div>
                  <label for="online-name" class="block text-sm font-semibold text-slate-800">Your Display Name</label>
                  <input id="online-name" type="text" maxlength="24" value="${escapeHtml(state.onlineName)}"
                    class="mt-1.5 w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-600/20" />
                </div>
                ${state.onlineError ? `<p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}
                <div class="grid gap-3 sm:grid-cols-2">
                  <button type="button" data-action="create-online-room" ${state.onlineBusy ? "disabled" : ""}
                    class="rounded-lg bg-emerald-700 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-800 disabled:opacity-50">
                    ${state.onlineBusy ? "Connecting..." : "Create Online Room"}
                  </button>
                  <div class="flex gap-2">
                    <input id="join-code" type="text" maxlength="6" placeholder="CODE" value="${escapeHtml(state.joinCode)}"
                      class="w-28 rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-center font-mono-tabular text-sm font-bold uppercase tracking-widest focus:border-emerald-600 focus:outline-none" />
                    <button type="button" data-action="join-online-room" ${state.onlineBusy ? "disabled" : ""}
                      class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 hover:bg-slate-50 disabled:opacity-50">
                      Join
                    </button>
                  </div>
                </div>
                <p class="text-xs text-slate-500">
                  Play across phones, tablets, or laptops in real time via Firebase Firestore (${escapeHtml(firebaseConfig.projectId)}).
                </p>

          }

          return `
            <main class="mx-auto flex min-h-screen max-w-5xl flex-col justify-between px-4 py-6 sm:px-8 sm:py-10">
              <div class="space-y-8">
                <section class="flex flex-col gap-5 border-b border-slate-200 pb-6 md:flex-row md:items-center md:justify-between">
                  <div class="flex items-start gap-4">
                    <svg viewBox="0 0 64 64" class="h-12 w-12 shrink-0" aria-hidden="true">
                      <rect x="6" y="8" width="52" height="48" rx="10" fill="#065F46"></rect>
                      <rect x="10" y="12" width="44" height="40" rx="6" fill="#FFFFFF"></rect>
                      <line x1="16" y1="24" x2="48" y2="24" stroke="#E2E8F0" stroke-width="2"></line>
                      <line x1="16" y1="34" x2="48" y2="34" stroke="#E2E8F0" stroke-width="2"></line>
                      <line x1="16" y1="44" x2="38" y2="44" stroke="#E2E8F0" stroke-width="2"></line>
                      <circle cx="45" cy="43" r="10" fill="#059669" stroke="#FFFFFF" stroke-width="2.5"></circle>
                      <text x="45" y="47" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">അ</text>
                      <text x="32" y="21" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="800">A–Z</text>
                    </svg>
                    <div>
                      <p class="text-xs font-semibold tracking-wide text-emerald-700">പേര് · സ്ഥലം · മൃഗം · പൂവ് · സാധനം</p>
                      <h1 class="mt-1 text-2xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Name, Place, Animal, Thing</h1>

                        ${modeTab("solo", "Solo vs Bot")}

                      </div>
                    </div>
                    ${modePanel}
                  </section>

                  <section class="space-y-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-5">

                    <div class="grid grid-cols-2 gap-4">
                      <div>
                        <span class="block text-xs font-semibold text-slate-600">Rounds</span>
                        <div class="mt-1.5 flex gap-1 rounded-lg bg-slate-100 p-1">
                          ${[1, 3, 5].map((r) => `
                            <button type="button" data-action="set-rounds" data-rounds="${r}"
                              class="flex-1 rounded-md py-1.5 font-mono-tabular text-xs font-semibold ${state.totalRounds === r ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">${r}</button>`).join("")}

                            <button type="button" data-action="set-timer" data-sec="${s}"

                        </div>

                    <div class="space-y-3 border-t border-slate-100 pt-4">
                      <span class="block text-xs font-semibold text-slate-600">Starting Letter</span>
                      <div class="grid grid-cols-2 gap-1.5 rounded-lg bg-slate-100 p-1">
                        <button type="button" data-action="set-letter-mode" data-lmode="random"
                          class="rounded-md px-3 py-2 text-xs font-semibold ${state.letterMode === "random" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">Random Spin</button>
                        <button type="button" data-action="set-letter-mode" data-lmode="manual"
                          class="rounded-md px-3 py-2 text-xs font-semibold ${state.letterMode === "manual" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}">Pick A–Z</button>
                      </div>
                      ${state.letterMode === "manual" ? `
                        <div class="grid grid-cols-7 gap-1 pt-1">
                          ${ALPHABET.map((l) => `
                            <button type="button" data-action="set-manual-letter" data-letter="${l}"
                              class="h-8 rounded-md font-display text-xs font-bold ${state.manualLetter === l ? "bg-emerald-700 text-white" : "border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100"}">${l}</button>`).join("")}
                        </div>` : ""}
                    </div>

                    ${state.mode !== "online" ? `
                      <button type="button" data-action="start-local"
                        class="w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800 transition-colors">
                        Start Game
                      </button>` : ""}
                  </section>
                </div>
              </div>
              <p class="mt-8 pt-2 text-center text-xs text-slate-500">
                Enter to jump between categories · Esc to pause · Works with English or Malayalam input
              </p>
            </main>`;
        }

        function renderLobby() {
          const r = state.room;
          const players = getOrderedRoomPlayers(r);
          const isHost = r.hostId === myClientId;
          return `
            <main class="mx-auto max-w-2xl px-4 py-8 sm:px-6 sm:py-12">
              <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8 space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-5">
                  <div>
                    <p class="text-xs font-semibold text-emerald-700">Online Multiplayer · Firebase Firestore</p>
                    <h1 class="mt-1 font-display text-2xl font-extrabold text-slate-900">Room ${escapeHtml(r.roomCode)}</h1>
                    <p class="mt-0.5 text-xs text-slate-500 font-mono-tabular">${r.totalRounds} rounds · ${r.timerSeconds}s per round · ${r.letterMode === "manual" ? `Starting: ${escapeHtml(r.manualLetter || r.targetLetter || "K")}` : "Random letter"}</p>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" data-action="copy-room-code"
                      class="rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                      Copy Code
                    </button>
                    <button type="button" data-action="copy-invite-link"
                      class="rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                      Copy Invite Link
                    </button>
                  </div>
                </div>
                ${state.onlineError ? `<p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}
                <div>
                  <h2 class="text-sm font-bold text-slate-800">Connected Players (${players.length})</h2>
                  <ul class="mt-3 divide-y divide-slate-100 rounded-lg border border-slate-200">
                    ${players.map((p) => `
                      <li class="flex items-center justify-between px-4 py-2.5 text-sm">
                        <span class="font-semibold text-slate-900">${escapeHtml(p.name)}${p.id === myClientId ? " (You)" : ""}</span>
                        <span class="text-xs font-medium ${p.id === r.hostId ? "text-emerald-700 font-semibold" : "text-slate-500"}">${p.id === r.hostId ? "Host" : "Player"}</span>
                      </li>`).join("")}
                  </ul>
                  <p class="mt-2 text-xs text-slate-500">Share code <span class="font-mono-tabular font-bold text-slate-800">${escapeHtml(r.roomCode)}</span> with friends on any device to join this lobby.</p>
                </div>
                <div class="flex flex-col gap-3 sm:flex-row">
                  ${isHost
                    ? `<button type="button" data-action="start-online-round" class="flex-1 rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">Start Round 1</button>`
                    : `<div class="flex-1 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-center text-sm font-medium text-slate-600">Waiting for host to start Round 1...</div>`}
                  <button type="button" data-action="leave-online-room" class="rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">Leave Room</button>
                </div>
              </section>
            </main>`;
        }

        function renderHandoff() {
          const humans = state.activePlayers.filter((p) => !p.isBot);
          const player = humans[state.turnIndex];
          return `
            <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-4 py-10">
              <section class="w-full rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm">
                <p class="text-xs font-semibold text-slate-500 font-mono-tabular">
                  Round ${state.currentRound} of ${state.totalRounds} · Turn ${state.turnIndex + 1} of ${humans.length}
                </p>
                <h1 class="mt-2 font-display text-2xl font-extrabold text-slate-900 sm:text-3xl">
                  Pass device to ${escapeHtml(player.name)}
                </h1>
                <p class="mt-2 text-sm text-slate-600">
                  Previous answers are hidden. When ${escapeHtml(player.name)} is ready, reveal the sheet for letter
                  <span class="font-display font-extrabold text-emerald-800">${state.targetLetter}</span>.
                </p>
                <div class="mx-auto mt-6 flex h-16 w-16 items-center justify-center rounded-xl bg-emerald-700 font-display text-3xl font-extrabold text-white">
                  ${state.targetLetter}
                </div>
                <button type="button" data-action="reveal-handoff"
                  class="mt-7 w-full rounded-lg bg-emerald-700 px-5 py-3.5 text-sm font-bold text-white hover:bg-emerald-800">
                  Reveal ${escapeHtml(player.name)}'s Sheet
                </button>
              </section>
            </main>`;
        }

        function renderPlaying() {
          const isOnline = state.mode === "online" && state.room;
          const letter = isOnline ? state.room.targetLetter : state.targetLetter;
          const round = isOnline ? state.room.currentRound : state.currentRound;
          const totalRounds = isOnline ? state.room.totalRounds : state.totalRounds;
          const timeLeft = isOnline ? state.onlineTimeLeft : state.timeLeft;
          const maxSec = isOnline ? state.room.timerSeconds : state.timerSeconds;
          const players = isOnline ? getOrderedRoomPlayers(state.room) : [];
          const submittedIds = isOnline ? getOnlineSubmittedIds(state.room) : [];
          const playerName = isOnline
            ? ((state.room.playersMap && state.room.playersMap[myClientId] && state.room.playersMap[myClientId].name) || state.onlineName)
            : ((state.activePlayers.filter((p) => !p.isBot)[state.turnIndex] || {}).name);

          const ratio = maxSec > 0 ? Math.max(0, Math.min(100, (timeLeft / maxSec) * 100)) : 0;
          const urgent = timeLeft <= 10;
          const readyCount = CATEGORIES.filter((c) => validateWordForLetter(state.answers[c.id], letter, c.id).valid).length;

          return `
            <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur-sm">
              <div class="mx-auto flex max-w-4xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
                <div class="flex items-center gap-4 min-w-0">
                  <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-emerald-700 font-display text-2xl font-extrabold text-white">${letter}</div>
                  <div class="min-w-0">
                    <div class="text-xs font-semibold text-slate-500 font-mono-tabular">
                      Round ${round} of ${totalRounds}${isOnline ? ` · Room ${escapeHtml(state.room.roomCode)}` : ""}
                    </div>
                    <p class="truncate text-sm font-bold text-slate-900">${escapeHtml(playerName || "Player")}'s Sheet</p>
                  </div>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                  <div class="w-28 sm:w-36">
                    <div class="flex items-baseline justify-between text-xs font-semibold">
                      <span id="hud-timer-label" class="${urgent ? "text-red-700" : "text-slate-500"}">${urgent ? "Hurry" : "Time"}</span>
                      <span id="hud-timer-text" class="font-mono-tabular text-base font-bold ${urgent ? "text-red-700" : "text-slate-900"}">${timeLeft}s</span>
                    </div>
                    <div class="mt-1 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
                      <div id="hud-timer-bar" class="h-full transition-[width] duration-300 ${urgent ? "bg-red-600" : "bg-emerald-600"}" style="width:${ratio}%"></div>
                    </div>
                  </div>
                  <button type="button" data-action="toggle-mute"
                    class="rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                    ${soundFx.isMuted() ? "Unmute" : "Mute"}
                  </button>
                  ${!isOnline ? `
                    <button type="button" data-action="toggle-pause"
                      class="rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                      Pause
                    </button>` : ""}
                </div>
              </div>
            </header>

            <main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-8">
              <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
                <p class="text-sm font-medium text-slate-600">
                  Write a word starting with <span class="font-display text-base font-extrabold text-emerald-800">${letter}</span> for each category ·
                  <span id="ready-count" class="font-mono-tabular text-xs font-semibold text-slate-700">${readyCount}/5 ready</span>
                </p>
                <button type="button" data-action="toggle-hints"
                  class="rounded-lg border px-3 py-1.5 text-xs font-semibold ${
                    state.hintsEnabled ? "border-amber-300 bg-amber-50 text-amber-900" : "border-slate-200 bg-white text-slate-600"
                  }">
                  Word Hints: ${state.hintsEnabled ? "On" : "Off"}
                </button>
              </div>

              ${state.onlineError ? `<p class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-medium text-red-700">${escapeHtml(state.onlineError)}</p>` : ""}

              <form id="play-sheet-form" class="notebook-paper rounded-xl border border-slate-200 p-5 shadow-sm sm:p-7 space-y-5">
                ${CATEGORIES.map((cat, idx) => {
                  const val = state.answers[cat.id];
                  const v = validateWordForLetter(val, letter, cat.id);
                  const lbl = formatCatLabel(cat);
                  const showErr = val.trim().length > 0 && !v.valid;
                  const showOk = val.trim().length > 0 && v.valid;
                  const pool = state.hintsEnabled ? ((WORD_DICTIONARY[letter] || {})[cat.id] || []).slice(0, 4) : [];
                  return `
                    <div class="border-b border-slate-200/80 pb-5 last:border-b-0 last:pb-0">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <label for="cat-${cat.id}" class="flex items-baseline gap-2 text-base font-bold text-slate-900">
                          <span class="font-mono-tabular text-xs font-semibold text-slate-400">0${idx + 1}.</span>
                          <span>${escapeHtml(lbl.primary)}</span>
                          ${lbl.secondary ? `<span class="text-sm font-medium text-slate-500">${escapeHtml(lbl.secondary)}</span>` : ""}
                        </label>
                        <span id="status-${cat.id}" class="text-xs font-semibold ${
                          showOk ? "text-emerald-700" : showErr ? "text-red-700" : "hidden"
                        }">${showOk || showErr ? escapeHtml(v.message) : ""}</span>
                      </div>
                      <input id="cat-${cat.id}" data-cat="${cat.id}" data-idx="${idx}" type="text" autocomplete="off"
                        ${state.submittedOnline ? "disabled" : ""}
                        value="${escapeHtml(val)}"
                        placeholder="${escapeHtml(state.language === "malayalam" ? cat.placeholderMl : cat.placeholderEn)}"
                        class="cat-input mt-2 w-full rounded-lg border px-3.5 py-2.5 text-base font-medium text-slate-900 focus:outline-none focus:ring-2 ${
                          showErr
                            ? "border-red-400 bg-red-50/40 focus:border-red-600 focus:ring-red-600/15"
                            : showOk
                              ? "border-emerald-400 bg-emerald-50/20 focus:border-emerald-600 focus:ring-emerald-600/20"
                              : "border-slate-300 bg-white focus:border-emerald-600 focus:ring-emerald-600/20"
                        }" />
                      ${pool.length && !state.submittedOnline ? `
                        <div class="mt-2 flex flex-wrap items-center gap-1.5">
                          <span class="text-xs text-slate-400">Try:</span>
                          ${pool.map((w) => `
                            <button type="button" data-action="pick-hint" data-cat="${cat.id}" data-word="${escapeHtml(w)}"
                              class="rounded-md border border-slate-200 bg-slate-50 px-2 py-0.5 text-xs font-medium text-slate-700 hover:border-emerald-300 hover:bg-emerald-50">${escapeHtml(w)}</button>`).join("")}

                <div class="pt-2">
                  ${state.submittedOnline

                         Sheet submitted · Waiting for other players (${submittedIds.length}/${players.length})

            ${state.paused ? `
              <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4" role="dialog" aria-modal="true">
                <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-lg space-y-5">
                  <div>
                    <h2 class="font-display text-xl font-extrabold text-slate-900">Game Paused</h2>
                    <p class="mt-1 text-sm text-slate-600">Countdown timer is frozen while paused.</p>
